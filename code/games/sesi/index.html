<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>세시풍속 지킴이</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
/* VOICE: 초3이 직접 설계한 픽셀 모험 게임 — 신나고 또렷하게
   IDEA: 옛 민화 속 마을을 걷는 도트 게임기 화면
   PICTURE: 캔버스 속 시대별 마을(봄 들판·대보름 밤·추석 들녘·가을 산·설날 눈마을)
   COLOUR and TYPE: 쪽빛 바탕, 한지색 창, 단청 빨강·황금 노랑 강조 / Do Hyeon
   LAYOUT: 위 이동 바, 가운데 게임 화면, 아래 엽전·상점 */
:root{color-scheme:light;--ink:#2a1d14;--paper:#f6efdc;--deep:#23304a;--red:#c8402f;--gold:#f2c94c;--green:#2f7a5a;--sw:min(100%,calc((100dvh - 150px)*2/3),520px)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--deep);color:var(--ink);font:17px/1.45 "Do Hyeon",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 8px max(10px,env(safe-area-inset-bottom))}
.bar,.bar2{width:var(--sw);display:flex;align-items:center;gap:6px}
.stage{position:relative;width:var(--sw)}
canvas{display:block;width:100%;aspect-ratio:2/3;image-rendering:pixelated;border:3px solid var(--ink);border-radius:6px;background:#000;transition:filter .8s;touch-action:manipulation}
.btn{font:inherit;font-size:16px;min-height:44px;padding:0 12px;border:3px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.gold{background:var(--gold)}.btn.green{background:var(--green);color:#fff}.btn.red{background:var(--red);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.where{flex:1;text-align:center;color:var(--paper);line-height:1.1}
.where b{display:block;font-size:21px;font-weight:400}
.where small{font-size:13px;color:#c9d3e6}
.bar2{color:var(--paper);justify-content:space-between}
.coin{white-space:nowrap}.coin b{color:var(--gold);font-weight:400;font-size:21px}
#hint{font-size:13px;color:#c9d3e6;flex:1;text-align:center}
.dlg{position:absolute;left:8px;right:8px;bottom:8px;background:var(--paper);border:3px solid var(--ink);border-radius:6px;padding:10px 14px 12px;box-shadow:0 4px 0 var(--ink)}
.who{display:inline-block;background:var(--ink);color:var(--paper);padding:1px 10px;border-radius:4px;font-size:15px}
.dlg p{margin:6px 0 10px;font-size:19px;line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.modal{position:fixed;inset:0;background:rgba(15,20,35,.75);display:grid;place-items:center;padding:12px;z-index:5}
.panel{width:min(100%,460px);max-height:92dvh;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:8px;box-shadow:0 5px 0 var(--ink);padding:16px}
.panel h3{margin:0 0 4px;font-weight:400;font-size:26px;line-height:1.1}
.panel p{margin:6px 0 12px}
.tag{font-size:14px;color:#7a6650}
.q{font-size:21px;margin:8px 0 12px;line-height:1.35}
.opts{display:grid;gap:8px}
.opt{text-align:left;font-size:18px}
.opt.right{background:#bfe6c9}.opt.wrong{background:#f3c2b8}.opt.sel{background:var(--gold)}
.fb{min-height:26px;margin:12px 0 6px;font-size:17px}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:10px}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tapzone{position:relative;height:300px;background:#3f5c3a;border:3px solid var(--ink);border-radius:6px;overflow:hidden;touch-action:manipulation}
.tapzone.flowers{background:#8a7a4a}
.tapzone button{position:absolute;width:58px;height:58px;border:0;background:none;padding:0;cursor:pointer}
.tapzone img{width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
.status{display:flex;justify-content:space-between;font-size:19px;margin-bottom:8px}
.sticks{display:flex;gap:12px;justify-content:center;margin:14px 0}
.stick{width:34px;height:120px;border:3px solid var(--ink);border-radius:16px;display:grid;place-items:center;font-size:16px}
.stick.bae{background:#f3e2b8}.stick.deung{background:#9a6a3a;color:#fff}
.yutopts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rule{font-size:14px;background:#efe3c4;border-radius:6px;padding:8px 10px}
.title{position:fixed;inset:0;z-index:6;background:var(--deep);display:grid;place-items:center;padding:20px;text-align:center;color:var(--paper);overflow:auto}
.title h1{font-weight:400;font-size:clamp(40px,11vw,56px);line-height:1.05;margin:10px 0 6px;color:var(--gold);text-shadow:0 4px 0 var(--red)}
.title .big{width:130px;image-rendering:pixelated}
.title p{margin:6px 0 18px;color:#c9d3e6}
.tcol{display:grid;gap:10px;justify-items:center}
.tcol .btn{min-width:200px;font-size:19px}
.pets{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pets .btn{display:grid;justify-items:center;gap:4px;padding:10px;min-width:96px;min-height:120px}
.pets img{width:72px;image-rendering:pixelated}
.shopitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed #cdbf9f}
.shopitem img{width:40px;image-rendering:pixelated}
.shopitem span{flex:1}
.linkbtn{background:none;border:0;color:#9fb0cf;font:inherit;font-size:14px;text-decoration:underline;min-height:44px;cursor:pointer}
.pulse{animation:pulse 1s infinite}@keyframes pulse{50%{background:var(--gold)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  <header class="bar">
    <button class="btn" id="homeBtn">처음으로</button>

function interact(n){const st=stage();
 if(n.k==='tiger'){if(cur===0){if(!S.intro)return intro();
   const c=Object.keys(S.cleared).length;return say(n.who,c===5?'네 덕분에 세시풍속이 모두 돌아왔어. 진짜 지킴이야!':`지금까지 ${c}개 시대를 지켰어. ▶를 눌러서 계속 가 보자!`,[['응']])}
  const d=doneCount(st);return say(n.who,S.cleared[st.id]?`${st.name} 풍속이 다시 살아났어! 다음 시대로 가 보자.`:`${st.name} 시대를 지키는 중이야. 지금 ${d} / ${st.npcs.length}! 머리 위에 ?나 !가 있는 사람을 찾아봐.`,[['응']])}
 if(n.k==='shop')return say(n.who,'깍깍! 엽전을 모아 오면 멋진 물건을 줄게. 구경할래?',[['응',openShop],['나중에']]);
 if(isDone(st.id,n.id))return say(n.who,n.k==='q'?'다 맞혔구나! 문제를 다시 볼래?':'도와줘서 고마웠어! 한 번 더 할래?',[['응',()=>n.k==='q'?openQuiz(n):openGame(n)],['괜찮아']]);
 say(n.who,n.talk,[['응',()=>n.k==='q'?openQuiz(n):openGame(n)],['나중에']])}

/* ---------- 창(퀴즈·놀이·상점) ---------- */
function openModal(){$('#modal').hidden=false}
function stopTimers(){timers.forEach(t=>{clearInterval(t);clearTimeout(t)});timers=[]}
function closeModal(){stopTimers();$('#modal').hidden=true;updateUI();if(celebrate){const c=celebrate;celebrate=null;setTimeout(c,200)}}
function markDone(n){const sid=stage().id;S.done[sid]=S.done[sid]||{};S.done[sid][n.id]=1;
 const st=stage();if(!S.cleared[st.id]&&doneCount(st)===st.npcs.length){S.cleared[st.id]=1;S.coins+=30;
  celebrate=()=>say('호랑이 지킴이',`해냈다! ${st.name} 세시풍속이 다시 살아났어! 상으로 엽전 30냥이야.`,[['응',()=>{if(Object.keys(S.cleared).length===5&&!S.ending){S.ending=true;save();say('호랑이 지킴이','다섯 시대의 세시풍속을 모두 지켰어! 너는 이제 진짜 세시풍속 지킴이야. 정말 고마워!',[['응']])}}]])}
 save();updateUI()}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function openQuiz(n,i=0){openModal();qN=n;renderQ(i)}
function renderQ(i){const n=qN,q=n.qs[i];n._o=n._o||[];if(!n._o[i])n._o[i]=shuffle(q.o.map((_,k)=>k));const key=n.id+'-'+i,solved=!!S.solved[key],last=i===n.qs.length-1;
 panel.innerHTML=`<div class="tag">${n.who}의 퀴즈 · ${i+1} / ${n.qs.length}</div><div class="q">${q.q}</div><div class="opts">${n._o[i].map(k=>`<button class="btn opt ${solved&&k===0?'right':''}" data-k="${k}">${q.o[k]}</button>`).join('')}</div><div class="fb" id="fb">${solved?'✔ '+q.e:''}</div><div class="nav"><button class="btn" id="qp" ${i===0?'disabled':''}>◀ 이전</button><button class="btn" id="mx">닫기</button><button class="btn" id="qn" ${last?'disabled':''}>다음 ▶</button></div>`;
 panel.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
  if(k===0){panel.querySelectorAll('.opt').forEach(o=>o.classList.remove('wrong'));b.classList.add('right');let msg='✔ '+q.e;
   if(!S.solved[key]){S.solved[key]=1;S.coins+=10;msg='딩동댕! 엽전 +10냥 · '+q.e}
   $('#fb').textContent=msg;if(n.qs.every((_,j)=>S.solved[n.id+'-'+j])&&!isDone(stage().id,n.id))markDone(n);save();updateUI();
   (last?$('#mx'):$('#qn')).classList.add('gold')}
  else{b.classList.add('wrong');$('#fb').textContent='음… 다시 생각해 볼까?'}});
 $('#qp').onclick=()=>renderQ(i-1);$('#qn').onclick=()=>renderQ(i+1);$('#mx').onclick=closeModal}

function win(n,box){const g=n.g;let msg='성공! ';if(!S.games[n.id]){S.games[n.id]=1;S.coins+=20;msg+='엽전 +20냥 · '}msg+=g.e;
 if(!isDone(stage().id,n.id))markDone(n);save();updateUI();
 box.innerHTML=`<h3>${g.title}</h3><p class="q">${msg}</p><div class="nav"><span></span><button class="btn gold" id="mx">닫기</button></div>`;$('#mx').onclick=closeModal}

function openGame(n){openModal();stopTimers();const g=n.g;
 const shell=(body,ok)=>`<h3>${g.title}</h3><div class="tag">${n.who}의 ${n.k==='g'?'부탁':'놀이'}</div><p>${g.ask}</p>${body}<div class="fb" id="fb"></div><div class="nav"><button class="btn" id="mx">닫기</button>${ok||''}</div>`;
 if(g.type==='choose'){const sel=new Set();
  panel.innerHTML=shell(`<div class="items">${g.items.map((it,i)=>`<button class="btn opt" data-i="${i}">${it[0]}</button>`).join('')}</div>`,'<button class="btn green" id="gok">다 골랐어</button>');
  panel.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel')});
  $('#gok').onclick=()=>{const ok=g.items.every((it,i)=>!!it[1]===sel.has(i));if(ok)win(n,panel);else{const hot=g.items.some((it,i)=>!it[1]&&sel.has(i));$('#fb').textContent=hot?'앗, 불로 만든 뜨거운 음식이 들어 있어!':'아직 빠진 찬 음식이 있어!'}}}
 if(g.type==='tap'){const pic=img(ICONS[g.icon]);
  panel.innerHTML=shell(`<div class="status"><span>${g.icon==='nut'?'깬 부럼':'딴 국화'} <b id="cnt">0</b> / ${g.goal}</span><span>남은 시간 <b id="left">${g.time}</b>초</span></div><div class="tapzone ${g.flowers?'flowers':''}" id="zone"></div>`,'<button class="btn green" id="gstart">시작!</button>');
  const start=()=>{stopTimers();let c=0,left=g.time;const z=$('#zone');z.innerHTML='';$('#cnt').textContent=0;$('#left').textContent=left;$('#fb').textContent='';$('#gstart').disabled=true;
   const end=ok=>{stopTimers();z.innerHTML='';if(ok)win(n,panel);else{$('#fb').textContent='아쉽다! 한 번 더 해 볼까?';$('#gstart').disabled=false;$('#gstart').textContent='다시 하기'}};
   timers.push(setInterval(()=>{left--;$('#left').textContent=left;if(left<=0)end(false)},1000));
   timers.push(setInterval(()=>{const b=document.createElement('button');b.setAttribute('aria-label','누르기');b.innerHTML=`<img src="${pic}" alt="">`;
    b.style.left=Math.random()*Math.max(0,z.clientWidth-58)+'px';b.style.top=Math.random()*(z.clientHeight-58)+'px';
    b.onpointerdown=e=>{e.preventDefault();b.remove();c++;$('#cnt').textContent=c;if(c>=g.goal)end(true)};z.appendChild(b);setTimeout(()=>b.remove(),1500)},600))};
  $('#gstart').onclick=start}
 if(g.type==='order'){let step=0;const order=shuffle(g.steps.slice());
  panel.innerHTML=shell(`<div class="opts">${order.map(s=>`<button class="btn opt" data-s="${s}">${s}</button>`).join('')}</div>`);
  const btns=[...panel.querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{if(b.dataset.s===g.steps[step]){step++;b.disabled=true;b.classList.add('right');b.textContent=step+'. '+b.dataset.s;$('#fb').textContent='좋아!';if(step===g.steps.length)setTimeout(()=>win(n,panel),500)}
   else{step=0;btns.forEach(x=>{x.disabled=false;x.classList.remove('right');x.textContent=x.dataset.s});$('#fb').textContent='앗, 순서가 달라! 처음부터 다시 해 보자.'}})}
 if(g.type==='yut'){let ok=0,ans=null;const NAMES=['모','도','개','걸','윷'];
  panel.innerHTML=shell(`<div class="rule">평평한 면 <b>배</b>가 몇 개 보이는지 세어 봐! 배 1개 = 도 · 2개 = 개 · 3개 = 걸 · 4개 = 윷 · 0개 = 모</div><div class="status" style="margin-top:10px"><span>맞힌 횟수 <b id="cnt">0</b> / 3</span></div><div class="sticks" id="sticks"></div><div class="yutopts">${['도','개','걸','윷','모'].map(x=>`<button class="btn opt" data-n="${x}" disabled style="text-align:center">${x}</button>`).join('')}</div>`,'<button class="btn green" id="gthrow">윷 던지기</button>');
  const opts=[...panel.querySelectorAll('.opt')];
  $('#gthrow').onclick=()=>{const sticks=[0,0,0,0].map(()=>Math.random()<.5);const bae=sticks.filter(Boolean).length;ans=NAMES[bae];
   $('#sticks').innerHTML=sticks.map(b=>`<div class="stick ${b?'bae':'deung'}">${b?'배':'등'}</div>`).join('');
   opts.forEach(o=>{o.disabled=false;o.classList.remove('right','wrong')});$('#gthrow').disabled=true;$('#fb').textContent='이건 뭘까?'};
  opts.forEach(o=>o.onclick=()=>{if(o.dataset.n===ans){ok++;$('#cnt').textContent=ok;o.classList.add('right');opts.forEach(x=>x.disabled=true);
    if(ok>=3)return setTimeout(()=>win(n,panel),500);$('#fb').textContent='맞았어! 또 던져 봐.';$('#gthrow').disabled=false}
   else{o.classList.add('wrong');$('#fb').textContent='배를 다시 세어 볼까?'}})}
 $('#mx').onclick=closeModal}

function openShop(){openModal();renderShop()}
function renderShop(){panel.innerHTML=`<h3>까치 상점</h3><div class="tag">퀴즈 1개 맞히면 10냥 · 놀이·부탁 20냥 · 시대 지키면 30냥</div><p>지금 엽전 <b>${S.coins}</b>냥</p>${SHOP.map(it=>{let b;
  if(!own(it.id))b=`<button class="btn gold" data-buy="${it.id}" ${S.coins<it.price?'disabled':''}>${it.price}냥</button>`;
  else if(it.type==='hat')b=`<button class="btn ${S.hat===it.id?'green':''}" data-wear="${it.id}">${S.hat===it.id?'쓰는 중':'씌우기'}</button>`;
  else if(it.type==='outfit')b=`<button class="btn ${S.outfit===it.id?'green':''}" data-outfit="${it.id}">${S.outfit===it.id?'입는 중':'입기'}</button>`;
  else if(it.type==='pet')b=`<button class="btn ${S.pet===it.id?'green':''}" data-pet="${it.id}">${S.pet===it.id?'같이 다니는 중':'데리고 다니기'}</button>`;
  else b='<span class="tag">집에 걸었어요</span>';
  return `<div class="shopitem"><img src="${SHOPIMG[it.id]}" alt=""><span>${it.name}<br><small class="tag">${it.desc}</small></span>${b}</div>`}).join('')}<div class="nav"><span></span><button class="btn" id="mx">닫기</button></div>`;
 panel.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const it=SHOP.find(x=>x.id===b.dataset.buy);if(S.coins<it.price)return;S.coins-=it.price;S.owned.push(it.id);if(it.type==='hat')S.hat=it.id;if(it.type==='outfit')S.outfit=it.id;if(it.type==='pet')S.pet=it.id;save();updateUI();renderShop()});
 panel.querySelectorAll('[data-outfit]').forEach(b=>b.onclick=()=>{S.outfit=S.outfit?null:b.dataset.outfit;save();renderShop()});
 panel.querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>{S.pet=S.pet?null:b.dataset.pet;save();renderShop()});
 panel.querySelectorAll('[data-wear]').forEach(b=>b.onclick=()=>{S.hat=S.hat===b.dataset.wear?null:b.dataset.wear;save();renderShop()});
 $('#mx').onclick=closeModal}

/* ---------- 첫 화면 ---------- */
const TIGERIMG=img(SPR.tiger);
function showTitle(){$('#title').hidden=false;const has=!!S.started;
 $('#tbox').innerHTML=`<img class="big" src="${TIGERIMG}" alt="호랑이 지킴이"><h1>세시풍속<br>지킴이</h1><p>잊혀 가는 세시풍속을 지켜 줘!</p>
 <button class="btn gold" id="tgo">${has?'이어하기':'시작하기'}</button>${has?'<button class="linkbtn" id="treset">처음부터 다시 하기</button>':''}<div id="tconfirm"></div>`;
 $('#tgo').onclick=()=>{S.started=true;save();enter()};
 if(has)$('#treset').onclick=()=>{$('#tconfirm').innerHTML='<p>엽전이랑 기록이 다 지워져요. 정말 처음부터 할까요?</p><div class="row" style="justify-content:center"><button class="btn red" id="ty">지우기</button><button class="btn" id="tn">취소</button></div>';
  $('#ty').onclick=()=>{S={started:false,outfit:null,pet:null,coins:0,intro:false,seen:{},done:{},solved:{},games:{},owned:[],hat:null,cleared:{},ending:false};STAGES.forEach(s=>s.npcs.forEach(n=>delete n._o));save();showTitle()};$('#tn').onclick=()=>$('#tconfirm').innerHTML=''}}
function enter(){$('#title').hidden=true;go(0);if(!S.intro)setTimeout(intro,500)}

$('#homeBtn').onclick=()=>{closeDlg();showTitle()};
$('#prev').onclick=()=>go(cur-1);
$('#next').onclick=()=>{$('#next').classList.remove('pulse');go(cur+1)};
$('#shopBtn').onclick=()=>{closeDlg();openShop()};
cv.addEventListener('pointerdown',e=>{if(!$('#dlg').hidden||!$('#modal').hidden)return;const r=cv.getBoundingClientRect();
 const lx=(e.clientX-r.left)/r.width*W,ly=(e.clientY-r.top)/r.height*H;let best=null,bd=14;
 for(const n of npcList()){const d=Math.hypot(n.x-lx,(n.y-6)-ly);if(d<bd){bd=d;best=n}}
 if(best){const side=P.x<best.x?-1:1;P.tx=clampX(best.x+side*11);P.ty=clampY(best.y);pending=best}else{P.tx=clampX(lx);P.ty=clampY(ly);pending=null}});
document.addEventListener('keydown',e=>{if(!$('#title').hidden||!$('#modal').hidden)return;if(e.key==='ArrowLeft')go(cur-1);if(e.key==='ArrowRight')go(cur+1)});

updateUI();showTitle();requestAnimationFrame(frame);
}
</script>
</body>
