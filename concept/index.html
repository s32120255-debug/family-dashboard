<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>수학 개념 나무</title>
<link rel="manifest" href="manifest.json?v=1">
<link rel="icon" href="icon-192.png?v=1">
<link rel="apple-touch-icon" href="icon-192.png?v=1">
<meta name="theme-color" content="#2f5fa3">
<meta name="color-scheme" content="light only">
<script>
/* 늘 새 버전: 열 때와 다시 볼 때 version.json을 확인하고, 더 새 것이 있으면 다시 불러옴 */
(function(){var V="4";function chk(){fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){if(j&&j.v&&String(j.v)!==V){try{if(sessionStorage.getItem("mcv")===String(j.v))return;sessionStorage.setItem("mcv",String(j.v))}catch(e){}location.replace(location.pathname+"?v="+j.v+location.hash)}}).catch(function(){})}
chk();document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")chk()});})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fc;--grid:#e3e9f4;--card:#fff;--ink:#1d2a44;--sub:#5d6b85;--line:#d6dfee;--b:#2f5fa3;--b2:#4a78c2;--bs:#e9f0fb;--a:#e0782f;--as:#fde9da;--ok:#2f8a5a;--oks:#e2f3ea;--no:#b5452b;--nos:#fbe6e1;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
#app{max-width:640px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 120px}
h1,h2,.dh{font-family:'Do Hyeon',sans-serif;font-weight:400;margin:0}
h1{font-size:30px;color:var(--b)}
h2{font-size:22px}
.sub{color:var(--sub);font-size:15px}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 1px 0 #e7ecf5}
.btn{display:block;width:100%;border-radius:14px;padding:14px;margin-top:12px;font:400 22px 'Do Hyeon',sans-serif;color:#fff;background:var(--b)}
.btn.ghost{background:#fff;color:var(--b);border:1.5px solid var(--b)}
.btn:disabled{opacity:.4}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;background:var(--bs);color:var(--b)}
.row{display:flex;gap:8px;align-items:center}
.sp{flex:1}
/* 홈 계통도 */
.area{margin-top:16px}
.area h2{display:flex;align-items:center;gap:8px;font-size:21px;color:var(--b)}
.area h2 small{font-family:'Gowun Dodum';font-size:13px;color:var(--sub)}
.trunk{border-left:3px solid var(--b);margin:8px 0 0 10px;padding-left:14px}
.br{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;margin:7px 0;font-size:16px}
.br::before{content:"";position:absolute;left:-17px;top:50%;width:14px;border-top:3px solid var(--b)}
.br .n{color:var(--sub);font-size:13px}
.br .st{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.br.done .st{background:var(--b);border-color:var(--b)}
.br.half .st{border-color:var(--b);background:linear-gradient(90deg,var(--b) 50%,#fff 50%)}
.br.today{border-color:var(--a);background:var(--as)}
/* 학습 화면 */
.top{position:sticky;top:0;z-index:5;background:rgba(246,248,252,.96);margin:0 -16px;padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.steps{display:flex;gap:4px;margin-top:8px}
.steps button{flex:1 1 0;min-width:0;white-space:nowrap;line-height:1.35;border-radius:10px;padding:6px 2px;font-size:13px;background:#fff;border:1.5px solid var(--line);color:var(--sub)}
.steps button.on{border-color:var(--b);color:var(--b);font-weight:700;background:var(--bs)}
.steps button.ok{color:var(--ok)}
.dots{display:flex;gap:4px;margin-top:8px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.d{background:var(--b2)}.dots i.c{background:var(--a)}
.word{font-family:'Do Hyeon';font-size:40px;line-height:1.15;color:var(--ink)}
.en{color:var(--sub);font-size:14px;letter-spacing:.02em}
.fig{margin:10px auto 0;max-width:340px}
.fig svg{display:block;width:100%;height:auto}
.def{font-size:20px;margin-top:12px}
.def b{color:var(--b);background:var(--bs);border-radius:6px;padding:0 4px}
.lab{font-family:'Do Hyeon';font-size:15px;color:var(--sub);margin-top:14px}
.ex{background:var(--bs);border-radius:12px;padding:10px 12px;margin-top:4px;font-size:17px}
.warn{background:#fff7f2;border:1.5px dashed #f0b58b;border-radius:12px;padding:10px 12px;margin-top:4px;font-size:16px}
.warn s{color:var(--no);text-decoration-thickness:1.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:15px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 12px max(10px,env(safe-area-inset-bottom))}
.nav .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
.nav button{flex:1;border-radius:12px;padding:11px 4px;font:400 18px 'Do Hyeon';background:var(--bs);color:var(--b)}
.nav button.main{flex:1.4;background:var(--b);color:#fff}
.nav button:disabled{opacity:.35}
/* 블록 */
.slot{display:inline-block;min-width:74px;border-bottom:3px solid var(--b);margin:0 3px;padding:0 6px;text-align:center;color:var(--b);font-weight:700}
.slot.now{background:var(--as);border-color:var(--a);border-radius:6px 6px 0 0}
.slot.f{color:var(--ok);border-color:var(--ok)}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:18px;text-align:left}
.opt.blk{background:var(--bs);border-color:#b9cbe9;text-align:center;font-weight:700;color:var(--b)}
.opt.bad{background:var(--nos);border-color:#e9a898;color:var(--no);text-decoration:line-through}
.opt.good{background:var(--oks);border-color:#9fd1b5;color:var(--ok)}
.msg{margin-top:12px;border-radius:12px;padding:10px 12px;font-size:16px}
.msg.ok{background:var(--oks);color:#1f6b44}
.msg.no{background:var(--nos);color:#8a3320}
.msg.info{background:var(--bs);color:var(--b)}
.q{font-size:20px;margin-top:6px}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ox .opt{text-align:center;font:400 30px 'Do Hyeon'}
/* 말하기 */
.mic{display:grid;place-items:center;width:96px;height:96px;border-radius:50%;margin:16px auto 6px;background:var(--b);color:#fff;font-size:38px}
.mic.rec{background:var(--a)}
.center{text-align:center}
/* 복습 한 장: 가지 지도 */
.map{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.leaf{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border-left:4px solid var(--b);background:#fff;border-radius:0 12px 12px 0;padding:8px 12px}
.leaf .w{font-family:'Do Hyeon';font-size:19px;min-width:92px;color:var(--b)}
.leaf .m{font-size:15px;color:var(--ink)}
.leaf.hide .m{color:transparent;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 12px);border-radius:6px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,30,50,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:#fff;border-radius:20px 20px 0 0;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:18px 18px max(18px,env(safe-area-inset-bottom))}
.toast{font-size:14px;color:var(--sub);margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="nav"></div>
<div id="sheet"></div>
<script src="data.js?v=4"></script>
<script src="figs.js?v=4"></script>
<script src="nopair.js?v=4"></script>
<script>
"use strict";
/* ───────── 저장 (이 기기 안) ───────── */
const KEY='mathTree1';
let S={done:{},prog:{},miss:{},seen:{},spoke:{},last:null};
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j)S=Object.assign(S,j)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

/* ───────── 데이터 ───────── */
const AREAS=window.CARDS, BR=[], T={};
AREAS.forEach(a=>a.br.forEach(b=>{b.area=a;BR.push(b);b.t.forEach(t=>{t.b=b;T[t.w]=t})}));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
/* 뜻: [정답~오답~오답] → 덩어리 */
function parts(d){const out=[];let last=0;d.replace(/\[([^\]]+)\]/g,(m,inner,i)=>{out.push(d.slice(last,i));const o=inner.split('~');out.push({ans:o[0],opts:o});last=i+m.length});out.push(d.slice(last));return out}
const plain=d=>parts(d).map(p=>typeof p==='string'?p:p.ans).join('');
const defHTML=d=>parts(d).map(p=>typeof p==='string'?esc(p):'<b>'+esc(p.ans)+'</b>').join('');
/* 문제에서 답이 보이지 않게 낱말을 가림 */
const PART='은는이가을를의에도로과와만쪽';
const NAMES=Object.keys(T).concat(Object.keys(T).map(w=>w.replace(/\(.*\)/,'').trim()));
/* 낱말을 ○○로 가림. 더 긴 낱말의 앞부분(소수→소수점, 원주→원주율)은 가리지 않음 */
function mask(s,w){const base=w.replace(/\(.*\)/,'').trim();let r=s;[w,base].forEach(k=>{if(!k)return;const re=new RegExp('(^|[^가-힣])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+(k.length===1?'(?=$|[^가-힣]|['+PART+'])':''),'g');r=r.replace(re,(m,p,off,str)=>{const at=off+p.length;return NAMES.some(L=>L.length>k.length&&L.startsWith(k)&&str.startsWith(L,at))?m:p+'○○'})});return r}
const leaks=(s,w)=>s.includes(w.replace(/\(.*\)/,'').trim())||!!(window.EXLEAK&&EXLEAK[w]&&s.includes(EXLEAK[w]));
/* 오답 보기: 같은 가지 → 같은 영역 → 전체 순. 정답도 될 수 있는 낱말(nopair.js)은 빼요 */
function others(t,n){const no=(window.NOPAIR||{})[t.w]||{},ok=x=>x!==t&&!no[x.w];let pool=t.b.t.filter(ok);
  if(pool.length<n)pool=pool.concat(shuf(t.b.area.br.flatMap(b=>b.t).filter(x=>ok(x)&&!pool.includes(x))).slice(0,n-pool.length));
  if(pool.length<n)pool=pool.concat(shuf(BR.flatMap(b=>b.t).filter(x=>ok(x)&&!pool.includes(x))).slice(0,n-pool.length));
  return shuf(pool).slice(0,n)}

/* ───────── 화면 상태 ───────── */
const STEPS=[['card','📖 카드'],['block','🧩 블록'],['quiz','✏️ 문제'],['ox','⭕ O/X'],['talk','🎤 말하기'],['map','🌳 한 장']];
let V={view:'home'};
const $=s=>document.querySelector(s);
function nextBranch(){return BR.find(b=>!S.done[b.id])||BR[0]}

/* ───────── 홈: 계통도 ───────── */
function home(){
  const nb=S.last&&!S.done[S.last]?BR.find(b=>b.id===S.last):nextBranch();
  const total=BR.length,dn=BR.filter(b=>S.done[b.id]).length;
  const learned=Object.keys(S.seen).length, missN=Object.keys(S.miss).length;
  let h=`<div class="row"><h1>🌳 수학 개념 나무</h1></div>
  <div class="sub">하루에 가지 하나. 카드 보고, 블록 넣고, 풀고, 말해 봐요.</div>
  <div class="box"><div class="row"><span class="pill">${esc(nb.area.n)}</span><span class="sp"></span><span class="sub">${nb.t.length}장</span></div>
  <h2 style="margin-top:8px;font-size:28px">${esc(nb.n)}</h2>
  <div class="sub" style="margin-top:4px">${nb.t.map(t=>esc(t.w)).join(' · ')}</div>
  <button class="btn" data-go="${nb.id}">${S.prog[nb.id]?'이어서 하기':'오늘 가지 시작'}</button></div>
  <div class="box"><div class="row"><div class="dh" style="font-size:18px">내 나무</div><span class="sp"></span><span class="sub">가지 ${dn}/${total} · 만난 낱말 ${learned}${missN?` · 다시 볼 낱말 ${missN}`:''}</span></div>
  <div class="sub" style="font-size:13px;margin-top:2px">다른 가지가 궁금하면 눌러서 골라도 돼요.</div>`;
  AREAS.forEach(a=>{h+=`<div class="area"><h2>${esc(a.n)} <small>${a.br.filter(b=>S.done[b.id]).length}/${a.br.length}</small></h2><div class="trunk">`;
    a.br.forEach(b=>{const p=S.prog[b.id];h+=`<button class="br ${S.done[b.id]?'done':p?'half':''} ${b===nb?'today':''}" data-go="${b.id}"><span class="st">${S.done[b.id]?'✓':''}</span><span>${esc(b.n)}</span><span class="sp"></span><span class="n">${b.t.length}장</span></button>`});
    h+=`</div></div>`});
  h+=`</div><div class="toast center">기록은 이 기기에 저장돼요.</div>`;
  $('#app').innerHTML=h;$('#nav').innerHTML='';
}

/* ───────── 가지 학습 ───────── */
function open(id){const b=BR.find(x=>x.id===id);S.last=id;save();
  const p=S.prog[id]||{};V={view:'learn',b,step:p.step||0,i:0,st:{},rev:null};render()}
function stepDone(k){const p=S.prog[V.b.id]=S.prog[V.b.id]||{};p[k]=1;p.step=V.step;save()}
function learn(){
  const b=V.b,[key]=STEPS[V.step],p=S.prog[b.id]||{};
  let h=`<div class="top"><div class="row"><button class="sub" data-act="home">⏮ 처음으로</button><span class="sp"></span><span class="pill">${esc(b.area.n)} · ${esc(b.n)}</span></div>
  <div class="steps">${STEPS.map(([k,n],i)=>`<button class="${i===V.step?'on':''} ${p[k]?'ok':''}" data-step="${i}">${n.replace(' ','<br>')}${p[k]?' ✓':''}</button>`).join('')}</div>`;
  const list=listFor(key);
  if(list)h+=`<div class="dots">${list.map((_,i)=>`<i class="${i<V.i?'d':i===V.i?'c':''}"></i>`).join('')}</div>`;
  h+=`</div>`;
  h+=({card:cardView,block:blockView,quiz:quizView,ox:quizView,talk:talkView,map:mapView})[key]();
  $('#app').innerHTML=h;
  const last=V.i>=(list?list.length:1)-1;
  $('#nav').innerHTML=`<div class="nav"><div class="in"><button data-act="prev" ${V.step===0&&V.i===0?'disabled':''}>◀ 이전</button><button class="main" data-act="next">${last&&V.step===STEPS.length-1?'가지 완성':'다음 ▶'}</button></div></div>`;
  window.scrollTo(0,0);
}
function listFor(k){if(k==='map')return null;if(k==='quiz')return V.qs||(V.qs=makeQuiz());if(k==='ox')return V.oxq||(V.oxq=makeOx());return V.b.t}
function go(d){const k=STEPS[V.step][0],list=listFor(k),n=list?list.length:1;
  if(d>0){if(k==='card'){S.seen[V.b.t[V.i].w]=1;save()}
    if(V.i<n-1){V.i++;V.st={}}else{stepDone(k);if(V.step<STEPS.length-1){V.step++;V.i=0;V.st={};stepDone2()}else return finish()}}
  else{if(V.i>0){V.i--;V.st={}}else if(V.step>0){V.step--;const l=listFor(STEPS[V.step][0]);V.i=l?l.length-1:0;V.st={}}}
  render()}
function stepDone2(){const p=S.prog[V.b.id]=S.prog[V.b.id]||{};p.step=V.step;save()}

/* 1. 카드 */
function cardHTML(t,small){return `<div class="word">${esc(t.w)}</div><div class="en">${esc(t.en)}</div>
  ${t.fig?`<div class="fig">${FIG(t.fig,t.w)}</div>`:''}
  <div class="def">${defHTML(t.d)}</div>
  <div class="lab">예</div><div class="ex">${esc(t.ex)}</div>
  <div class="lab">헷갈리지 마</div><div class="warn"><s>${esc(t.x)}</s><br>→ ${esc(t.why)}</div>
  ${!small&&t.ln&&t.ln.length?`<div class="lab">이어지는 낱말</div><div class="chips">${t.ln.map(w=>`<button class="chip" data-peek="${esc(w)}">${esc(w)}</button>`).join('')}</div>`:''}`}
function cardView(){return `<div class="box">${cardHTML(V.b.t[V.i])}</div>`}

/* 2. 블록 넣기: 뜻의 빈칸에 블록을 골라 넣기. 두 번 틀리면 정답과 이유 */
function blockView(){const t=V.b.t[V.i],ps=parts(t.d),st=V.st;
  st.k=st.k||0;st.f=st.f||[];st.tries=st.tries||0;st.order=st.order||ps.filter(p=>typeof p!=='string').map(p=>shuf(p.opts));
  let bi=0;const line=ps.map(p=>{if(typeof p==='string')return esc(p);const i=bi++;if(st.f[i])return `<span class="slot f">${esc(p.ans)}</span>`;return `<span class="slot ${i===st.k?'now':''}">${i===st.k?'?':'　'}</span>`}).join('');
  const blanks=ps.filter(p=>typeof p!=='string');const allDone=st.f.filter(Boolean).length===blanks.length;
  let h=`<div class="box"><div class="sub">빈칸에 알맞은 블록을 넣어요</div><div class="word" style="font-size:32px;margin-top:4px">${esc(t.w)}</div><div class="def">${line}</div>`;
  if(!allDone){h+=`<div class="opts">${st.order[st.k].map(o=>`<button class="opt blk ${(st.bad||[]).includes(o)?'bad':''}" data-blk="${esc(o)}">${esc(o)}</button>`).join('')}</div>`}
  if(st.msg)h+=`<div class="msg ${st.msgc}">${st.msg}</div>`;
  if(allDone)h+=`<div class="msg ok">완성! 소리 내어 한 번 읽어 봐요.</div>`;
  return h+`</div>`}
function pickBlock(o){const t=V.b.t[V.i],st=V.st,bl=parts(t.d).filter(p=>typeof p!=='string'),cur=bl[st.k];
  if(o===cur.ans){st.f[st.k]=1;st.bad=[];st.tries=0;st.msg='';st.k++;if(st.f.filter(Boolean).length===bl.length&&st.miss0!==true){} }
  else{st.tries++;st.bad=(st.bad||[]).concat(o);markMiss(t.w);
    if(st.tries>=2){st.f[st.k]=1;st.msg=`정답은 「${esc(cur.ans)}」예요. ${esc(plain(t.d))}`;st.msgc='no';st.bad=[];st.tries=0;st.k++}
    else{st.msg='다시 골라 봐요.';st.msgc='info'}}
  render()}

/* 3. 문제: 뜻→낱말 / 예→낱말 / O·X, 두 번 틀리면 정답+이유 */
/* O/X: 낱말마다 맞는 문장·함정 문장 여러 개 (src/ox-*.txt) + 카드의 뜻·헷갈리지 마 */
function oxPool(t){return (t.ox||[]).map(o=>({truth:!!o[0],text:o[1],why:o[2]})).concat([{truth:false,text:t.x,why:t.why},{truth:true,text:`「${t.w}」: ${plain(t.d)}`,why:`「${t.w}」의 뜻 그대로예요.`}])}
function makeOx(){const a=[];V.b.t.forEach(t=>oxPool(t).forEach(o=>{if(!o.text.startsWith('「'))a.push({t,kind:'ox',...o})}));return shuf(a)}
function curQ(){const k=STEPS[V.step][0];return k==='map'?V.rev.qs[V.rev.i]:k==='ox'?V.oxq[V.i]:V.qs[V.i]}
function makeQuiz(){return shuf(V.b.t.map((t,i)=>qFor(t,['def','ex','ox'][i%3])))}
function qFor(t,kind){
  if(kind==='ox'){const p=oxPool(t),o=p[Math.floor(Math.random()*p.length)];return {t,kind,...o}}
  const text=kind==='def'?mask(plain(t.d),t.w):mask(t.ex,t.w);
  if(leaks(text,t.w))return kind==='def'?qFor(t,'ex2'):qFor(t,'ox');
  const opts=shuf([t].concat(others(t,2)));
  return {t,kind:kind==='ex2'?'ex':kind,opts,text}}
function quizView(){const q=curQ(),st=V.st;st.bad=st.bad||[];let h=`<div class="box">`;
  if(q.kind==='ox'){h+=`<div class="sub">맞으면 O, 틀리면 X${STEPS[V.step][0]==='ox'?` · ${V.i+1}/${V.oxq.length}`:''}</div><div class="q">${esc(q.text)}</div><div class="ox">${['O','X'].map(o=>`<button class="opt ${st.end&&((o==='O')===q.truth)?'good':''} ${st.bad.includes(o)?'bad':''}" data-ox="${o}">${o}</button>`).join('')}</div>`}
  else{h+=`<div class="sub">${q.kind==='def'?'이 뜻은 어떤 낱말일까요?':'이 예는 어떤 낱말일까요?'}</div><div class="q">${esc(q.text)}</div><div class="opts">${q.opts.map(o=>`<button class="opt ${st.end&&o===q.t?'good':''} ${st.bad.includes(o.w)?'bad':''}" data-qa="${esc(o.w)}">${esc(o.w)}</button>`).join('')}</div>`}
  if(st.msg)h+=`<div class="msg ${st.msgc}">${st.msg}</div>`;
  return h+`</div>`}
function answer(v){const q=curQ(),st=V.st;if(st.end)return;
  const ok=q.kind==='ox'?((v==='O')===q.truth):v===q.t.w;
  if(ok){st.end=1;st.msgc='ok';st.msg=q.kind==='ox'?'맞아요! '+esc(q.why):'맞아요! '+esc(plain(q.t.d));if(!st.bad.length)unMiss(q.t.w)}
  else{st.bad.push(v);markMiss(q.t.w);
    if(st.bad.length>=2||q.kind==='ox'){st.end=1;st.msgc='no';st.msg=q.kind==='ox'?`${q.truth?'O':'X'}예요. ${esc(q.why)}`:`정답은 「${esc(q.t.w)}」. ${esc(plain(q.t.d))}`}
    else{st.msgc='info';st.msg='한 번 더 생각해 봐요.'}}
  render()}
function markMiss(w){S.miss[w]=(S.miss[w]||0)+1;save()}
function unMiss(w){if(S.miss[w]){S.miss[w]--;if(S.miss[w]<=0)delete S.miss[w];save()}}

/* 4. 말하기: 녹음 → 들어 보기 → 뜻과 비교 */
let rec=null,chunks=[],audioURL={};
function talkView(){const t=V.b.t[V.i],st=V.st,has=!!(navigator.mediaDevices&&window.MediaRecorder);
  let h=`<div class="box center"><div class="sub">보지 않고 내 말로 뜻을 말해 봐요</div><div class="word" style="margin-top:8px">${esc(t.w)}</div>`;
  if(has)h+=`<button class="mic ${st.rec?'rec':''}" data-act="rec">${st.rec?'■':'🎤'}</button><div class="sub">${st.rec?'말하는 중… 다 말하면 ■':'눌러서 녹음'}</div>`;
  else h+=`<div class="msg info">소리 내어 말해 본 뒤 뜻을 열어 봐요.</div>`;
  if(audioURL[t.w])h+=`<audio controls src="${audioURL[t.w]}" style="width:100%;margin-top:10px"></audio>`;
  h+=`<button class="btn ghost" data-act="reveal">${st.show?'뜻 숨기기':'뜻 열어 보기'}</button>`;
  if(st.show)h+=`<div class="def" style="text-align:left">${defHTML(t.d)}</div><div class="row" style="margin-top:12px;gap:8px"><button class="btn" style="margin:0" data-act="said">비슷하게 말했어요</button><button class="btn ghost" style="margin:0" data-act="again">다시 해 볼래요</button></div>`;
  if(S.spoke[t.w])h+=`<div class="toast">✓ 말하기 ${S.spoke[t.w]}번</div>`;
  return h+`</div>`}
async function toggleRec(){const t=V.b.t[V.i],st=V.st;
  if(st.rec&&rec){rec.stop();return}
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(s);
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{s.getTracks().forEach(x=>x.stop());if(audioURL[t.w])URL.revokeObjectURL(audioURL[t.w]);audioURL[t.w]=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||'audio/webm'}));st.rec=0;render()};
    rec.start();st.rec=1;render()}
  catch(e){st.rec=0;alert('마이크를 쓸 수 없어요. 소리 내어 말한 뒤 뜻을 열어 봐요.');render()}}

/* 5. 복습 한 장: 오늘 가지 지도 + 지난 낱말 다시 */
function mapView(){const b=V.b;
  if(!V.rev){const old=Object.keys(S.miss).map(w=>T[w]).filter(t=>t&&t.b!==b);const seenOld=Object.keys(S.seen).map(w=>T[w]).filter(t=>t&&t.b!==b&&!S.miss[t.w]);
    const pick=shuf(old).slice(0,3).concat(shuf(seenOld).slice(0,Math.max(0,3-Math.min(3,old.length))));
    V.rev={hide:{},qs:pick.map((t,i)=>qFor(t,['def','ox','ex'][i%3])),i:0};V.rev.st={}}
  const R=V.rev;let h=`<div class="box"><div class="dh" style="font-size:22px;color:var(--b)">🌳 ${esc(b.area.n)} › ${esc(b.n)}</div><div class="sub">뜻을 가리고 떠올려 봐요. 누르면 열려요.</div><div class="map">`;
  b.t.forEach(t=>{const sh=R.hide[t.w]!==0;h+=`<button class="leaf ${sh?'hide':''}" data-leaf="${esc(t.w)}"><span class="w">${esc(t.w)}</span><span class="m">${esc(plain(t.d))}</span></button>`});
  h+=`</div></div>`;
  if(R.qs.length){const q=R.qs[R.i];if(q){const st=V.st=R.st;st.bad=st.bad||[];h+=`<div class="box"><div class="row"><div class="dh" style="font-size:18px">지난 가지 다시 ${R.i+1}/${R.qs.length}</div><span class="sp"></span><span class="pill">${esc(q.t.b.n)}</span></div>`;
    if(q.kind==='ox')h+=`<div class="q">${esc(q.text)}</div><div class="ox">${['O','X'].map(o=>`<button class="opt ${st.end&&((o==='O')===q.truth)?'good':''} ${st.bad.includes(o)?'bad':''}" data-ox="${o}">${o}</button>`).join('')}</div>`;
    else h+=`<div class="q">${esc(q.text)}</div><div class="opts">${q.opts.map(o=>`<button class="opt ${st.end&&o===q.t?'good':''} ${st.bad.includes(o.w)?'bad':''}" data-qa="${esc(o.w)}">${esc(o.w)}</button>`).join('')}</div>`;
    if(st.msg)h+=`<div class="msg ${st.msgc}">${st.msg}</div>`;
    if(st.end)h+=`<button class="btn ghost" data-act="revnext">${R.i<R.qs.length-1?'다음 문제':'다 했어요'}</button>`;
    h+=`</div>`}else h+=`<div class="box center sub">지난 가지 복습 끝 ✓</div>`}
  return h}

function finish(){const b=V.b;S.done[b.id]=today();const p=S.prog[b.id]=S.prog[b.id]||{};p.map=1;b.t.forEach(t=>S.seen[t.w]=1);save();
  const nb=nextBranch();
  $('#app').innerHTML=`<div class="box center" style="margin-top:40px"><div style="font-size:48px">🌿</div><h2 style="font-size:30px;color:var(--b)">「${esc(b.n)}」 가지 완성</h2>
  <div class="sub" style="margin-top:6px">${b.t.map(t=>esc(t.w)).join(' · ')}</div>
  ${S.done[nb.id]?'':`<button class="btn" data-go="${nb.id}">다음 가지도 할래요: ${esc(nb.n)}</button>`}
  <button class="btn ghost" data-act="home">오늘은 여기까지</button></div>`;
  $('#nav').innerHTML=''}

/* 이어지는 낱말 살짝 보기 */
function peek(w){const t=T[w];if(!t)return;$('#sheet').innerHTML=`<div class="sheet" data-act="close"><div class="in" onclick="event.stopPropagation()"><div class="row"><span class="pill">${esc(t.b.area.n)} · ${esc(t.b.n)}</span><span class="sp"></span><button class="sub" data-act="close">닫기 ✕</button></div><div style="margin-top:8px">${cardHTML(t,true)}</div></div></div>`}

function render(){if(V.view==='home')home();else learn()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-act],[data-step],[data-blk],[data-qa],[data-ox],[data-peek],[data-leaf]');if(!el)return;const d=el.dataset;
  if(d.go){open(d.go);return}
  if(d.peek){peek(d.peek);return}
  if(d.step!==undefined){V.step=+d.step;V.i=0;V.st={};V.rev=null;stepDone2();render();return}
  if(d.blk!==undefined){pickBlock(d.blk);return}
  if(d.qa!==undefined||d.ox!==undefined){answer(d.qa!==undefined?d.qa:d.ox);return}
  if(d.leaf!==undefined){V.rev.hide[d.leaf]=V.rev.hide[d.leaf]===0?1:0;render();return}
  const a=d.act;
  if(a==='home'){V={view:'home'};render()}
  else if(a==='close')$('#sheet').innerHTML='';
  else if(a==='next')go(1);else if(a==='prev')go(-1);
  else if(a==='rec')toggleRec();
  else if(a==='reveal'){V.st.show=!V.st.show;render()}
  else if(a==='said'){const w=V.b.t[V.i].w;S.spoke[w]=(S.spoke[w]||0)+1;save();go(1)}
  else if(a==='again'){V.st={};render()}
  else if(a==='revnext'){V.rev.i++;V.rev.st={};render()}
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
