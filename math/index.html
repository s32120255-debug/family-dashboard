<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>

<body><title>시훈 연산</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 폰 세로 한 화면 앱. 위 막대(처음으로·진행·시계) + 모눈 공책 한 장 + 아래 큰 숫자 키패드.
   사고력 공책 앱과 같은 종이·파란 모눈·연필 잉크. 한 가지 밝은 종이 테마로 고정(일부러). */
:root{
  --paper:#fbfaf4; --paper-2:#f3f1e7; --card:#ffffff; --ink:#262a31; --ink-2:#5d5a52;
  --grid:rgba(64,112,168,.16); --blue:#2f5fa3; --blue-soft:#e3ebf7; --amber:#b5651d; --amber-soft:#fbeedd;
  --green:#2e7d55; --green-soft:#e2f1e8; --hl:#ffd84d; --line:#dfdacb; --on-blue:#ffffff;
  --f-ui:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-disp:"Do Hyeon","Gowun Dodum","Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:17px;overflow:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  -webkit-user-select:none;user-select:none;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;min-height:0;max-width:560px;margin:0 auto;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:30px}h2{font-size:24px}h3{font-size:20px}
p{margin:0;line-height:1.6}
.tab{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}.small{font-size:14px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;-webkit-user-select:text;user-select:text}
textarea{width:100%;box-sizing:border-box;min-height:110px;font-size:12px;font-family:ui-monospace,monospace}

/* 위 막대 */
.bar{display:flex;align-items:center;gap:8px;padding-block:8px;flex:none;border-bottom:1px solid var(--line);background:var(--paper)}
.bar .sp{flex:1}
.pv{flex:none;background:var(--hl);color:var(--ink);font-size:14px;text-align:center;padding:6px 8px;border-radius:0 0 10px 10px}
.pv button{text-decoration:underline;font-size:14px}
.ans-pv{font-size:15px;color:var(--ink-2)}
.bar .where{font-family:var(--f-disp);font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nb{min-height:44px;padding:0 14px;border-radius:12px;background:var(--paper-2);border:1px solid var(--line);font-size:16px;white-space:nowrap}
.nb:active,.chip:active,.key:active,.bigbtn:active{transform:translateY(1px)}
.nb[disabled]{opacity:.35}
.nb.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.lives{display:flex;gap:8px;align-items:center;justify-content:center;padding-top:8px;min-height:22px;flex:none}
.lives i{width:16px;height:16px;border-radius:50%;border:2px solid var(--blue);display:block}.lives i.f{background:var(--blue)}
.clockwrap{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.goal{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:2px}
.clock{font-family:var(--f-disp);font-size:38px;min-width:84px;text-align:right;font-variant-numeric:tabular-nums}
.prog{font-family:var(--f-disp);font-size:20px;color:var(--blue)}

.page{flex:1;min-height:0;overflow-y:auto;padding-block:16px 40px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;background:var(--paper-2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--green-soft);border-color:#bfe0cc;color:#1f5e3e}
.pill.new{background:var(--blue-soft);border-color:#c5d4ec;color:#1f447d}
.pill.warm{background:var(--amber-soft);border-color:#efd3b0;color:#7a4313}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-width:62px;min-height:52px;padding:0 14px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:19px;font-family:var(--f-disp)}
.chip.on{border-color:var(--blue);background:var(--blue-soft)}
.bigbtn{min-height:62px;padding:0 24px;border-radius:16px;background:var(--blue);color:var(--on-blue);font-family:var(--f-disp);font-size:24px;width:100%}
.bigbtn.ghost{background:var(--card);color:var(--blue);border:2px solid var(--blue)}
.bigbtn[disabled]{opacity:.35}
.notice{background:var(--blue-soft);border:1px solid #c5d4ec;border-radius:14px;padding:12px 14px;line-height:1.6}
.notice.warm{background:var(--amber-soft);border-color:#efd3b0}
.notice.good{background:var(--green-soft);border-color:#bfe0cc}

/* 홈 */
.next{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--blue);color:var(--on-blue);border-radius:18px;padding:18px}
.next .k{font-size:15px;opacity:.85}
.next .v{font-family:var(--f-disp);font-size:30px}
.plan{display:flex;flex-direction:column;gap:8px}
.pitem{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:64px}
.pitem .nm{font-family:var(--f-disp);font-size:21px}
.pitem .ex{font-size:14px;color:var(--ink-2);grid-column:1}
.pitem.done{background:var(--green-soft);border-color:#bfe0cc}
.dots{display:flex;gap:5px;grid-row:1/3;grid-column:2;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--blue);display:block}
.dots i.f{background:var(--blue)}
.dots i.c{border-style:dashed}
.side{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;min-height:64px;display:flex;flex-direction:column;gap:2px}
.side b{font-family:var(--f-disp);font-weight:400;font-size:19px}
.side span{font-size:13px;color:var(--ink-2)}
.gate{position:relative;overflow:hidden}
.gate .fill{position:absolute;left:0;bottom:0;height:4px;background:var(--blue);width:0}
.gate.hold .fill{width:100%;transition:width 1.2s linear}

/* 문제 */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:safe center;overflow-y:auto;align-items:center;gap:8px;padding-block:4px;text-align:center}
.qline{font-family:var(--f-disp);font-size:44px;line-height:1.35;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 8px;font-variant-numeric:tabular-nums}
.qline.mid{font-size:34px}
.qline.txt{font-size:28px}
.fbox{border:3px solid var(--blue);border-radius:12px;padding:0 12px;background:var(--card);color:var(--blue)}
.arr{color:var(--ink-2);font-size:.8em}
.ph{display:inline-block;width:.6em;height:.9em}
.box .fr{font-size:.7em}
.box:has(.fr){width:auto;min-width:72px;height:auto;min-height:64px;padding:2px 10px;display:inline-flex;align-items:center;gap:4px}
.bk h4{margin:10px 0 4px;font-size:15px}.bk ol{margin:0;padding-left:22px}.bk li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line)}.bk li b{color:var(--blue)}.bk li.bad b{color:var(--ink)}.bk li.bad{background:rgba(230,120,40,.08)}
details.card summary{cursor:pointer;padding:4px 0}
.ftab{border-collapse:collapse;font-size:24px}.ftab th{font-size:15px;font-family:var(--f-body,inherit);padding:4px 6px;text-align:left;color:var(--ink-2)}.ftab td{border:2px solid var(--line);min-width:48px;height:52px;text-align:center;padding:2px;background:var(--card)}
.ftab .box{width:46px;height:46px;font-size:24px}
.qline.stack{flex-direction:column;gap:10px}
.qline .sub{display:flex;align-items:center;gap:8px;white-space:nowrap}
.qline.five .box{min-width:1.9em;padding:0 .1em}
.qline.five .sub{gap:6px}
.box{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;height:1.3em;padding:0 .2em;border:3px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.box.act{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.box.ok{border-color:var(--green);background:var(--green-soft)}
.box.again{animation:nudge .32s}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateX(-6px)}70%{transform:translateX(6px)}}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-size:.8em;gap:2px}
.fr>span:first-child{border-bottom:3px solid currentColor;padding:0 .15em 2px}
.fr .box{font-size:1em}
.cnt{font-family:var(--f-disp);font-size:24px;color:var(--on-blue);background:var(--blue);border-radius:10px;padding:2px 18px}
.stage>*{flex:none}
.found{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:0}
.found span{font-family:var(--f-disp);font-size:24px;background:var(--green-soft);border:2px solid var(--green);border-radius:10px;padding:0 10px}
.say{font-size:18px;color:var(--ink-2);min-height:1.6em}
.say.blue{color:var(--blue)}
.fig{width:min(100%,300px,32vh);flex:none}.fig:has(svg.wide){width:min(100%,360px)}
.fig svg{display:block;width:100%;height:auto;touch-action:manipulation}

/* 키패드 */
.pad{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-block:8px 12px}
.key{height:62px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-family:var(--f-disp);font-size:32px;box-shadow:0 2px 0 var(--line)}
.key.nk{background:var(--blue-soft,#dbe6f5);color:var(--blue)}
.key.fn{font-size:20px;background:var(--paper-2)}
.key.go{background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-size:24px}
.ox{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:8px 14px}
.ox button{height:110px;border-radius:18px;background:var(--card);border:2px solid var(--line);font-family:var(--f-disp);font-size:64px}
.under{flex:none;display:flex;gap:8px;justify-content:space-between;padding-top:4px}

/* 풀이 순서 틀 */
.steps{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.st{display:flex;gap:6px 8px;align-items:center;font-family:var(--f-disp);font-size:21px;line-height:1.5;flex-wrap:wrap;padding:8px 12px;border-radius:12px;font-variant-numeric:tabular-nums}
.st .n{font-size:16px;color:var(--blue);min-width:1.4em}
.st.done{color:var(--ink-2)}
.st.cur{background:var(--card);border:1px solid var(--line)}
.st .box{font-size:24px}
.hint{font-size:17px;line-height:1.6;color:var(--blue);background:var(--blue-soft);border-radius:12px;padding:10px 12px;text-align:left;width:100%;box-sizing:border-box}

/* 결과 */
.big{font-family:var(--f-disp);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.facts{display:flex;flex-direction:column;gap:8px}
.facts p{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.facts p.star{background:var(--green-soft);border-color:#bfe0cc}
.bars{width:100%}
.bars svg{display:block;width:100%;height:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.kv dt{color:var(--ink-2)}.kv dd{margin:0}

/* 모달 */
.veil{position:fixed;inset:0;background:rgba(38,42,49,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.sheet{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}

/* 부모 화면 */
.prow{display:flex;flex-direction:column;gap:8px;padding-block:10px;border-bottom:1px dashed var(--line)}
.prow:last-child{border-bottom:0}
.prow .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prow .nm{font-family:var(--f-disp);font-size:19px;flex:1;min-width:120px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:40px;height:40px;border-radius:10px;background:var(--paper-2);border:1px solid var(--line);font-size:20px}
.stepper b{min-width:2.2em;text-align:center;font-family:var(--f-disp);font-size:20px;font-weight:400}
.more{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px}
.more label{display:flex;flex-direction:column;gap:4px}
.more input{width:100%;box-sizing:border-box}
.more input[type="checkbox"]{width:22px;height:22px;flex:none}
.more .full{grid-column:1/3}
.code{font-size:12px;padding:1px 6px;border-radius:5px;background:var(--blue-soft);color:var(--blue)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-weight:400;color:var(--ink-2);font-size:12px}
.scrollx{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.homeplan{margin:6px 0}.homeplan>summary{cursor:pointer;padding:12px 4px;color:var(--muted,#777);font-size:15px;list-style:none}.homeplan>summary::-webkit-details-marker{display:none}.homeplan>summary::before{content:"▸ "}.homeplan[open]>summary::before{content:"▾ "}
</style>

<div id="app"></div>

<script>
"use strict";
/* ───────── 도구 ───────── */
const $=s=>document.querySelector(s);
const app=$("#app");
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=sec=>{sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")};
const parseT=s=>{s=String(s||"").trim();if(!s)return null;const m=s.match(/^(\d+):(\d{1,2})$/);if(m)return +m[1]*60+ +m[2];const n=parseFloat(s);return n>0?n:null};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dayLabel=k=>{const [y,m,d]=k.split("-").map(Number);const w="일월화수목금토"[new Date(y,m-1,d).getDay()];return `${m}월 ${d}일 ${w}요일`};
const LD=v=>+String(v).replace(/\D/g,"").slice(-1),BC=v=>![2,4,5,9].includes(LD(v)),ro=v=>[3,6,0].includes(LD(v))?"으로":"로",eun=v=>BC(v)?"은":"는",eul=v=>BC(v)?"을":"를",iga=v=>BC(v)?"이":"가";
const STEPT=T=>!!(T.steps7||T.lv),stepLabel=(T,k)=>T.seq?T.seq(k).label:T.lv[Math.min(k,T.lv.length-1)],stepMax=T=>T.seq?(T.nseq||3)-1:T.lv.length-1;
const GCD=(a,b)=>b?GCD(b,a%b):a,LCM=(a,b)=>a/GCD(a,b)*b,gwa=v=>BC(v)?"과":"와";
const decS=n=>{const w=Math.floor(n/100),f=String(n%100).padStart(2,"0").replace(/0+$/,"");return f?w+"."+f:String(w)},decParts=n=>{const w=Math.floor(n/100),f=String(n%100).padStart(2,"0").replace(/0+$/,"");return[String(w),f]};
const seqOf=p=>{const q=[];let v=p.s,d=p.k;for(let i=0;i<5;i++){q.push(v);if(p.L===0)v+=p.k;else if(p.L===1)v*=p.k;else{v+=d;d++}}return q};
const barSVG=(n,k)=>{const W=300/n;let r="";for(let i=0;i<n;i++)r+=`<rect x="${2+i*W*0.987}" y="4" width="${W*0.987}" height="40" fill="${i<k?"#f2c94c":"#fff"}" stroke="#333" stroke-width="2"/>`;return `<svg class="wide" viewBox="0 0 300 48" style="width:100%">${r}</svg>`};
const barsSVG=(w,k,n)=>{const W=296/n;let r="";for(let b=0;b<=w;b++)for(let i=0;i<n;i++)r+=`<rect x="${2+i*W}" y="${4+b*40}" width="${W}" height="32" fill="${b<w||i<k?"#f2c94c":"#fff"}" stroke="#333" stroke-width="2"/>`;return `<svg class="wide" viewBox="0 0 300 ${8+(w+1)*40}" style="width:100%">${r}</svg>`};
const fcVal=X=>X.d?((X.w||0)*X.d+X.n)/X.d:X.w,fcN=(X,D)=>X.d?(X.w||0)*X.d+X.n:X.w*D,fcCmp=(A,B)=>{const a=fcVal(A),b=fcVal(B);return Math.abs(a-b)<1e-9?"0":a>b?"1":"2"};
const fcV=X=>X.d?(X.w?`${X.w} ${fr(X.n,X.d)}`:fr(X.n,X.d)):String(X.w),fcT=X=>X.d?(X.w?X.w+"과":"")+X.n+"/"+X.d:String(X.w);
const fAns=(N,D)=>{const g=GCD(N,D),n=N/g,d=D/g;if(d===1)return{a:String(n),alts:[]};const W=Math.floor(n/d),r=n%d;return W?{a:`${W}&${r}\\${d}`,alts:[[`${n}\\${d}`]]}:{a:`${n}\\${d}`,alts:[]}};
const fmLeft=p=>{const{L,n,d,k,w,n2,d2}=p;return L===2?`${k} × ${fr(n,d)}`:L<=1?`${fr(n,d)} × ${k}`:L===3?`${w} ${fr(n,d)} × ${k}`:`${w?w+" ":""}${fr(n,d)} × ${fr(n2,d2)}`};

/* 곱셈 오답 모양 */
function multPat(x,c,g){
  const ans=x*c;g=+g;if(!(g>=0))return "";
  const ds=String(x).split("").map(Number);
  const noCarry=+(String(ds[0]*c)+ds.slice(1).map(d=>(d*c)%10).join(""));
  if(g===noCarry&&noCarry!==ans)return "받아올림 빠뜨림";
  const glued=+ds.map(d=>d*c).join("");
  if(g===glued)return "곱을 나란히 붙임";
  const parts=ds.map((d,i)=>d*Math.pow(10,ds.length-1-i)*c).filter(v=>v>0);
  if(parts.includes(g))return "한 부분만 곱함";
  if(Math.abs(g-ans)===c)return "한 번 더/덜 곱함";
  if(g%10!==ans%10)return "일의 자리 틀림";
  return "앞자리 틀림";
}
function splitSteps(x,c){
  const ds=String(x).split("").map(Number),L=ds.length;
  const pv=ds.map((d,i)=>d*Math.pow(10,L-1-i));
  const nz=pv.filter(v=>v>0);
  const st=[{h:`${x} = ${nz.slice(0,-1).join(" + ")} + [[0]]`,a:[String(nz[nz.length-1])],hints:[`${x}에서 ${nz.slice(0,-1).join(" + ")}를 빼면 얼마가 남을까?`]}];
  nz.forEach(v=>{
    const lead=String(v).replace(/0+$/,""),zeros=String(v).length-lead.length;
    st.push({h:`${v} × ${c} = [[0]]`,a:[String(v*c)],hints:zeros?[`${lead} × ${c}${eun(c)} 얼마야? ${v}${eun(v)} ${lead}의 ${Math.pow(10,zeros)}배니까, 곱도 몇 배가 될까?`,`${lead} × ${c} = ${+lead*c}. 여기에 0을 몇 개 붙여야 할까?`]:[`${c}단에서 ${v}번째 수는?`]});
  });
  st.push({h:`${nz.map(v=>v*c).join(" + ")} = [[0]]`,a:[String(x*c)],hints:["위에서 구한 곱들을 더해 볼까? 일의 자리부터 더하면 쉬워."]});
  return st;
}

const CO={o:34,u:34,max:6};
function coordSVG(pt,user,clickable,showPt=true){
  const {o,u,max}=CO,W=o+u*max+18,H=W,y0=H-o;

  s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="var(--card)" rx="10"/>`;

    s+=`<line x1="${o+i*u}" y1="${y0}" x2="${o+i*u}" y2="${y0-max*u}" stroke="var(--grid)" stroke-width="1.5"/>`;
    s+=`<line x1="${o}" y1="${y0-i*u}" x2="${o+max*u}" y2="${y0-i*u}" stroke="var(--grid)" stroke-width="1.5"/>`;
    s+=`<text x="${o+i*u}" y="${y0+22}" text-anchor="middle" font-size="16" fill="var(--ink-2)" font-family="Do Hyeon,sans-serif">${i}</text>`;
    if(i>0)s+=`<text x="${o-12}" y="${y0-i*u+6}" text-anchor="middle" font-size="16" fill="var(--ink-2)" font-family="Do Hyeon,sans-serif">${i}</text>`;
  }

  if(user)s+=`<circle cx="${o+user[0]*u}" cy="${y0-user[1]*u}" r="10" fill="var(--hl)" stroke="var(--ink)" stroke-width="2"/>`;

}
function svgToCoord(svg,ev){
  const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
  const x=(ev.clientX-r.left)*vb.width/r.width,y=(ev.clientY-r.top)*vb.height/r.height;
  const {o,u,max}=CO,y0=vb.height-o;
  const gx=Math.round((x-o)/u),gy=Math.round((y0-y)/u);
  if(gx<0||gy<0||gx>max||gy>max)return null;return [gx,gy];
}

/* ── 세트 ── */
/* 알짜만: 문제(사실)마다 기록. 처음에 맞히고 자기 평균보다 빠르게 두 번 연속이면 쉬어 가고(7일 뒤 다시 확인),
   틀리거나 느린 건 다음 세트에 다시 나와요. 7·8·9단, 받아올림, 0 낀 수 같은 어려운 것에 무게. */
function buildSet(id,lvOver){
  if(TYPES[id].seq){const sq=TYPES[id].seq(tst(id).step||0);RUN.label=sq.label;return sq.list.map(p=>({p,q:TYPES[id].make(p)}))}
  const T=TYPES[id],n=tc(id).n,st=tst(id),F=st.facts,now=Date.now(),cand=new Map();
  Object.values(F).forEach(f=>{if(f.p)cand.set(T.key(f.p),f.p)});
  const LV=tst(id).step||0;for(let g=0;g<400;g++){const p=T.rand(LV);cand.set(T.key(p),p)}
  const scored=[];
  cand.forEach((p,k)=>{const f=F[k];let w=1+(T.hard?T.hard(p):0)+Math.random()*1.2;
    if(f){if(f.r){if(now-f.r<7*864e5)return;w+=.5}
      w+=f.w*2.5+(f.slow?2:0)+(f.s===0&&f.n>0?1.5:0)}
    else w+=.3;
    scored.push([w,p,k])});
  scored.sort((a,b)=>b[0]-a[0]);
  // 같은 단만 몰리지 않게: 같은 앞부분(예: 7단)은 세트에 최대 3개
  const out=[],grp={},gk=p=>JSON.stringify(Object.values(p)[0]);
  for(const [w,p] of scored){if(out.length>=n)break;const g=gk(p);if((grp[g]||0)>=3&&scored.length>n*3)continue;grp[g]=(grp[g]||0)+1;out.push(p)}
  for(const [w,p] of scored){if(out.length>=n)break;if(!out.includes(p))out.push(p)}
  if(out.length<n){const keys=new Set(out.map(T.key));cand.forEach((p,k)=>{if(out.length<n&&!keys.has(k)){keys.add(k);out.push(p)}})}
  while(out.length<n&&out.length)out.push(out[out.length%Math.max(1,out.length)]);
  out.sort(()=>Math.random()-.5);
  const lv=lvOver??lvl(id);return out.map(p=>({p,q:T.make(p,lv)}));

function updateFacts(id,probs,items){
  const T=TYPES[id],F=tst(id).facts,ms=items.map(x=>x.ms).slice().sort((a,b)=>a-b),med=ms[Math.floor(ms.length/2)]||0;
  probs.forEach((pr,k)=>{const key=T.key(pr.p),it=items[k],f=F[key]||(F[key]={p:pr.p,s:0,w:0,n:0});
    f.n++;f.t=Math.round(it.ms);const fast=it.ok1&&it.ms<=med&&!it.skip;f.slow=it.ok1&&!fast;
    if(!it.ok1){f.w++;f.s=0;f.r=0}else if(fast){f.s++;if(f.s>=2){f.r=Date.now();f.w=Math.max(0,f.w-1)}}else f.s=0});
  const keys=Object.keys(F);if(keys.length>800){keys.sort((a,b)=>(F[a].n-F[b].n));keys.slice(0,keys.length-800).forEach(k=>delete F[k])}
}

function typeKey(k){

/* 답 자리 수만큼 누르면 확인 없이 바로 넘어감 */
function autoGo(q){const v=RUN.vals[RUN.act]||"";if(!v)return;const i=curIdx();

/* 결과: 근거 있는 말만 */
function vResult(){

  const facts=[];

  else if(out.grad)facts.push([1,`이틀 기준 통과! 졸업이다냥.`]);
  else if(out.pass)facts.push([1,`목표 통과! 다음 목표는 ${fmt(st.target*n)}이다냥.`]);
  else if(out.newStart)facts.push([0,`내 출발 기록 ${fmt(st.start*n)}. 첫 목표는 ${fmt(st.target*n)}이다냥.`]);
  else if(st.target&&rec.w<=c.allow)facts.push([0,`목표까지 ${Math.max(1,Math.round(rec.t-st.target*n))}초 남았다냥.`]);

function sigOf(sets){
  const items=sets.flatMap(s=>(s.items||[]).map(x=>({...x})));
  const first3=sets.reduce((a,s)=>a+(s.items||[]).filter(x=>x.o<3&&!x.ok1).length,0);
  let late=[];sets.forEach(s=>{if(!s.items||s.n<6)return;const by=s.items.slice().sort((a,b)=>a.o-b.o),h=Math.floor(s.n/2);const a=by.slice(0,h).reduce((x,y)=>x+y.ms,0)/h,b=by.slice(h).reduce((x,y)=>x+y.ms,0)/(s.n-h);late.push(b-a)});
  const lateAvg=late.length?late.reduce((a,b)=>a+b,0)/late.length/1000:0;
  let stall=0;sets.forEach(s=>{if(!s.items)return;const ms=s.items.map(x=>x.ms).sort((a,b)=>a-b),med=ms[Math.floor(ms.length/2)]||0;stall+=s.items.filter(x=>x.ok1&&x.ms>med*3&&x.ms>4000).length});
  const fixed=items.filter(x=>!x.ok1&&x.ok).length;
  const pats={};items.forEach(x=>{if(!x.ok1&&x.pat)pats[x.pat]=(pats[x.pat]||0)+1});
  return{first3,lateAvg,stall,fixed,pats};
}

app.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b.dataset.arg,b,e)});

app.addEventListener("change",e=>{const el=e.target.closest("[data-ch]");if(!el)return;const k=el.dataset.ch,id=el.dataset.arg;
  if(k==="carry"){S.cfg.carryOn=el.checked;save();return}
  if(k==="okkey"){S.cfg.okKey=el.checked;save();return}
  if(k==="io"){IMPORT_TXT=el.value;return}
  const c=S.cfg.tc[id]=S.cfg.tc[id]||{};
  if(k==="sec"){const v=parseFloat(el.value);if(v>0){c.sec=v;const st=tst(id);if(st.target!=null)st.target=Math.max(v,st.target)}}
  else if(k==="allow"){const v=parseInt(el.value);if(v>=0)c.allow=v}
  else if(k==="n"){const v=parseInt(el.value);if(v>=5)c.n=v}
  else if(k==="start"){const v=parseT(el.value),st=tst(id);if(v){st.start=v/tc(id).n;st.target=Math.max(finalPQ(id),st.start*.9)}else if(!el.value.trim()){st.start=null;st.target=null}}
