<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>서윤 보드</title>
<link rel="manifest" href="manifest.json?v=1">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="theme-color" content="#2f6b4f">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 서윤 보드: 맨 위 「일단 적기」 + 아래 4개 탭(시훈 학습 · 서윤 회사 · 집안일 · 돈). 금액을 적은 항목은 전부 「돈」 탭으로 모여요. */
:root{
 --bg:#f6f1e7;--grid:rgba(47,107,79,.07);--card:#fffdf8;--fg:#2d332f;--muted:#767b72;--line:#e4dbc9;--accent:#2f6b4f;--accent-soft:#e1efe7;
 --warn:#b4541f;--warn-soft:#fbe9dc;--in:#2f7d8a;--in-soft:#ddf0f2;
 --t-sihoon:#fde2cf;--t-work:#dbe8f7;--t-home:#e3f1d9;--t-money:#fbefc0;--t-inbox:#efe5f7;
 --display:"Gaegu","Noto Sans KR",sans-serif;--body:"Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#171a17;--grid:rgba(124,196,160,.06);--card:#202521;--fg:#e9ece7;--muted:#a0a79f;--line:#343b35;--accent:#7cc4a0;--accent-soft:#1d3028;
 --warn:#f0a070;--warn-soft:#3a2518;--in:#7cc8d4;--in-soft:#1b3236;
 --t-sihoon:#3d2c22;--t-work:#1f2c3b;--t-home:#22301f;--t-money:#3a3420;--t-inbox:#2e2537;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#171a17;--grid:rgba(124,196,160,.06);--card:#202521;--fg:#e9ece7;--muted:#a0a79f;--line:#343b35;--accent:#7cc4a0;--accent-soft:#1d3028;
 --warn:#f0a070;--warn-soft:#3a2518;--in:#7cc8d4;--in-soft:#1b3236;
 --t-sihoon:#3d2c22;--t-work:#1f2c3b;--t-home:#22301f;--t-money:#3a3420;--t-inbox:#2e2537;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top svg{width:52px;height:52px;flex:none}
.top h1{font-family:var(--display);font-size:2.1rem;margin:0;line-height:1}
.top .sub{color:var(--muted);font-size:.9rem}
.top .who{margin-left:auto;color:var(--muted);font-size:.85rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.card h2{font-family:var(--display);font-size:1.5rem;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font-family:var(--body);font-size:.8rem;color:var(--muted);font-weight:400}
.inbox{background:var(--t-inbox);border-style:dashed}
.addrow{display:flex;gap:6px;min-width:0}
.addrow input,.addrow select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);min-width:0}
.addrow input{flex:1}
.inbox .addrow input{font-size:1.05rem;padding:10px 12px}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:700}
.btn.small{padding:3px 9px;font-size:.85rem;border-radius:8px}
.btn:focus-visible,.tab:focus-visible,.check:focus-visible,.t:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--bg);min-width:0;flex-wrap:wrap}
.item .t{flex:1;min-width:8em;overflow-wrap:anywhere;cursor:pointer;border:none;background:none;text-align:left;padding:0}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.inbox .item{background:var(--card)}
.sort{display:flex;gap:4px;flex-wrap:wrap}
.sort .btn{background:var(--card)}
.sort .b-sihoon{background:var(--t-sihoon)}.sort .b-work{background:var(--t-work)}.sort .b-home{background:var(--t-home)}.sort .b-money{background:var(--t-money)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--accent);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;color:var(--card);font-weight:700;padding:0}
.check.on{background:var(--accent)}
.pill{font-size:.75rem;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--card);color:var(--muted);border:1px solid var(--line)}
.pill.out{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-variant-numeric:tabular-nums}
.pill.in{background:var(--in-soft);color:var(--in);border-color:transparent;font-variant-numeric:tabular-nums}
.pill.plan{background:var(--t-work);color:var(--fg);border-color:transparent;font-variant-numeric:tabular-nums}
.pill.think{background:var(--t-inbox);color:var(--fg);border-color:transparent;font-variant-numeric:tabular-nums}
.pill.home{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.empty{color:var(--muted);font-size:.9rem;padding:4px 2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:5;padding:6px 0;background:linear-gradient(var(--bg) 80%,transparent)}
.tab{border:1.5px solid var(--line);border-radius:12px 12px 4px 4px;padding:8px 16px;cursor:pointer;font-family:var(--display);font-size:1.3rem;background:var(--card)}
.tab[data-k="sihoon"]{background:var(--t-sihoon)}.tab[data-k="work"]{background:var(--t-work)}.tab[data-k="home"]{background:var(--t-home)}.tab[data-k="money"]{background:var(--t-money)}
.tab[aria-selected="true"]{border-color:var(--fg);box-shadow:0 3px 0 var(--fg)}
@media (max-width:520px){.tabs{flex-wrap:nowrap;overflow-x:auto}.tab{padding:6px 10px;font-size:1.1rem;flex:none}}
.tab b{font-family:var(--body);font-size:.8rem;font-weight:500;color:var(--muted);margin-left:4px}
.panel{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:700px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.85rem}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem}
details .list{margin-top:6px}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav b{font-family:var(--display);font-size:1.4rem;min-width:7em;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{background:var(--bg);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.tile small{color:var(--muted);font-size:.8rem}
.tile b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.tile.out b{color:var(--warn)}.tile.in b{color:var(--in)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(6em,9em) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.9rem}
.bar .track{height:12px;border-radius:6px;background:var(--bg);overflow:hidden}
.bar .fill{height:100%;border-radius:6px;background:var(--warn)}
.bar .v{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.meals{overflow-x:auto}
.meals table{border-collapse:collapse;width:100%;min-width:520px;font-size:.95rem}
.meals th,.meals td{border:1.5px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.meals th{white-space:nowrap;font-weight:500;color:var(--muted);background:var(--bg)}
.meals tr.today td,.meals tr.today th{background:var(--accent-soft)}
.meals td{cursor:pointer;min-width:6em;overflow-wrap:anywhere}
.meals td:hover{outline:2px solid var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--card);border-radius:16px;padding:18px;width:min(440px,100%);display:grid;gap:12px;max-height:90vh;overflow:auto}
.modal h3{margin:0;font-family:var(--display);font-size:1.5rem}
.modal label{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
.modal input,.modal select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--fg)}
.modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal .row .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.modal .hint{margin:0;color:var(--muted);font-size:.85rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg label{flex:1 1 40%;display:flex;gap:6px;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:10px;padding:8px;color:var(--fg);cursor:pointer}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:calc(100% - 32px)}
.gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:40;padding:16px}
.gate .box{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:24px;width:min(400px,100%);display:grid;gap:14px;text-align:center;justify-items:center}
.gate h1{font-family:var(--display);margin:0;font-size:2rem}
.gate p{margin:0;color:var(--muted)}
.linkbtn{border:none;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="box">
 <span id="gateCat"></span>
 <h1>서윤 보드</h1>
 <p id="gateMsg">불러오는 중…</p>
 <button class="btn primary" id="loginBtn" hidden>구글로 로그인</button>
 <p id="gateErr" hidden style="color:var(--warn);white-space:pre-line;font-size:.9rem"></p>
 <button class="linkbtn" id="gateOut" hidden>다른 계정으로 로그인</button>
 <p style="font-size:.75rem">버전 2</p>
</div></div>

<div class="wrap">
 <header class="top">
  <span id="topCat"></span>
  <div><h1>서윤 보드</h1><div class="sub" id="today"></div></div>
  <div class="who" id="who"></div>
 </header>

 <section class="card inbox">
  <h2>일단 적기 <small id="inboxCount"></small></h2>
  <form class="addrow" id="inboxForm"><input id="inboxInput" placeholder="생각나는 거 한 줄로" aria-label="일단 적기" autocomplete="off"><button class="btn primary">적기</button></form>
  <ul class="list" id="inboxList"></ul>
 </section>

 <nav class="tabs" role="tablist" id="tabs"></nav>
 <div id="panel" class="panel"></div>
</div>
<div id="layer"></div>

<script type="module">
/* ---------- 기본 ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const won=n=>Number(n||0).toLocaleString("ko-KR")+"원";
const toNum=s=>{const x=String(s??"").replace(/[^\d]/g,"");return x?Number(x):null};
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

function catFace(cx,cy,r,fur,inner,line){return`<g><path d="M${cx-r*0.95},${cy-r*0.35} L${cx-r*0.75},${cy-r*1.25} L${cx-r*0.2},${cy-r*0.85}Z" fill="${fur}" stroke="${line}" stroke-width="2.5" stroke-linejoin="round"/><path d="M${cx+r*0.95},${cy-r*0.35} L${cx+r*0.75},${cy-r*1.25} L${cx+r*0.2},${cy-r*0.85}Z" fill="${fur}" stroke="${line}" stroke-width="2.5" stroke-linejoin="round"/>
<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r*0.86}" fill="${fur}" stroke="${line}" stroke-width="2.5"/>
<path d="M${cx-r*0.48},${cy-r*0.05} q${r*0.12},-${r*0.16} ${r*0.24},0" fill="none" stroke="${line}" stroke-width="2.2" stroke-linecap="round"/><path d="M${cx+r*0.24},${cy-r*0.05} q${r*0.12},-${r*0.16} ${r*0.24},0" fill="none" stroke="${line}" stroke-width="2.2" stroke-linecap="round"/>
<path d="M${cx-r*0.08},${cy+r*0.18} L${cx+r*0.08},${cy+r*0.18} L${cx},${cy+r*0.28}Z" fill="${inner}"/>
<path d="M${cx},${cy+r*0.28} q-${r*0.1},${r*0.16} -${r*0.2},${r*0.06} M${cx},${cy+r*0.28} q${r*0.1},${r*0.16} ${r*0.2},${r*0.06}" fill="none" stroke="${line}" stroke-width="1.8" stroke-linecap="round"/>
<ellipse cx="${cx-r*0.55}" cy="${cy+r*0.25}" rx="${r*0.14}" ry="${r*0.08}" fill="${inner}" opacity=".8"/><ellipse cx="${cx+r*0.55}" cy="${cy+r*0.25}" rx="${r*0.14}" ry="${r*0.08}" fill="${inner}" opacity=".8"/></g>`}
const CAT=`<svg viewBox="0 0 40 40" aria-hidden="true">${catFace(20,23,13,"#b9dcc4","#f49b8b","#3f5b4f")}</svg>`;
$("topCat").innerHTML=CAT;$("gateCat").innerHTML=CAT.replace("<svg",'<svg width="72" height="72"');
{const d=new Date();$("today").textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일`}

/* ---------- 분류 ---------- */
const TABS=[["sihoon","시훈"],["work","서윤 회사"],["home","집안일"],["meals","식단표"],["money","돈"]];
const TABNAME={inbox:"일단 적기",...Object.fromEntries(TABS)};
const GROUPS=[
 {k:"food",n:"먹는 것",subs:["냉장고","간식","부식","영양제"]},
 {k:"stuff",n:"물건",subs:["소모품","사야 할 것","물건 장소"]},
 {k:"tidy",n:"정리",subs:["옷정리","불필요 물건","중고거래"]},
 {k:"todo",n:"해야 할 일",subs:[]}];
const GNAME=Object.fromEntries(GROUPS.map(g=>[g.k,g.n]));
// 체크할 때 금액을 물어보는 칸: 사야 할 것 = 쓴 돈, 중고거래 = 들어온 돈
const ASK_ON_DONE={"사야 할 것":{flow:"out",q:"얼마 들었어요?"},"중고거래":{flow:"in",q:"얼마에 팔았어요?"}};
// 항목 {text, tab, group, sub, done, doneAt, amount, flow(out|plan|think|in), decided(no), date, sentHome[], createdAt}
// out=쓴 돈, plan=나갈 돈(정했지만 아직 안 냄), think=고민 중(아직 안 정함), in=들어온 돈
const FLOWS=[["out","쓴 돈"],["plan","나갈 돈"],["think","고민 중"],["in","들어온 돈"]];
const FLOWNAME=Object.fromEntries(FLOWS);
const flowOf=x=>x.flow||"out";
const segHtml=cur=>`<div class="seg">${FLOWS.map(([v,l])=>`<label><input type="radio" name="f" value="${v}"${(cur||"out")===v?" checked":""}>${l}</label>`).join("")}</div>`;
const destOf=x=>x.tab==="home"?["home",x.group||"todo",x.sub||""].join("/"):x.tab;
const destLabel=x=>x.tab==="home"?["집안일",GNAME[x.group]||"해야 할 일",x.sub].filter(Boolean).join(" · "):TABNAME[x.tab]||"";
const DESTS=[["inbox","일단 적기"],["sihoon","시훈"],["work","서윤 회사"],
 ...GROUPS.flatMap(g=>g.subs.length?g.subs.map(s=>[`home/${g.k}/${s}`,`집안일 · ${g.n} · ${s}`]):[[`home/${g.k}/`,`집안일 · ${g.n}`]]),["money","돈"]];
const parseDest=v=>{const[tab,group,sub]=v.split("/");return tab==="home"?{tab,group,sub:sub||null}:{tab,group:null,sub:null}};

/* ---------- 상태 ---------- */
let items=[],meals={},weekOff=0,db=null,tab=store.get("sy-tab")||"home",homeFilter={},month=today().slice(0,7);
if(!TABNAME[tab]||tab==="inbox")tab="home";

/* ---------- 그리기 ---------- */
const amountPill=x=>x.amount?`<span class="pill ${flowOf(x)}">${{in:"+",plan:"나갈 ",think:"고민 ",out:""}[flowOf(x)]}${won(x.amount)}</span>`:"";
const homePill=x=>(x.sentHome&&x.sentHome.length)?`<span class="pill home">우리집 ${esc(x.sentHome.join("·"))}</span>`:"";
function row(x,{sub=false}={}){
 return`<li class="item ${x.done?"done":""}"><button class="check ${x.done?"on":""}" data-done="${x.id}" aria-label="${x.done?"안 한 걸로":"끝"}">${x.done?"✓":""}</button>
 <button class="t" data-open="${x.id}">${esc(x.text)}</button>${sub&&x.sub?`<span class="pill">${esc(x.sub)}</span>`:""}${amountPill(x)}${homePill(x)}</li>`}
function listWithDone(arr,opts){
 const open=arr.filter(x=>!x.done).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
 const done=arr.filter(x=>x.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
 return`<ul class="list">${open.map(x=>row(x,opts)).join("")||`<li class="empty">비어 있어요</li>`}</ul>`+
  (done.length?`<details><summary>끝난 것 ${done.length}개</summary><ul class="list">${done.map(x=>row(x,opts)).join("")}</ul></details>`:"")}

function renderInbox(){
 const l=items.filter(x=>x.tab==="inbox").sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
 $("inboxCount").textContent=l.length?`정리할 것 ${l.length}개`:"";
 $("inboxList").innerHTML=l.map(x=>`<li class="item"><button class="t" data-open="${x.id}">${esc(x.text)}</button>
  <span class="sort"><button class="btn small b-sihoon" data-move="${x.id}" data-to="sihoon">시훈</button><button class="btn small b-work" data-move="${x.id}" data-to="work">회사</button><button class="btn small b-home" data-move="${x.id}" data-to="home">집안일</button><button class="btn small b-money" data-move="${x.id}" data-to="money">돈</button></span></li>`).join("");
}
function renderTabs(){
 $("tabs").innerHTML=TABS.map(([k,n])=>{const c=k==="money"||k==="meals"?"":items.filter(x=>x.tab===k&&!x.done).length;
  return`<button class="tab" role="tab" data-k="${k}" aria-selected="${tab===k}">${n}${c?`<b>${c}</b>`:""}</button>`}).join("")}
function simplePanel(k,ph){
 return`<section class="card"><h2>${TABNAME[k]}</h2>
 <form class="addrow" data-add="${k}"><input name="t" placeholder="${ph}" aria-label="${TABNAME[k]}에 추가" autocomplete="off"><button class="btn primary">추가</button></form>
 ${listWithDone(items.filter(x=>x.tab===k))}
 <p class="empty" style="margin:0">항목을 누르면 금액(${k==="sihoon"?"학원비·교재비":"경비"})을 적을 수 있어요. 적은 금액은 「돈」 탭에 모여요.</p></section>`}
function homePanel(){
 return`<div class="grid2">${GROUPS.map(g=>{const f=homeFilter[g.k]||"";
  const arr=items.filter(x=>x.tab==="home"&&(x.group||"todo")===g.k&&(!f||x.sub===f));

 let unsub=null;
 $("loginBtn").onclick=async()=>{$("gateErr").hidden=true;const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  try{await signInWithPopup(auth,p)}catch(e){$("gateErr").hidden=false;$("gateErr").textContent=(e.code==="auth/popup-blocked"?"로그인 창이 막혔어요. 주소창 오른쪽 팝업 차단 표시에서 '항상 허용'을 눌러 주세요.":"로그인하지 못했어요.")+"\n[오류 코드: "+(e.code||"unknown")+"]"}};
 $("gateOut").onclick=()=>signOut(auth);
 onAuthStateChanged(auth,user=>{if(unsub){unsub();unsub=null}meals={};db=null;items=[];render();
  if(!user)return gate("서윤 구글 계정으로 들어와요.",true,false);
  gate("불러오는 중…",false,false);
  db={add:d=>F.addDoc(col(),d),update:(id,d)=>F.updateDoc(F.doc(col(),id),d),remove:id=>F.deleteDoc(F.doc(col(),id)),family:(c,d)=>F.addDoc(F.collection(fs,c),d),setMeal:(k,d)=>F.setDoc(F.doc(fs,"meals",k),d,{merge:true})};
  const u2=F.onSnapshot(F.collection(fs,"meals"),snap=>{meals=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]));render()},()=>{});
  const u1=F.onSnapshot(col(),snap=>{$("gate").hidden=true;onItems(snap.docs.map(d=>({id:d.id,...d.data()})))},
   err=>{db=null;gate(err&&err.code==="permission-denied"?`${user.email} 계정으로는 열 수 없어요. 서윤 계정으로 다시 로그인해 주세요.`:"불러오지 못했어요: "+(err&&err.message||""),false,true)});
  unsub=()=>{u1();u2()};
  $("who").innerHTML=`<span>${esc(user.email)}</span><button class="linkbtn" id="outBtn">로그아웃</button>`;$("outBtn").onclick=()=>signOut(auth);
 });
}
</script>
</body>
</html>
