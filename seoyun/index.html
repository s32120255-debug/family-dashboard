<title>서윤 보드</title>
<link rel="manifest" href="manifest.json?v=3">

<link rel="apple-touch-icon" href="icon-192.png?v=3">

<style>
/* 서윤 보드: 맨 위 「일단 적기」 + 아래 4개 탭(시훈 학습 · 서윤 회사 · 집안일 · 돈). 금액을 적은 항목은 전부 「돈」 탭으로 모여요. */
:root{
 --bg:#f7f9fb;--grid:transparent;--card:#ffffff;--fg:#0f1b2d;--muted:#6b7a8c;--line:#e3e8ee;--accent:#3d6e9e;--accent-soft:#eaf1f8;
 --warn:#c0485a;--warn-soft:#fbecef;--in:#2f7c9b;--in-soft:#e6f2f7;
 --t-sihoon:#ffffff;--t-work:#edf2f8;--t-home:#ffffff;--t-money:#ffffff;--t-inbox:#f3f5f8;
 --display:"Orbit","IBM Plex Sans KR",sans-serif;--body:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0f1520;--grid:transparent;--card:#172030;--fg:#e6ebf2;--muted:#9aa6b6;--line:#2a3547;--accent:#8fb3dd;--accent-soft:#1d2a3d;
 --warn:#e88a94;--warn-soft:#3a1f25;--in:#7fbfd9;--in-soft:#16303b;
 --t-sihoon:#1a2433;--t-work:#1a2433;--t-home:#1a2433;--t-money:#1a2433;--t-inbox:#131b28;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0f1520;--grid:transparent;--card:#172030;--fg:#e6ebf2;--muted:#9aa6b6;--line:#2a3547;--accent:#8fb3dd;--accent-soft:#1d2a3d;
 --warn:#e88a94;--warn-soft:#3a1f25;--in:#7fbfd9;--in-soft:#16303b;
 --t-sihoon:#1a2433;--t-work:#1a2433;--t-home:#1a2433;--t-money:#1a2433;--t-inbox:#131b28;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top svg{width:52px;height:52px;flex:none}
.top h1{font-family:var(--display);font-size:2.1rem;margin:0;line-height:1}
.top .sub{color:var(--muted);font-size:.9rem}
.top .who{margin-left:auto;color:var(--muted);font-size:.85rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.card h2{font-family:var(--display);font-size:1.5rem;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font-family:var(--body);font-size:.8rem;color:var(--muted);font-weight:400}
.open{border:1px solid var(--line);border-top:3px solid var(--accent)}
.open h2{font-size:1.6rem}
.open .big{font-family:var(--body);font-size:1rem;font-weight:700;background:var(--warn);color:var(--card);border-radius:999px;padding:2px 12px}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.ogrp{display:grid;gap:6px;align-content:start}
.ogrp h3{margin:0;font-family:var(--display);font-size:1.25rem;display:flex;align-items:center;gap:6px}
.ogrp h3 small{font-family:var(--body);font-size:.8rem;color:var(--muted);font-weight:400}
.ogrp h3 .go{margin-left:auto}
.inbox{background:var(--t-inbox)}
.addrow{display:flex;gap:6px;min-width:0}
.addrow input,.addrow select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);min-width:0}
.addrow input{flex:1}
.inbox .addrow input{font-size:1.05rem;padding:10px 12px}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:700}
.btn.small{padding:3px 9px;font-size:.85rem;border-radius:8px}
.btn:focus-visible,.tab:focus-visible,.check:focus-visible,.t:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--bg);min-width:0;flex-wrap:wrap}
.item .t{flex:1;min-width:8em;overflow-wrap:anywhere;cursor:pointer;border:none;background:none;text-align:left;padding:0}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.inbox .item{background:var(--card)}
.sort{display:flex;gap:4px;flex-wrap:wrap}
.sort .btn{background:var(--card)}
.sort .b-sihoon{background:var(--t-sihoon)}.sort .b-work{background:var(--t-work)}.sort .b-home{background:var(--t-home)}.sort .b-money{background:var(--t-money)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--accent);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;color:var(--card);font-weight:700;padding:0}
.check.on{background:var(--accent)}
.pill{font-size:.75rem;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--card);color:var(--muted);border:1px solid var(--line)}
.pill.out{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-variant-numeric:tabular-nums}
.pill.in{background:var(--in-soft);color:var(--in);border-color:transparent;font-variant-numeric:tabular-nums}
.pill.plan{background:var(--t-work);color:var(--fg);border-color:transparent;font-variant-numeric:tabular-nums}
.pill.think{background:var(--t-inbox);color:var(--fg);border-color:transparent;font-variant-numeric:tabular-nums}
.pill.home{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.empty{color:var(--muted);font-size:.9rem;padding:4px 2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:5;padding:6px 0;background:linear-gradient(var(--bg) 80%,transparent)}
.tab{border:1.5px solid var(--line);border-radius:12px 12px 4px 4px;padding:8px 16px;cursor:pointer;font-family:var(--display);font-size:1.3rem;background:var(--card)}
.tab[data-k="sihoon"]{background:var(--t-sihoon)}.tab[data-k="work"]{background:var(--t-work)}.tab[data-k="home"]{background:var(--t-home)}.tab[data-k="money"]{background:var(--t-money)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent)!important;color:var(--card)}
@media (max-width:520px){.tabs{flex-wrap:nowrap;overflow-x:auto}.tab{padding:6px 10px;font-size:1.1rem;flex:none}}
.tab b{font-family:var(--body);font-size:.8rem;font-weight:500;color:var(--muted);margin-left:4px}
.panel{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:700px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.85rem}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem}
details .list{margin-top:6px}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav b{font-family:var(--display);font-size:1.4rem;min-width:7em;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{background:var(--bg);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.tile small{color:var(--muted);font-size:.8rem}
.tile b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.tile.out b{color:var(--warn)}.tile.in b{color:var(--in)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(6em,9em) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.9rem}
.bar .track{height:12px;border-radius:6px;background:var(--bg);overflow:hidden}
.bar .fill{height:100%;border-radius:6px;background:var(--warn)}
.bar .v{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.meals{overflow-x:auto}
.meals table{border-collapse:collapse;width:100%;min-width:520px;font-size:.95rem}
.meals th,.meals td{border:1.5px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.meals th{white-space:nowrap;font-weight:500;color:var(--muted);background:var(--bg)}
.meals tr.today td,.meals tr.today th{background:var(--accent-soft)}
.meals td{cursor:pointer;min-width:6em;overflow-wrap:anywhere}
.meals td:hover{outline:2px solid var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--card);border-radius:12px;padding:18px;width:min(440px,100%);display:grid;gap:12px;max-height:90vh;overflow:auto}
.modal h3{margin:0;font-family:var(--display);font-size:1.5rem}
.modal label{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
.modal input,.modal select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--fg)}
.modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal .row .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.modal .hint{margin:0;color:var(--muted);font-size:.85rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg label{flex:1 1 40%;display:flex;gap:6px;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:10px;padding:8px;color:var(--fg);cursor:pointer}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:calc(100% - 32px)}
.gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:40;padding:16px}
.gate .box{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:24px;width:min(400px,100%);display:grid;gap:14px;text-align:center;justify-items:center}
.gate h1{font-family:var(--display);margin:0;font-size:2rem}
.gate p{margin:0;color:var(--muted)}
.linkbtn{border:none;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
.tab[data-k="ledger"]{background:var(--t-money)}
.lwho{display:grid;gap:6px}.lwho h3{margin:0;font-family:var(--display);font-size:1.2rem;display:flex;gap:8px;align-items:baseline}.lwho h3 small{font-family:var(--body);font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums}
.ltiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ltile{display:flex;align-items:center;gap:8px;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;min-height:52px}
.ltile .ic{font-size:1.1rem;flex:none}.ltile .nm{font-size:.95rem;color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltile b{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}.ltile .ask{color:var(--muted);font-weight:400;font-size:.9rem}
.lright{display:flex;justify-content:flex-end}
.lform{display:grid;gap:8px}.lform input,.lform select{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--card);min-width:0;width:100%}
.lform input[name=amt]{font-size:1.15rem;font-variant-numeric:tabular-nums;text-align:right}
.lrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lsel{display:grid;gap:2px;font-size:.8rem;color:var(--muted)}
.lseg label{flex:1 1 0}
.ldays{display:grid;gap:6px}
.lday{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px}
.lday summary{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--fg);font-size:.95rem}
.lsum{margin-left:auto;font-size:.85rem;font-variant-numeric:tabular-nums}.lin{color:var(--in)}.lout{color:var(--warn)}
.lline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.lline .ln{flex:1 1 8em;min-width:0;overflow-wrap:anywhere}.lline b{font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.lstack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.lbar span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lock{z-index:45}
.fold>summary{list-style:none;cursor:pointer;color:var(--fg)}.fold>summary::-webkit-details-marker{display:none}
.fold>summary h3::before,.fold.sub>summary::before{content:"▾";display:inline-block;color:var(--muted);font-size:.8em;transition:transform .15s;margin-right:2px}
.fold:not([open])>summary h3::before,.fold.sub:not([open])>summary::before{transform:rotate(-90deg)}
.fold.sub{margin:8px 0 0 4px}.fold.sub>summary{color:var(--fg);font-family:var(--display);font-size:1.1rem;display:flex;gap:6px;align-items:baseline}.fold.sub>summary small{color:var(--muted);font-family:var(--body);font-size:.8rem}
.fold.sub .list{margin-top:6px}
#ttl,#today{user-select:none;-webkit-user-select:none}
.sec{z-index:46;place-items:start center;overflow:auto}
.secbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(640px,100%);display:grid;gap:12px;margin-block:24px}
.secbox h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.6rem;display:flex;align-items:center;gap:8px}
.secbox h2 .btn{margin-left:auto}
.secbox textarea{width:100%;min-height:70px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);resize:vertical}
.secnote{background:var(--bg);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.secnote p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.secnote .meta{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}.secnote .meta span{margin-right:auto}
.secask{display:flex;gap:6px;width:min(320px,100%);margin-top:30vh}
.secask input{flex:1;font-size:1.1rem;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.ltile.card{flex-wrap:wrap}
.ltile .goal{flex:1 1 100%;font-size:.82rem;color:var(--muted);display:grid;gap:4px}
.ltile .goal small{font-size:.78rem}
.gbar{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.gbar span{display:block;height:100%;background:var(--accent)}
.card h2 small,.lwho h3 small{word-spacing:normal;margin-left:4px}
.edit{border:none;background:none;color:var(--accent);font-size:.82rem;cursor:pointer;padding:2px 4px;white-space:nowrap}
.edit:hover{text-decoration:underline}
.note{flex:1 1 100%;font-size:.85rem;color:var(--muted);padding-left:34px;overflow-wrap:anywhere}
.solved summary{cursor:pointer;color:var(--muted);padding:4px 0}
.solved .list{margin-top:6px}
.solved .item.done .t{text-decoration:none;color:var(--fg)}
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:none;background:var(--accent);color:var(--card);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(15,27,45,.25);z-index:30;display:grid;place-items:center;padding:0}
.topadd{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:var(--card);font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.topadd:focus-visible,.fab:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.wrap{padding-bottom:96px!important}
.moneyopt{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:8px}
.moneyopt[open]{padding-bottom:12px}
.moneyopt summary{cursor:pointer;color:var(--muted)}
.card,.gate .box,.modal{border-width:1px!important}
.card h2,.top h1,.gate h1,.modal h3{letter-spacing:-.02em;font-weight:700}
.tab{font-size:1.1rem!important;font-weight:400;border-radius:8px!important}
.card{box-shadow:0 1px 2px rgba(15,27,45,.04)}
.item{border-radius:8px}
.check{border-radius:50%!important;border-width:1.5px!important}
.top h1{font-size:2.6rem!important;font-weight:400!important;letter-spacing:-.01em!important}
.card h2{font-size:1.7rem;font-weight:400!important}.ogrp h3{font-weight:400}.modal h3,.gate h1{font-weight:400!important}
.open{border-top:1px solid var(--line)!important}
.top h1,.card h2,.ogrp h3,.tab,.modal h3,.gate h1,.monthnav b{word-spacing:-.25em}
.tab[aria-selected="true"],.tab.on{font-weight:700}
.lock input{font-size:1.4rem;letter-spacing:.3em;text-align:center;width:12em;max-width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.lock form{display:grid;gap:10px;justify-items:center;width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="box">
 <span id="gateCat"></span>
 <h1>서윤 보드</h1>
 <p id="gateMsg">불러오는 중…</p>
 <button class="btn primary" id="loginBtn" hidden>구글로 로그인</button>
 <p id="gateErr" hidden style="color:var(--warn);white-space:pre-line;font-size:.9rem"></p>
 <button class="linkbtn" id="gateOut" hidden>다른 계정으로 로그인</button>
 <p style="font-size:.75rem">버전 16</p>
</div></div>

<div class="gate lock" id="lock" hidden><div class="box">
 <h1>서윤 보드</h1>
 <p id="lockMsg">비밀번호를 넣어 주세요.</p>
 <form id="lockForm"><input id="lockPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="비밀번호"><input id="lockPin2" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="비밀번호 한 번 더" placeholder="한 번 더" hidden><button class="btn primary" id="lockOk">열기</button></form>
 <p id="lockErr" hidden style="color:var(--warn);font-size:.9rem"></p>
 <button class="linkbtn" id="lockForgot">비밀번호를 잊었어요</button>
 <button class="linkbtn" id="lockOff" hidden>비밀번호 끄기</button>
 <button class="linkbtn" id="lockCancel" hidden>닫기</button>
</div></div>

<button class="fab" id="fab" aria-label="일단 적기" title="일단 적기">+</button>

<div class="wrap">
 <header class="top">
  <span id="topCat"></span>
  <div><h1 id="ttl">서윤 보드</h1><div class="sub" id="today"></div></div>
  <button class="topadd" id="topAdd" aria-label="적기" title="적기">+</button>
  <div class="who" id="who"></div>
 </header>

 <section class="card open" id="openBoard"></section>

 <section class="card inbox">
  <h2>일단 적기 <small id="inboxCount"></small></h2>
  <form class="addrow" id="inboxForm"><input id="inboxInput" placeholder="생각나는 거 한 줄로" aria-label="일단 적기" autocomplete="off"><button class="btn primary">적기</button></form>
  <ul class="list" id="inboxList"></ul>
 </section>

 <nav class="tabs" role="tablist" id="tabs"></nav>
 <div id="panel" class="panel"></div>
</div>
<div id="layer"></div>
<div class="gate sec" id="sec" hidden><div class="secbox" id="secBody"></div></div>

<script type="module">
/* ---------- 기본 ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const won=n=>Number(n||0).toLocaleString("ko-KR")+"원";
const toNum=s=>{const x=String(s??"").replace(/[^\d]/g,"");return x?Number(x):null};
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

function catFace(cx,cy,r,fur,inner,line){return`<g><path d="M${cx-r*0.95},${cy-r*0.35} L${cx-r*0.75},${cy-r*1.25} L${cx-r*0.2},${cy-r*0.85}Z" fill="${fur}" stroke="${line}" stroke-width="2.5" stroke-linejoin="round"/><path d="M${cx+r*0.95},${cy-r*0.35} L${cx+r*0.75},${cy-r*1.25} L${cx+r*0.2},${cy-r*0.85}Z" fill="${fur}" stroke="${line}" stroke-width="2.5" stroke-linejoin="round"/>
<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r*0.86}" fill="${fur}" stroke="${line}" stroke-width="2.5"/>
<path d="M${cx-r*0.48},${cy-r*0.05} q${r*0.12},-${r*0.16} ${r*0.24},0" fill="none" stroke="${line}" stroke-width="2.2" stroke-linecap="round"/><path d="M${cx+r*0.24},${cy-r*0.05} q${r*0.12},-${r*0.16} ${r*0.24},0" fill="none" stroke="${line}" stroke-width="2.2" stroke-linecap="round"/>
<path d="M${cx-r*0.08},${cy+r*0.18} L${cx+r*0.08},${cy+r*0.18} L${cx},${cy+r*0.28}Z" fill="${inner}"/>
<path d="M${cx},${cy+r*0.28} q-${r*0.1},${r*0.16} -${r*0.2},${r*0.06} M${cx},${cy+r*0.28} q${r*0.1},${r*0.16} ${r*0.2},${r*0.06}" fill="none" stroke="${line}" stroke-width="1.8" stroke-linecap="round"/>
<ellipse cx="${cx-r*0.55}" cy="${cy+r*0.25}" rx="${r*0.14}" ry="${r*0.08}" fill="${inner}" opacity=".8"/><ellipse cx="${cx+r*0.55}" cy="${cy+r*0.25}" rx="${r*0.14}" ry="${r*0.08}" fill="${inner}" opacity=".8"/></g>`}
const CAT=`<svg viewBox="0 0 40 40" aria-hidden="true">${catFace(20,23,13,"#b9dcc4","#f49b8b","#3f5b4f")}</svg>`;

{const d=new Date();$("today").textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일`}

/* ---------- 분류 ---------- */
const TABS=[["sihoon","시훈"],["work","서윤 회사"],["home","집안일"],["meals","식단표"],["money","돈"],["ledger","가계부"]];
const TABNAME={inbox:"일단 적기",...Object.fromEntries(TABS)};
const GROUPS=[
 {k:"food",n:"먹는 것",subs:["냉장고","간식","부식","영양제"]},
 {k:"stuff",n:"물건",subs:["소모품","사야 할 것","물건 장소"]},
 {k:"tidy",n:"정리",subs:["옷정리","불필요 물건","중고거래"]},
 {k:"todo",n:"해야 할 일",subs:[]}];
const GNAME=Object.fromEntries(GROUPS.map(g=>[g.k,g.n]));
// 냉장고·간식·부식은 가족 대시보드의 먹을거리(pantry)와 같은 목록이에요. 영양제만 서윤 보드에 따로 있어요.
const PANTRY={"냉장고":"fridge","간식":"snack","부식":"storage"};
// 체크할 때 금액을 물어보는 칸: 사야 할 것 = 쓴 돈, 중고거래 = 들어온 돈
const ASK_ON_DONE={"사야 할 것":{flow:"out",q:"얼마 들었어요?"},"중고거래":{flow:"in",q:"얼마에 팔았어요?"}};
// 항목 {text, tab, group, sub, done, doneAt, amount, flow(out|plan|think|in), decided(no), date, sentHome[], createdAt}
// out=쓴 돈, plan=나갈 돈(정했지만 아직 안 냄), think=고민 중(아직 안 정함), in=들어온 돈
const FLOWS=[["out","쓴 돈"],["plan","나갈 돈"],["think","고민 중"],["in","들어온 돈"]];
const FLOWNAME=Object.fromEntries(FLOWS);
const flowOf=x=>x.flow||"out";
const segHtml=cur=>`<div class="seg">${FLOWS.map(([v,l])=>`<label><input type="radio" name="f" value="${v}"${(cur||"out")===v?" checked":""}>${l}</label>`).join("")}</div>`;
const destOf=x=>x.tab==="home"?["home",x.group||"todo",x.sub||""].join("/"):x.tab;
const destLabel=x=>x.tab==="home"?["집안일",GNAME[x.group]||"해야 할 일",x.sub].filter(Boolean).join(" · "):TABNAME[x.tab]||"";
const DESTS=[["inbox","일단 적기"],["sihoon","시훈"],["work","서윤 회사"],
 ...GROUPS.flatMap(g=>g.subs.length?g.subs.filter(s=>!PANTRY[s]).map(s=>[`home/${g.k}/${s}`,`집안일 · ${g.n} · ${s}`]):[[`home/${g.k}/`,`집안일 · ${g.n}`]]),["money","돈"]];
const parseDest=v=>{const[tab,group,sub]=v.split("/");return tab==="home"?{tab,group,sub:sub||null}:{tab,group:null,sub:null}};

/* ---------- 상태 ---------- */
let items=[],meals={},ate={},pantry=[],weekOff=0,db=null,tab=store.get("sy-tab")||"home",homeFilter={},month=today().slice(0,7);
if(!TABNAME[tab]||tab==="inbox")tab="home";

/* ---------- 그리기 ---------- */
const amountPill=x=>x.amount?`<span class="pill ${flowOf(x)}">${{in:"+",plan:"나갈 ",think:"고민 ",out:""}[flowOf(x)]}${won(x.amount)}</span>`:"";
const homePill=x=>(x.sentHome&&x.sentHome.length)?`<span class="pill home">우리집 ${esc(x.sentHome.join("·"))}</span>`:"";
function row(x,{sub=false}={}){
 return`<li class="item ${x.done?"done":""}"><button class="check ${x.done?"on":""}" data-done="${x.id}" aria-label="${x.done?"안 한 걸로":"끝"}">${x.done?"✓":""}</button>
 <button class="t" data-open="${x.id}">${esc(x.text)}</button>${sub&&x.sub?`<span class="pill">${esc(x.sub)}</span>`:""}${amountPill(x)}${homePill(x)}<button class="edit" data-open="${x.id}">수정</button>${x.done&&x.note?`<span class="note">${esc(x.note)}</span>`:""}</li>`}
function listWithDone(arr,opts){
 const open=arr.filter(x=>!x.done).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
 const done=arr.filter(x=>x.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
 return`<ul class="list">${open.map(x=>row(x,opts)).join("")||`<li class="empty">비어 있어요</li>`}</ul>`+
  (done.length?`<details><summary>끝난 것 ${done.length}개</summary><ul class="list">${done.map(x=>row(x,opts)).join("")}</ul></details>`:"")}

function renderInbox(){
 const l=items.filter(x=>x.tab==="inbox").sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
 $("inboxCount").textContent=l.length?`정리할 것 ${l.length}개`:"";
 $("inboxList").innerHTML=l.map(x=>`<li class="item"><button class="t" data-open="${x.id}">${esc(x.text)}</button>
  <span class="sort"><button class="btn small b-sihoon" data-move="${x.id}" data-to="sihoon">시훈</button><button class="btn small b-work" data-move="${x.id}" data-to="work">회사</button><button class="btn small b-home" data-move="${x.id}" data-to="home">집안일</button><button class="btn small b-money" data-move="${x.id}" data-to="money">돈</button><button class="edit" data-open="${x.id}">수정</button></span></li>`).join("");
}
function renderTabs(){
 $("tabs").innerHTML=TABS.map(([k,n])=>{const c=k==="money"||k==="meals"||k==="ledger"?"":items.filter(x=>x.tab===k&&!x.done).length;
  return`<button class="tab" role="tab" data-k="${k}" aria-selected="${tab===k}">${n}${c?`<b>${c}</b>`:""}</button>`}).join("")}
function simplePanel(k,ph){
 return`<section class="card"><h2>${TABNAME[k]}</h2>
 <form class="addrow" data-add="${k}"><input name="t" placeholder="${ph}" aria-label="${TABNAME[k]}에 추가" autocomplete="off"><button class="btn primary">추가</button></form>
 ${listWithDone(items.filter(x=>x.tab===k))}
 <p class="empty" style="margin:0">항목을 누르면 금액(${k==="sihoon"?"학원비·교재비":"경비"})을 적을 수 있어요. 적은 금액은 「돈」 탭에 모여요.</p></section>`}
function pantryRow(x){const t=today();let ex="";
 if(x.expiry){const dd=Math.round((new Date(x.expiry+"T00:00")-new Date(t+"T00:00"))/864e5);const[,mm,dd2]=x.expiry.split("-").map(Number);
  ex=dd<0?`<span class="pill out">${-dd}일 지남</span>`:dd<=2?`<span class="pill out">${dd?"D-"+dd:"오늘까지"}</span>`:`<span class="pill">~${mm}/${dd2}</span>`}
 if(x.empty)return`<li class="item done"><span class="check on">✓</span><button class="t" data-popen="${x.id}">${esc(x.name)} · 다 먹음</button><button class="btn small" data-ptoshop="${x.id}">장보기에</button><button class="btn small" data-prefill="${x.id}">채움</button></li>`;
 return`<li class="item"><button class="check" data-peat="${x.id}" aria-label="먹었어요(하나 줄이기)"></button><button class="t" data-popen="${x.id}">${esc(x.name)}${x.qty?` <span class="pill">${esc(x.qty)}</span>`:""}</button>${ex}</li>`}
function foodCard(g){const f=PANTRY[homeFilter.food]||homeFilter.food==="영양제"?homeFilter.food:"냉장고";
 const chips=`<div class="chips">${g.subs.map(s=>`<button data-filter="food" data-sub="${esc(s)}" aria-pressed="${f===s}">${s}${PANTRY[s]?` ${pantry.filter(x=>x.place===PANTRY[s]&&!x.empty).length}`:""}</button>`).join("")}</div>`;
 if(!PANTRY[f])return`<section class="card"><h2>${g.n}</h2>${chips}
  <form class="addrow" data-add="home" data-group="food"><input type="hidden" name="s" value="${esc(f)}"><input name="t" placeholder="${esc(f)} 적기" aria-label="${esc(f)}에 추가" autocomplete="off"><button class="btn primary">추가</button></form>
  ${listWithDone(items.filter(x=>x.tab==="home"&&x.group==="food"&&x.sub===f))}</section>`;
 const l=pantry.filter(x=>x.place===PANTRY[f]).sort((a,b)=>(a.empty?1:0)-(b.empty?1:0)||(a.expiry||"9999").localeCompare(b.expiry||"9999")||String(a.name).localeCompare(b.name));
 return`<section class="card"><h2>${g.n} <small>가족 화면과 같은 목록</small></h2>${chips}
 <form class="addrow" id="pantryForm" data-place="${PANTRY[f]}" style="flex-wrap:wrap"><input name="n" placeholder="이름 (예: 우유)" aria-label="이름" autocomplete="off" style="flex:2 1 8em"><input name="q" placeholder="양 (예: 2개)" aria-label="양" style="flex:1 1 5em"><label style="display:flex;align-items:center;gap:4px;font-size:.85rem;color:var(--muted);flex:1 1 10em">기한<input name="e" type="date" aria-label="소비기한" style="flex:1;min-width:0"></label><button class="btn primary">넣기</button></form>
 <ul class="list">${l.map(pantryRow).join("")||`<li class="empty">${esc(f)}에 적어 둔 게 없어요</li>`}</ul>
 <p class="empty" style="margin:0">네모를 누르면 하나 먹은 걸로 줄어요. 이름을 누르면 고칠 수 있어요.</p></section>`}
function editPantry(x){const places=[["fridge","냉장고"],["snack","간식"],["storage","부식"]];
 modal(`<form class="modal" id="pf"><h3>${esc(x.name)}</h3><label>이름<input name="n" value="${esc(x.name)}"></label><label>어디<select name="p">${places.map(([v,l])=>`<option value="${v}"${x.place===v?" selected":""}>${l}</option>`).join("")}</select></label>
 <label>양<input name="q" value="${esc(x.qty||"")}" placeholder="예: 2개, 반 통"></label><label>소비기한<input name="e" type="date" value="${esc(x.expiry||"")}"></label>
 <div class="row"><span class="left"><button type="button" class="btn" id="pd">지우기</button></span><button type="button" class="btn" id="pc">취소</button><button class="btn primary">저장</button></div></form>`);
 $("pc").onclick=closeForm;$("pd").onclick=()=>{closeForm();run(db.famDel("pantry",x.id),"지웠어요")};
 $("pf").onsubmit=e=>{e.preventDefault();const f=e.target,n=f.n.value.trim();if(!n)return toast("이름을 적어 주세요");closeForm();
  run(db.famUpd("pantry",x.id,{name:n,place:f.p.value,qty:f.q.value.trim()||null,expiry:f.e.value||null,...(x.empty&&f.q.value.trim()?{empty:false}:{})}),"저장했어요")}}
function homePanel(){
 return`<div class="grid2">${GROUPS.map(g=>{if(g.k==="food")return foodCard(g);const f=homeFilter[g.k]||"";
  const arr=items.filter(x=>x.tab==="home"&&(x.group||"todo")===g.k&&(!f||x.sub===f));
  const sel=g.subs.length?`<select name="s" aria-label="어느 칸">${g.subs.map(s=>`<option${s===(f||"")?" selected":""}>${esc(s)}</option>`).join("")}</select>`:"";
  return`<section class="card"><h2>${g.n}</h2>
  ${g.subs.length?`<div class="chips">${["",...g.subs].map(s=>`<button data-filter="${g.k}" data-sub="${esc(s)}" aria-pressed="${f===s}">${s||"전체"}</button>`).join("")}</div>`:""}
  <form class="addrow" data-add="home" data-group="${g.k}">${sel}<input name="t" placeholder="적기" aria-label="${g.n}에 추가" autocomplete="off"><button class="btn primary">추가</button></form>
  ${listWithDone(arr,{sub:!f})}</section>`}).join("")}</div>`}

const SRC=x=>x.tab==="home"?(x.sub||GNAME[x.group]||"집안일"):x.tab==="money"?"돈 (직접)":TABNAME[x.tab];
const monthOf=x=>(x.date||ymd(new Date(x.createdAt||Date.now()))).slice(0,7);
function moneyPanel(){
 const m=items.filter(x=>x.amount&&x.tab!=="inbox"&&monthOf(x)===month&&(flowOf(x)==="out"||flowOf(x)==="in"));
 const out=m.filter(x=>flowOf(x)==="out"),inn=m.filter(x=>flowOf(x)==="in");
 const think=items.filter(x=>x.tab!=="inbox"&&x.flow==="think"&&!x.done).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
 const no=items.filter(x=>x.flow==="think"&&x.done&&x.decided==="no").sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
 const plan=items.filter(x=>x.tab!=="inbox"&&x.flow==="plan"&&!x.done).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
 const sum=a=>a.reduce((s,x)=>s+Number(x.amount||0),0);
 const by={};for(const x of out){const k=SRC(x);by[k]=(by[k]||0)+Number(x.amount)}
 const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);const max=rows.length?rows[0][1]:1;
 const[y,mo]=month.split("-").map(Number);
 const list=m.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
 return`<section class="card"><div class="monthnav"><button class="btn small" data-month="-1" aria-label="이전 달">◀</button><b>${y}년 ${mo}월</b><button class="btn small" data-month="1" aria-label="다음 달">▶</button>${month!==today().slice(0,7)?`<button class="btn small" data-month="0">이번 달</button>`:""}</div>
 <div class="tiles"><div class="tile out"><small>쓴 돈</small><b>${won(sum(out))}</b></div><div class="tile in"><small>들어온 돈</small><b>${won(sum(inn))}</b></div><div class="tile"><small>들어온 돈 − 쓴 돈</small><b>${sum(inn)-sum(out)<0?"−":""}${won(Math.abs(sum(inn)-sum(out)))}</b></div></div></section>
 <div class="grid2"><section class="card"><h2>고민 중인 돈 <small>${think.length?"합치면 "+won(sum(think)):""}</small></h2>
 <ul class="list">${think.map(x=>`<li class="item"><button class="t" data-open="${x.id}">${esc(x.text)}</button><span class="pill">${esc(SRC(x))}</span>${amountPill(x)}<span class="sort"><button class="btn small" data-decide="${x.id}" data-to="plan">하기로</button><button class="btn small" data-decide="${x.id}" data-to="no">안 하기</button></span></li>`).join("")||`<li class="empty">아직 안 정한 돈이 여기 모여요</li>`}</ul>
 ${no.length?`<details><summary>안 하기로 한 것 ${no.length}개 · ${won(sum(no))}</summary><ul class="list">${no.map(x=>`<li class="item done"><button class="t" data-open="${x.id}">${esc(x.text)}</button>${amountPill(x)}<button class="btn small" data-decide="${x.id}" data-to="think">다시 고민</button></li>`).join("")}</ul></details>`:""}</section>
 <section class="card"><h2>나갈 돈 <small>${plan.length?"합치면 "+won(sum(plan)):""}</small></h2>
 <ul class="list">${plan.map(x=>`<li class="item"><button class="t" data-open="${x.id}">${esc(x.text)}</button><span class="pill">${esc(SRC(x))}</span>${amountPill(x)}<button class="btn small" data-decide="${x.id}" data-to="out">냈어요</button></li>`).join("")||`<li class="empty">하기로 정했지만 아직 안 낸 돈</li>`}</ul></section></div>
 <section class="card"><h2>어디에 썼나 <small>${y}년 ${mo}월</small></h2>
 ${rows.length?`<div class="bars">${rows.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><span class="track"><span class="fill" style="display:block;width:${Math.max(3,v/max*100)}%"></span></span><span class="v">${won(v)}</span></div>`).join("")}</div>`:`<p class="empty" style="margin:0">이 달에 적은 쓴 돈이 없어요.</p>`}</section>
 <section class="card"><h2>돈 적기</h2>
 <form class="addrow" id="moneyForm" style="flex-wrap:wrap"><input name="t" placeholder="무엇 (예: 병원비)" aria-label="무엇" autocomplete="off" style="flex:2 1 10em"><input name="a" inputmode="numeric" placeholder="금액" aria-label="금액" style="flex:1 1 6em"><select name="f" aria-label="어떤 돈">${FLOWS.map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select><select name="w" aria-label="어디 일">${[["money","돈"],["sihoon","시훈"],["work","회사"],["home","집안일"]].map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select><button class="btn primary">적기</button></form>
 <ul class="list">${list.map(x=>`<li class="item"><button class="t" data-open="${x.id}">${esc(x.text)}</button><span class="pill">${esc(SRC(x))}</span><span class="pill">${esc((x.date||"").slice(5).replace("-","/"))}</span>${amountPill(x)}</li>`).join("")||`<li class="empty">이 달 기록이 없어요</li>`}</ul></section>`}

/* 식단표: 가족 대시보드의 식단표(meals)와 같은 표예요. 여기서 고치면 가족 화면에도 바로 보여요. */
const MEALS=[["breakfast","아침"],["lunch","점심"],["dinner","저녁"]];
const ATE=[...MEALS,["snack","간식"]];
function weekStart(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+weekOff*7);return d}
function mealsPanel(){
 const st=weekStart(),t=today();const days=[...Array(7)].map((_,i)=>{const d=new Date(st);d.setDate(st.getDate()+i);return d});
 const en=days[6];
 return`<section class="card"><h2>식단표 <small>가족 화면 식단표와 같은 표예요</small></h2>

function renderOpen(){const t=today();
 const by=k=>items.filter(x=>x.tab===k&&!x.done).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
 const money=items.filter(x=>x.tab==="money"&&!x.done&&(x.flow==="think"||x.flow==="plan")).sort((a,b)=>(a.flow==="plan"?0:1)-(b.flow==="plan"?0:1)||(a.createdAt||0)-(b.createdAt||0));
 const dd=x=>Math.round((new Date(x.expiry+"T00:00")-new Date(t+"T00:00"))/864e5);

 const r=x=>`<li class="item"><button class="check" data-done="${x.id}" aria-label="끝"></button><button class="t" data-open="${x.id}">${esc(x.text)}</button>${x.tab==="home"&&x.sub?`<span class="pill">${esc(x.sub)}</span>`:""}${amountPill(x)}<button class="edit" data-open="${x.id}">수정</button></li>`;
 const mr=x=>`<li class="item"><button class="t" data-open="${x.id}">${esc(x.text)}</button>${amountPill(x)}<button class="edit" data-open="${x.id}">수정</button></li>`;
 const fr=x=>{const n=dd(x);return`<li class="item"><button class="check" data-peat="${x.id}" aria-label="먹었어요"></button><button class="t" data-popen="${x.id}">${esc(x.name)}</button><span class="pill out">${n<0?-n+"일 지남":n?"D-"+n:"오늘까지"}</span></li>`};
 const G=[["sihoon","시훈",by("sihoon"),r],["work","서윤 회사",by("work"),r],["home","집안일",by("home"),r],["money","돈",money,mr],["home","기한 다 된 먹을거리",food,fr]];
 const total=G.reduce((s,g)=>s+g[2].length,0);
 const solved=items.filter(x=>x.done&&x.decided!=="no"&&["sihoon","work","home"].includes(x.tab)).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,60);

 const sItem=x=>`<li class="item done"><button class="check on" data-done="${x.id}" aria-label="안 한 걸로">✓</button><button class="t" data-open="${x.id}">${esc(x.text)}</button><span class="pill">${esc(x.tab==="home"?(x.sub||"집안일"):TABNAME[x.tab])}</span>${md(x)?`<span class="pill">${md(x)}</span>`:""}<button class="edit" data-open="${x.id}">수정</button>${x.note?`<span class="note">${esc(x.note)}</span>`:""}</li>`;
 const SG=[["sihoon","시훈"],["work","서윤 회사"],["home","집안일"]].map(([k,n])=>[k,n,solved.filter(x=>x.tab===k)]).filter(g=>g[2].length);
 const solvedHtml=solved.length?`<details class="solved" data-fold="solved"${isOpen("solved",false)?" open":""}><summary>해결한 일 ${solved.length}개</summary>${SG.map(([k,n,l])=>`<details class="fold sub" data-fold="s-${k}"${isOpen("s-"+k,true)?" open":""}><summary><span>${n}</span> <small>${l.length}</small></summary><ul class="list">${l.map(sItem).join("")}</ul></details>`).join("")}</details>`:"";
 $("openBoard").innerHTML=`<h2>미해결 ${total?`<span class="big">${total}</span>`:""}</h2>
 ${total?`<div class="ogrid">${G.filter(g=>g[2].length).map(([k,n,l,f])=>`<details class="ogrp fold" data-fold="o-${n}"${isOpen("o-"+n,true)?" open":""}><summary><h3>${n} <small>${l.length}</small><button class="btn small go" data-go="${k}" style="font-family:var(--body)">탭으로</button></h3></summary><ul class="list">${l.map(f).join("")}</ul></details>`).join("")}</div>`:`<p class="empty" style="margin:0">미해결이 없어요.</p>`}${solvedHtml}`}

 <div class="row"><button type="button" class="btn" id="hc">취소</button><button class="btn primary">보내기</button></div></form>`);
 const f=$("hf");const sync=()=>{$("hdl").hidden=f.w.value!=="events";$("hpl").hidden=f.w.value!=="helpmom"};sync();f.querySelectorAll('input[name="w"]').forEach(r=>r.onchange=sync);

 f.onsubmit=async e=>{e.preventDefault();const t=f.t.value.trim();if(!t)return toast("내용을 적어 주세요");const w=f.w.value,d=f.d.value||today();closeForm();

 if(d.decide){const x=byId(d.decide);if(!x)return;

 if(d.go){e.preventDefault();tab=d.go;store.set("sy-tab",tab);render();$("tabs").scrollIntoView({behavior:"smooth"});return}
