<script>
/* 늘 새 버전: 열 때와 다시 볼 때 version.json을 확인하고, 더 새 것이 있으면 다시 불러옴 */
(function(){var V="1";function chk(){fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){if(j&&j.v&&String(j.v)!==V){try{if(sessionStorage.getItem("spv")===String(j.v))return;sessionStorage.setItem("spv",String(j.v))}catch(e){}location.replace(location.pathname+"?v="+j.v+location.hash)}}).catch(function(){})}
if(!/mock/.test(location.hash))chk();document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&!/mock/.test(location.hash))chk()});})();
</script>

<style>
:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#1f2a44;--sub:#6b7280;--line:#e6e0d2;--en:#3b6cf6;--en-soft:#e7eeff;--ok:#2a9d5c;--ok-soft:#e3f4ea;--warm:#b5651d;--warm-soft:#fbeedd;--chip:#f1ede3;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0}
#app{max-width:640px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px;min-height:100%;display:flex;flex-direction:column}
h1{font:400 32px/1.15 'Jua',sans-serif;margin:4px 0 2px}
.sub{color:var(--sub);font-size:15px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px;margin-top:14px}
.big{display:block;width:100%;border-radius:18px;padding:16px;margin-top:14px;font:400 26px 'Jua',sans-serif;color:#fff;background:var(--en)}
.big:disabled{opacity:.45}
.light{display:inline-block;border-radius:14px;padding:11px 16px;font-weight:700;font-size:17px;background:var(--chip);margin:6px 4px 0 0}
.link{background:none;color:var(--sub);text-decoration:underline;font-size:14px;padding:8px 4px;margin-top:10px}
.stage{display:inline-block;background:var(--en-soft);color:var(--en);font-weight:800;border-radius:999px;padding:3px 12px;font-size:15px}
.ex{font-family:ui-monospace,Menlo,monospace;background:var(--chip);border-radius:10px;padding:6px 10px;display:inline-block;margin-top:8px;font-size:15px;user-select:text}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cmp div{background:var(--chip);border-radius:16px;padding:12px;text-align:center}
.cmp b{display:block;font:400 34px 'Jua',sans-serif}
.cmp small{color:var(--sub)}
.good{color:var(--ok)}
/* 드릴 화면 */
.top{display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:5px;flex:1}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots i.done{background:var(--en)}
.dots i.now{background:#9db4fb}
.x{background:none;font-size:15px;color:var(--sub);padding:6px}

.base small{display:block;font-size:13px}
.ko{font:400 40px/1.25 'Jua',sans-serif;text-align:center;margin:14px 0 6px}
.answer{font:800 30px/1.3 'Noto Sans KR',sans-serif;color:var(--en);text-align:center;margin:10px 0}
.state{text-align:center;font-size:20px;font-weight:700;min-height:34px;margin-top:10px}
.meter{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin:10px auto 0;max-width:320px}

.okbox{background:var(--ok-soft);color:#1d6e40;border-radius:16px;padding:10px;text-align:center;font-size:22px;font-weight:800;margin-top:10px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}

.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}

<script type="module">
/* Firebase 연결(시훈 공부방과 같은 가족 구글 로그인). #mock 이면 연결 없이 시험용 */
const MOCK=/mock/.test(location.hash);
window.__SP={ready:null};
if(MOCK){window.__SP.ready=Promise.resolve(null)}
else{
  window.__SP.ready=new Promise(async(res)=>{
    const {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
    const {getAuth,GoogleAuthProvider,onAuthStateChanged,signInWithPopup,signOut}=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");
    const {getFirestore,doc,getDoc,setDoc,deleteDoc,onSnapshot}=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
    const {firebaseConfig}=await import("../config.js");
    const app=initializeApp(firebaseConfig),auth=getAuth(app);let fs=null,started=false;
    const pack=d=>({_j:JSON.stringify(d===undefined?null:d),at:(d&&d.at!=null)?d.at:null,_t:Date.now()});
    const unpack=v=>(v&&typeof v._j==='string')?JSON.parse(v._j):v;
    const ref=p=>doc(fs,'sihun','data',...String(p).split('/'));
    const DB={
      get:async p=>{const s=await getDoc(ref(p));return s.exists()?unpack(s.data()):null},
      set:async(p,d)=>{await setDoc(ref(p),pack(d))},
      del:async p=>{try{await deleteDoc(ref(p))}catch(e){}},
      watch:(p,cb)=>onSnapshot(ref(p),s=>cb(s.exists()?unpack(s.data()):null),()=>{})
    };
    function gate(html){let el=document.getElementById('gate');if(!el){el=document.createElement('div');el.id='gate';el.style.cssText='position:fixed;inset:0;z-index:99;background:#f7f3ea;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center';document.body.appendChild(el)}el.innerHTML='<div style="max-width:340px">'+html+'</div>';return el}
    const B='font-size:18px;padding:14px 22px;border-radius:14px;border:0;background:#3b6cf6;color:#fff;font-weight:700';
    function login(err){const el=gate('<div style="font-size:60px">⚡</div><h2 style="font-family:Jua;font-weight:400;font-size:30px;margin:6px 0">5분 말하기</h2><p style="color:#6b7280">가족 구글 계정으로 들어와요</p><button id="lg" style="'+B+'">구글로 로그인</button>'+(err?'<p style="color:#b23a1d">'+err+'</p>':'')+'<p style="color:#8a958e;font-size:13px;margin-top:16px">카카오톡 안 브라우저 말고 Chrome으로 열어 주세요.</p>');
      el.querySelector('#lg').onclick=async()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});try{await signInWithPopup(auth,p);location.reload()}catch(e){login('로그인이 안 됐어요 ('+(e.code||e.message)+')')}}}
    onAuthStateChanged(auth,async user=>{if(started)return;
      if(!user){const go=()=>login();document.body?go():addEventListener('DOMContentLoaded',go);return}
      started=true;fs=getFirestore(app);
      try{await getDoc(doc(fs,'sihun','data','meta','ping'))}catch(e){if(e&&e.code==='permission-denied'){const el=gate('<h2>이 계정은 아직 허용 안 됐어요</h2><p>'+user.email+'</p><button id="so" style="'+B+'">다른 계정으로</button>');el.querySelector('#so').onclick=async()=>{await signOut(auth);location.reload()};return}}
      res(DB)})});
}
</script>

<body>
<div id="app"></div>
<script>
/* ⚡ 5분 말하기 (엄마 11/25): 「오늘의 공부」는 새로 배우기, 이 앱은 아는 걸 빨리 꺼내기만.
   하루 10문장 · 한국어 보고 영어로 말하기 → 정답 듣고 따라 말하기. 쓰기 없음.
   10문장 중 9문장 이상을 「막힘 없이」(처음에 맞게 + 5초 안에 말 시작) 말하면 다음 날 다음 단계. 아니면 같은 단계 한 번 더.
   막힌 문장은 다음 날 앞에 다시 나와요. 빨간 X 없음, 힌트 없음. 기록은 「오늘 걸린 시간」을 어제와 비교만.
   🎤 녹음(엄마 「녹음 발음인식 매우 중요」): 띵 소리 나는 브라우저 인식 대신, 시훈 공부방처럼 녹음 → 서버(stt, Google 받아쓰기)로 글자.
   정답 문장을 서버에 미리 알려 주지 않아요(알려 주면 틀린 발음도 정답처럼 받아 적음) → 들린 그대로 비교.
   말이 끝나기 전에 끊지 않음: 1초 조용하면 「지금까지」를 받아 적어 보고, 맞으면 바로 다음. 아직 아니면 계속 들어요.
   말을 시작한 뒤 5초 조용하거나 「다 말했어 ⏹」를 누르면 끝. 아무 말이 없으면 60초까지 기다려요. */
const SP=window.SPEED,MOCK=/mock/.test(location.hash),TRY=/try/.test(location.hash);
const PASS_N=9,FAST_MS=5000,SNAP_HUSH=1000,FINAL_HUSH=5000,WAIT_MAX=60000,REC_MAX=55000;
let DB=null,ST=null,V={view:'home'},RUN=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function today(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function tomorrow(){const d=new Date();d.setDate(d.getDate()+1);return today(d)}
const fmt=ms=>{const s=Math.round(ms/1000);return s<60?s+'초':Math.floor(s/60)+'분 '+String(s%60).padStart(2,'0')+'초'};
const sec1=ms=>(ms/1000).toFixed(1)+'초';

// ---------- 저장 ----------
const LS={get(k,d){try{const v=localStorage.getItem('speed:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('speed:'+k,JSON.stringify(v))}catch(e){}}};
function blank(){return {stage:1,days:{},again:[],cur:null}}
async function load(){let a=LS.get('st',null),b=null;if(DB){try{b=await DB.get('speed/main')}catch(e){}}
  const pick=(b&&a)?((b.updated||'')>=(a.updated||'')?b:a):(b||a);return Object.assign(blank(),pick||{})}
let saveT=null;
function save(){if(TRY)return;ST.updated=new Date().toISOString();LS.set('st',ST);clearTimeout(saveT);saveT=setTimeout(()=>{if(DB)DB.set('speed/main',ST).catch(()=>{})},300)}
addEventListener('pagehide',()=>{if(!TRY&&DB&&ST){clearTimeout(saveT);DB.set('speed/main',ST).catch(()=>{})}});

// ---------- 오늘 10문장 ----------
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function lastDay(before){const ks=Object.keys(ST.days).filter(k=>k<before&&ST.days[k].end).sort();return ks.length?Object.assign({date:ks[ks.length-1]},ST.days[ks[ks.length-1]]):null}
function buildSet(stage){const st=SP.STAGES[stage-1];const ids=[];
  (ST.again||[]).forEach(id=>{const it=SP.byId(id);if(it&&it.stage<=stage&&ids.length<4&&!ids.includes(id))ids.push(id)});
  const prev=lastDay(today());const used=new Set(prev?prev.items.map(x=>x.id):[]);
  const pool=shuffle(st.items.map(x=>x.id).filter(id=>!ids.includes(id)));
  const fresh=pool.filter(id=>!used.has(id)),old=pool.filter(id=>used.has(id));
  fresh.concat(old).forEach(id=>{if(ids.length<10)ids.push(id)});
  return shuffle(ids)}

// ---------- 채점(들린 말 ↔ 정답) ----------
const CONTR=[[/\bi'm\b/g,'i am'],[/\byou're\b/g,'you are'],[/\bwe're\b/g,'we are'],[/\bthey're\b/g,'they are'],[/\bhe's\b/g,'he is'],[/\bshe's\b/g,'she is'],[/\bit's\b/g,'it is'],[/\bthere's\b/g,'there is'],
  [/\bisn't\b/g,'is not'],[/\baren't\b/g,'are not'],[/\bwasn't\b/g,'was not'],[/\bweren't\b/g,'were not'],[/\bdon't\b/g,'do not'],[/\bdoesn't\b/g,'does not'],[/\bdidn't\b/g,'did not'],
  [/\bcan't\b/g,'can not'],[/\bcannot\b/g,'can not'],[/\bwon't\b/g,'will not'],[/\bi'll\b/g,'i will'],[/\byou'll\b/g,'you will'],[/\bhe'll\b/g,'he will'],[/\bshe'll\b/g,'she will'],[/\bwe'll\b/g,'we will'],[/\bthey'll\b/g,'they will']];
const NOAP={im:'i am',dont:'do not',doesnt:'does not',didnt:'did not',isnt:'is not',arent:'are not',wasnt:'was not',werent:'were not',cant:'can not',wont:'will not',youre:'you are',theyre:'they are',theres:'there is',hes:'he is',shes:'she is'};
const NUM={'1':'one','2':'two','3':'three','4':'four','5':'five'};
const DROP=new Set(['um','uh','uhm','er','erm','hmm','a','an','the','oh','okay','ok']);
function words(s){s=String(s||'').toLowerCase().replace(/[’‘`]/g,"'");CONTR.forEach(([r,x])=>s=s.replace(r,x));
  const out=[];s.replace(/[^a-z0-9' ]/g,' ').replace(/'/g,'').split(/\s+/).forEach(w=>{if(!w)return;w=NUM[w]||w;(NOAP[w]||w).split(' ').forEach(x=>{if(!DROP.has(x))out.push(x)})});return out}
const PRON={i:['i','eye','hi','ah','aye','ai'],you:['you','u','ya','yo','yu','your'],he:['he','she','hi','hee','his','e','hey'],she:['she','he','shi','see','sea','c','shee','g'],we:['we','wee','oui','v','with'],they:['they','day','dey','thay','there','then']};
const STRUCT=new Set('i you he she it we they am is are was were be do does did not can will there what where who'.split(' '));
const IRR={ate:'eat',went:'go',has:'have',had:'have',did:'do',does:'do',swam:'swim',ran:'run',drank:'drink',read:'read'};
function stems(w){const r=new Set([w]);if(IRR[w])r.add(IRR[w]);
  if(/ing$/.test(w)){const b=w.slice(0,-3);r.add(b);r.add(b+'e');if(/(.)\1$/.test(b))r.add(b.slice(0,-1))}
  if(/ies$/.test(w))r.add(w.slice(0,-3)+'y');if(/es$/.test(w))r.add(w.slice(0,-2));if(/s$/.test(w))r.add(w.slice(0,-1));
  if(/ed$/.test(w)){r.add(w.slice(0,-2));r.add(w.slice(0,-1))}return r}
// 동사 모양이 다르면(likes↔like, played↔play, went↔go) 발음 문제가 아니라 문법 → 인정 안 함
function formErr(t,h){if(t===h)return false;if(!(SP.VWORDS.has(t)||SP.VWORDS.has(h)||IRR[t]||IRR[h]))return false;const a=stems(t),b=stems(h);for(const x of a)if(b.has(x))return true;return false}
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const near=(a,b)=>a===b||lev(a,b)<=Math.max(1,Math.floor(Math.min(a.length,b.length)/3))||(a.length>3&&b.length>3&&a.slice(0,3)===b.slice(0,3));
const noun=(t,h)=>h===t+'s'||t===h+'s'||h===t+'es'||t===h+'es';
// 한 낱말: 0 = 똑같음, 1 = 비슷함(발음 흐림), -1 = 다름
function w1(t,h){if(t===h)return 0;if(PRON[t])return PRON[t].includes(h)?1:-1;if(STRUCT.has(t)||STRUCT.has(h))return -1;if(formErr(t,h))return -1;if(noun(t,h))return 1;return near(t,h)?1:-1}
function cmpSeq(T,W){if(T.length!==W.length)return -1;let f=0;for(let i=0;i<T.length;i++){const r=w1(T[i],W[i]);if(r<0)return -1;f+=r}return f?1:0}
// 들린 말 속에 정답 문장이 그대로 들어 있으면 맞음(앞에서 고쳐 말한 것·뒤에 덧붙인 말은 봐줌). 주어 대명사 하나가 안 들려도 봐줌.
function judge(target,heard){const T=words(target),H=words(heard);if(!H.length)return 'unclear';let best=-1;
  for(let i=0;i<H.length;i++){const r=cmpSeq(T,H.slice(i,i+T.length));if(r===0)return 'exact';if(r===1)best=1;
    T.forEach((w,k)=>{if(PRON[w]&&best<1&&!H.some(h=>PRON[h]||PRON[w].includes(h))){const T2=T.slice(0,k).concat(T.slice(k+1));if(T2.length&&cmpSeq(T2,H.slice(i,i+T2.length))>=0)best=1}})}
  // we're 를 were 로 받아 적는 경우
  if(best<0&&/\bwe are\b/.test(T.join(' '))&&H.some((h,k)=>h==='were'&&H[k-1]!=='we'))return judge(target,H.map((h,k)=>h==='were'&&H[k-1]!=='we'?'we are':h).join(' '));
  return best===1?'fuzzy':'wrong'}
window.__judge=judge;

// ---------- 소리 ----------
let VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));VOICE=vs.find(v=>/google/i.test(v.name))||vs.find(v=>/samantha|female|zira|jenny|aria/i.test(v.name))||vs[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(t,rate){return new Promise(res=>{if(MOCK&&!window.__mockTTS){setTimeout(res,300);return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(VOICE)u.voice=VOICE;u.rate=rate||.85;let done=false;const fin=()=>{if(done)return;done=true;setTimeout(res,250)};
    u.onend=fin;u.onerror=fin;setTimeout(fin,1500+t.length*140);speechSynthesis.speak(u)}catch(e){res()}})}

// ---------- 마이크: 한 번 켜고 10문장 동안 그대로(띵 소리 없음) ----------
const MIME=(()=>{try{return window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':''}catch(e){return ''}})();
let MIC=null; // {stream,ctx,an,buf}
async function micOpen(){if(MIC)return MIC;
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  const ctx=new (window.AudioContext||window.webkitAudioContext)();try{await ctx.resume()}catch(e){}
  const src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();an.fftSize=1024;src.connect(an);
  MIC={stream,ctx,an,buf:new Float32Array(an.fftSize),floor:0.004};return MIC}
function micClose(){if(!MIC)return;try{MIC.stream.getTracks().forEach(t=>t.stop())}catch(e){}try{MIC.ctx.close()}catch(e){}MIC=null}
function rms(){if(!MIC)return 0;MIC.an.getFloatTimeDomainData(MIC.buf);let s=0;for(let i=0;i<MIC.buf.length;i++)s+=MIC.buf[i]*MIC.buf[i];return Math.sqrt(s/MIC.buf.length)}

// 서버 받아쓰기(시훈 공부방과 같은 stt). 서버를 미리 깨워 둠.
function warm(){if(!DB)return;const id='warm-'+Date.now().toString(36);DB.set('stt/'+id,{warm:1,at:today()}).then(()=>setTimeout(()=>DB.del('stt/'+id),20000)).catch(()=>{})}
function b64(blob){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=()=>res('');fr.readAsDataURL(blob)})}
async function stt(blob,sec,target){
  if(MOCK){await new Promise(r=>setTimeout(r,400));return window.__mockSTT?window.__mockSTT(target):target}
  if(!DB||blob.size<1500)return '';const data=await b64(blob);if(!data)return '';
  const id=today()+'-sp-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  await DB.set('stt/'+id,{at:today(),lang:'en-US',sec,audio:data,app:'speed'});
  return await new Promise(res=>{let un=null,fin=false;const end=t=>{if(fin)return;fin=true;try{un&&un()}catch(e){}DB.del('stt/'+id);res(t)};
    un=DB.watch('stt/'+id,d=>{if(d&&d.res)end(d.res.text||'')});setTimeout(()=>end(''),25000)})}

// 한 번 듣기: 맞는 말이 들리면 바로 끝. 아니면 말이 끝날 때까지 기다림.
// 돌려줌: {v:'exact'|'fuzzy'|'wrong'|'unclear', heard, onset(말 시작까지 ms, 모르면 null), blob}
function listen(target,ui){return new Promise(async resolve=>{
  const t0=Date.now();let chunks=[],rec=null,recAt=0,ended=false,speaking=false,heardAny=false,onset=null,lastVoice=0,voiceFrames=0,newSpeech=false;
  let inflight=false,lastHeard='',lastV='unclear',lastCovered=0,timer=null;
  if(MOCK&&!MIC){ // 시험용: 마이크 없이 1초 뒤 말한 걸로
    setTimeout(async()=>{const h=await stt(null,1,target);resolve({v:judge(target,h),heard:h,onset:window.__mockOnset!=null?window.__mockOnset:1200,blob:null})},600);ui.stop=()=>{};return}
  // 서버 받아쓰기는 한 번에 60초까지 → 아무 말 없이 10초가 지나면 그동안 녹음을 받아 적어 보고(소리가 작아 못 알아챘을 때 대비) 새로 녹음
  function newRec(){const c=[];let r;try{r=new MediaRecorder(MIC.stream,{mimeType:MIME,audioBitsPerSecond:32000})}catch(e){try{r=new MediaRecorder(MIC.stream)}catch(e2){return false}}
    r.ondataavailable=e=>{if(e.data&&e.data.size)c.push(e.data)};r.start(200);rec=r;chunks=c;recAt=Date.now();return true}
  if(!newRec()){resolve({v:'unclear',heard:'',onset:null,blob:null,err:'rec'});return}
  const snap=()=>new Blob(chunks,{type:MIME||'audio/webm'});
  const flush=()=>new Promise(r=>{try{if(rec&&rec.state==='recording')rec.requestData()}catch(e){}setTimeout(r,90)});
  async function send(final,blind){inflight=true;const cover=Date.now();await flush();const blob=snap();if(!blind)ui.state('think');
    if(blind){const old=rec;try{old.stop()}catch(e){}newRec()}
    let h='';try{h=await stt(blob,Math.round((Date.now()-t0)/1000),target)}catch(e){}
    inflight=false;if(ended&&!final)return;
    if(h){const v=judge(target,h);if(!blind||v==='exact'||v==='fuzzy'){lastHeard=h;lastV=v}}if(!blind)lastCovered=cover;
    if(lastV==='exact'||lastV==='fuzzy'){finish(true);return}
    if(!final)ui.state(speaking?'talk':'listen')}
  function finish(accepted){if(ended)return;ended=true;clearInterval(timer);
    const stopRec=new Promise(r=>{if(rec&&rec.state!=='inactive'){rec.onstop=()=>r();try{rec.stop()}catch(e){r()}}else r()});
    stopRec.then(async()=>{const blob=snap();
      if(!accepted&&heardAny&&lastVoice>lastCovered){ui.state('think');let h='';try{h=await stt(blob,Math.round((Date.now()-t0)/1000),target)}catch(e){}if(h){lastHeard=h;lastV=judge(target,h)}}
      resolve({v:lastHeard?lastV:'unclear',heard:lastHeard,onset,blob})})}
  ui.stop=()=>{if(inflight){const w=setInterval(()=>{if(!inflight){clearInterval(w);finish(false)}},100)}else finish(false)};
  timer=setInterval(()=>{if(ended)return;const n=Date.now(),r=rms(),thr=Math.max(0.012,MIC.floor*3.5);
    if(r>thr){voiceFrames++;if(voiceFrames>=3){if(!speaking){speaking=true;ui.state('talk')}if(onset==null)onset=Math.max(0,n-t0-100);heardAny=true;lastVoice=n;newSpeech=true}}
    else{voiceFrames=0;if(r<thr*0.8)MIC.floor=MIC.floor*0.97+r*0.03;if(speaking&&n-lastVoice>300){speaking=false;ui.state('listen')}}
    ui.level(Math.min(1,r/(thr*4)),speaking);
    if(inflight)return;
    if(heardAny&&!speaking&&newSpeech&&n-lastVoice>=SNAP_HUSH){newSpeech=false;send(false);return}
    if(heardAny&&!speaking&&n-lastVoice>=FINAL_HUSH){finish(false);return}
    if(!heardAny&&n-recAt>=10000){send(false,true);return}
    if((!heardAny&&n-t0>WAIT_MAX)||(heardAny&&n-recAt>REC_MAX))finish(false)},50);
})}

// ---------- 화면 ----------
function render(){const a=$('#app');
  if(V.view==='home')a.innerHTML=homeHTML();
  else if(V.view==='drill')a.innerHTML=drillHTML();
  else if(V.view==='end')a.innerHTML=endHTML();
  else if(V.view==='log')a.innerHTML=logHTML();
  bind()}
function stageOf(){return TRY&&V.tryStage?V.tryStage:ST.stage}
function homeHTML(){const d=ST.days[today()],st=SP.STAGES[stageOf()-1],prev=lastDay(today());
  let h=`<h1>⚡ 5분 말하기</h1><div class="sub">아는 걸 빨리 꺼내는 연습 · 하루 10문장</div>`;
  if(TRY)h+=`<div class="note">👀 <b>미리 해 보기</b> · 기록이 남지 않아요. 단계 <select id="tryStage">${SP.STAGES.map((s,i)=>`<option value="${i+1}"${i+1===stageOf()?' selected':''}>${i+1}단계 · ${esc(s.t)}</option>`).join('')}</select></div>`;
  if(d&&d.end&&!TRY){h+=resultCard(d,today());h+=`<button class="link" data-act="log">지난 기록 보기</button>`;return h}
  h+=`<div class="card"><span class="stage">${stageOf()}단계</span><h2 style="font:400 26px 'Jua';margin:8px 0 2px">${esc(st.t)}</h2><div class="ex">${esc(st.ex)}</div>
    <p style="margin:12px 0 0">회색 문장을 보고, 한국어 뜻대로 <b>한 군데만 바꿔서 영어로 말해요.</b> 맞으면 정답을 듣고 한 번 따라 말해요.</p>
    ${prev?`<p class="sub" style="margin:8px 0 0">지난번(${prev.date.slice(5).replace('-','/')}) <b>${fmt(prev.ms)}</b> 걸렸어요.</p>`:''}
    ${ST.cur&&ST.cur.date===today()&&!TRY?`<p class="sub">하던 데서 이어서 해요 (${ST.cur.i+1} / 10)</p>`:''}
    <button class="big" data-act="start">🎤 시작</button>
    ${MIME||MOCK?'':`<div class="heard">이 기기는 녹음이 안 돼요. 안드로이드 Chrome으로 열어 주세요.</div>`}
    <div class="sub" style="margin-top:10px;font-size:13px">처음 한 번은 마이크를 써도 되는지 물어봐요 → 「허용」</div></div>`;
  if(!TRY)h+=`<button class="link" data-act="log">지난 기록 보기</button> <button class="link" data-act="try">👀 미리 해 보기(엄마)</button>`;
  return h}
function resultCard(d,date){const prev=lastDay(date);const avg=x=>{const o=x.items.map(i=>i.onset).filter(v=>v!=null);return o.length?o.reduce((a,b)=>a+b,0)/o.length:null};
  const a1=avg(d),a0=prev?avg(prev):null;const diff=prev?prev.ms-d.ms:0;
  let h=`<div class="card" style="text-align:center"><div style="font-size:54px">${d.passed?'🎉':'✅'}</div><h2 style="font:400 28px 'Jua';margin:4px 0">오늘 10문장 끝!</h2>
   <div class="cmp"><div><small>오늘 걸린 시간</small><b>${fmt(d.ms)}</b>${prev?`<small>지난번 ${fmt(prev.ms)}</small>`:''}</div>
   <div><small>말 시작까지 (평균)</small><b>${a1!=null?sec1(a1):'-'}</b>${a0!=null?`<small>지난번 ${sec1(a0)}</small>`:''}</div></div>`;
  if(prev&&diff>=1000)h+=`<p class="good" style="font-weight:800;font-size:19px">지난번보다 ${fmt(diff)} 빨라졌어요! ⚡</p>`;
  h+=`<p style="font-size:18px">막힘 없이 말한 문장 <b>${d.clean} / 10</b></p>`;
  h+=d.passed?`<p style="font-size:18px">내일은 <b>${Math.min(d.stage+1,SP.STAGES.length)}단계</b>로 가요!</p>`:`<p style="font-size:18px">내일 ${d.stage}단계를 한 번 더 해요. 더 빨라질 거예요.</p>`;
  return h+'</div>'}
function endHTML(){const d=RUN.day;let h=resultCard(d,RUN.date);
  h+=`<div class="card"><b>🔊 내 목소리 · 정답 소리</b><table>${RUN.ids.map((id,i)=>{const it=SP.byId(id),r=d.items[i]||{};return `<tr><td>${esc(it.en)}<div class="sub" style="font-size:13px">${esc(it.ko)}</div></td><td style="white-space:nowrap">${RUN.blobs[i]?`<button class="play" data-act="mine" data-i="${i}">내 목소리</button>`:''}<button class="play" data-act="ans" data-i="${i}">정답</button></td></tr>`}).join('')}</table></div>
  <button class="fin" data-act="home">끝 ✓</button>`;return h}
function logHTML(){const ks=Object.keys(ST.days).filter(k=>ST.days[k].end).sort().reverse();
  let h=`<h1>지난 기록</h1><div class="sub">지금 ${ST.stage}단계 · 9/10 막힘 없이 → 다음 단계</div><div class="card"><table><tr><th>날짜</th><th>단계</th><th>시간</th><th>막힘 없이</th><th>말 시작(평균)</th></tr>`;
  ks.forEach(k=>{const d=ST.days[k],o=d.items.map(i=>i.onset).filter(v=>v!=null);h+=`<tr><td>${k.slice(5).replace('-','/')}</td><td>${d.stage}</td><td>${fmt(d.ms)}</td><td>${d.clean}/10${d.passed?' 🎉':''}</td><td>${o.length?sec1(o.reduce((a,b)=>a+b,0)/o.length):'-'}</td></tr>`});
  h+=`</table>${ks.length?'':'<p class="sub">아직 기록이 없어요.</p>'}</div>`;
  const last=ks[0]&&ST.days[ks[0]];
  if(last)h+=`<div class="card"><b>${ks[0].slice(5).replace('-','/')} 문장별</b><table><tr><th>문장</th><th>처음에</th><th>말 시작</th><th>들린 말</th></tr>${last.items.map(r=>{const it=SP.byId(r.id)||{};return `<tr><td>${esc(it.en)}</td><td>${r.ok1?'맞음':'다시'}</td><td>${r.onset!=null?sec1(r.onset):'-'}</td><td>${esc(r.heard||'')}</td></tr>`}).join('')}</table></div>`;
  return h+`<button class="fin" data-act="home">← 처음으로</button>`}

// 드릴 화면(상태는 RUN.ph)
function drillHTML(){const R=RUN,it=SP.byId(R.ids[R.i]);
  let h=`<div class="top"><div class="dots">${R.ids.map((_,k)=>`<i class="${k<R.i?'done':k===R.i?'now':''}"></i>`).join('')}</div><button class="x" data-act="quit">그만</button></div>`;
  h+=`<div class="base"><small>이 문장을 바꿔요</small>${esc(it.base)}</div><div class="ko">${esc(it.ko)}</div>`;
  const ph=R.ph;
  if(ph==='say'||ph==='follow'){
    if(ph==='follow')h+=`<div class="answer">${esc(it.en)}</div>`;
    h+=`<div class="state" id="st"></div><div class="meter" id="mt"><b></b></div>`;
    if(R.msg)h+=`<div class="heard">${R.msg}</div>`;
    h+=`<button class="fin" data-act="stop" id="stopBtn">다 말했어 ⏹</button>`;
    if(ph==='follow')h+=`<div class="row"><button class="light" data-act="again">🔊 한 번 더 듣기</button></div>`}
  else if(ph==='model'){h+=`<div class="answer">${esc(it.en)}</div>${R.ok?`<div class="okbox">👍 맞아요!</div>`:''}<div class="state">🔊 들어 봐요</div>`}
  else if(ph==='retry'){h+=`<div class="heard">이렇게 들렸어요: <b>“${esc(R.heard)}”</b></div><div class="row"><button class="light" data-act="resay">🎤 다시 말하기</button><button class="light" data-act="show">정답 듣기</button></div>`}
  else if(ph==='quiet'){h+=`<div class="heard">🙉 잘 안 들렸어요.</div><div class="row"><button class="light" data-act="resay">🎤 다시 말하기</button><button class="light" data-act="show">정답 듣기</button></div>`}
  else if(ph==='good'){h+=`<div class="answer">${esc(it.en)}</div><div class="okbox">👍</div>`}
  return h}
const UI={state(s){const e=$('#st');if(!e)return;e.innerHTML=s==='talk'?'🗣 말하는 중…':s==='think'?'<span class="spin">⏳</span> 듣고 있어요…':RUN&&RUN.ph==='follow'?'🎤 따라 말해 봐요':'🎤 영어로 말해 봐요'},
  level(x,talk){const m=$('#mt');if(!m)return;m.classList.toggle('talk',!!talk);m.firstChild.style.width=Math.round(x*100)+'%'},stop:null};

function bind(){document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>ACT[b.dataset.act](b));const s=$('#tryStage');if(s)s.onchange=()=>{V.tryStage=+s.value;render()}}
const ACT={
  async start(){if(!MIME&&!MOCK)return;
    try{if(!MOCK||window.__mockMic)await micOpen()}catch(e){alert('마이크를 쓸 수 없어요. 주소창 옆 🔒 → 마이크 → 허용으로 바꿔 주세요.');return}
    warm();try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}
    const stage=stageOf();let ids,i=0,res=[],ms=0;
    if(!TRY&&ST.cur&&ST.cur.date===today()&&ST.cur.stage===stage){({ids,i,res,ms}=ST.cur)}else{ids=buildSet(stage)}
    RUN={date:today(),stage,ids,i,res,ms,t:Date.now(),blobs:[],day:null};if(!TRY){ST.cur={date:RUN.date,stage,ids,i,res,ms};save()}
    V={view:'drill',tryStage:V.tryStage};runItem()},
  stop(){if(UI.stop)UI.stop()},
  again(){RUN.replay=true;if(UI.stop){RUN.skipJudge=true;UI.stop()}},
  resay(){RUN.ph='say';RUN.msg='';render();doListen()},
  show(){RUN.ok=false;toModel()},
  quit(){RUN.quit=true;if(UI.stop)UI.stop();try{speechSynthesis.cancel()}catch(e){}pauseClock();micClose();V={view:'home',tryStage:V.tryStage};render()},
  home(){V={view:'home',tryStage:V.tryStage};render()},
  log(){V={view:'log'};render()},
  try(){location.hash='try';location.reload()},
  mine(b){const bl=RUN.blobs[+b.dataset.i];if(bl){try{const a=new Audio(URL.createObjectURL(bl));a.play()}catch(e){}}},
  ans(b){speak(SP.byId(RUN.ids[+b.dataset.i]).en)}
};
function pauseClock(){if(RUN&&RUN.t){RUN.ms+=Date.now()-RUN.t;RUN.t=0}}
function resumeClock(){if(RUN&&!RUN.t)RUN.t=Date.now()}
document.addEventListener('visibilitychange',()=>{if(V.view!=='drill')return;if(document.visibilityState==='hidden')pauseClock();else resumeClock()});

function runItem(){const R=RUN;R.ph='say';R.tries=0;R.quiet=0;R.ftries=0;R.ok=false;R.msg='';R.onset=null;R.heard='';R.first=null;render();doListen()}
async function doListen(){const R=RUN,it=SP.byId(R.ids[R.i]),ph=R.ph;R.skipJudge=false;R.replay=false;UI.state('listen');
  const r=await listen(it.en,UI);if(R!==RUN||R.quit||V.view!=='drill')return;
  if(R.replay){R.replay=false;await speak(it.en);if(R===RUN&&!R.quit){render();doListen()}return}
  if(ph==='say'){
    if(r.blob)R.blobs[R.i]=r.blob;
    if(r.v==='exact'||r.v==='fuzzy'){if(R.first==null){R.first=true;R.onset=r.onset}R.heard=r.heard;R.ok=true;toModel();return}
    if(r.v==='unclear'){R.quiet++;if(R.quiet<2){R.msg='🙉 잘 안 들렸어요. 한 번 더 말해 줄래요?';render();doListen();return}R.ph='quiet';render();return}
    if(R.first==null){R.first=false;R.onset=r.onset}R.tries++;R.heard=r.heard;
    if(R.tries<2){R.ph='retry';render();return}
    R.ok=false;toModel();return}
  if(ph==='follow'){
    if(r.v==='exact'||r.v==='fuzzy'){R.follow=true;R.ph='good';render();setTimeout(()=>{if(R===RUN&&!R.quit)next()},900);return}
    R.ftries++;if(R.ftries<2){R.msg=r.v==='unclear'?'🙉 잘 안 들렸어요. 한 번 더 들어 봐요.':'한 번 더 들어 봐요.';await speak(it.en);if(R===RUN&&!R.quit){render();doListen()}return}
    R.follow=false;next()}}
async function toModel(){const R=RUN,it=SP.byId(R.ids[R.i]);R.ph='model';render();await speak(it.en);if(R!==RUN||R.quit)return;R.ph='follow';R.msg='';render();doListen()}
function next(){const R=RUN;const ok1=R.first===true;
  R.res[R.i]={id:R.ids[R.i],ok1,onset:R.onset,clean:ok1&&(R.onset==null||R.onset<=FAST_MS),heard:(R.heard||'').slice(0,80),follow:!!R.follow};
  R.i++;if(!TRY){ST.cur={date:R.date,stage:R.stage,ids:R.ids,i:R.i,res:R.res,ms:R.ms+(R.t?Date.now()-R.t:0)};save()}
  if(R.i<R.ids.length){runItem();return}
  finishDay()}
function finishDay(){const R=RUN;pauseClock();micClose();
  const clean=R.res.filter(x=>x.clean).length,passed=clean>=PASS_N;
  const day={stage:R.stage,end:new Date().toISOString(),ms:R.ms,items:R.res,clean,passed};R.day=day;
  if(!TRY){ST.days[R.date]=day;ST.cur=null;
    const miss=R.res.filter(x=>!x.clean).map(x=>x.id),hit=new Set(R.res.filter(x=>x.clean).map(x=>x.id));
    ST.again=miss.concat((ST.again||[]).filter(id=>!hit.has(id)&&!miss.includes(id))).slice(0,6);
    if(passed&&ST.stage===R.stage&&ST.stage<SP.STAGES.length)ST.stage++;save()}
  V={view:'end'};render()}

(async function boot(){$('#app').innerHTML='<p class="sub" style="text-align:center;margin-top:40px">여는 중…</p>';
  if(document.readyState==='loading')await new Promise(r=>addEventListener('DOMContentLoaded',r));
  DB=await window.__SP.ready;ST=await load();if(TRY)V.tryStage=ST.stage;render()})();
</script>
