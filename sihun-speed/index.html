(function(){var V="38";function chk(){fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){if(j&&j.v&&String(j.v)!==V){try{if(sessionStorage.getItem("spv")===String(j.v))return;sessionStorage.setItem("spv",String(j.v))}catch(e){}location.replace(location.pathname+"?v="+j.v+location.hash)}}).catch(function(){})}
if(!/mock/.test(location.hash))chk();document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&!/mock/.test(location.hash))chk()});})();

<style>
:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#1f2a44;--sub:#6b7280;--line:#e6e0d2;--en:#3b6cf6;--en-soft:#e7eeff;--ok:#2a9d5c;--ok-soft:#e3f4ea;--warm:#b5651d;--warm-soft:#fbeedd;--chip:#f1ede3;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0}
#app{max-width:640px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px;min-height:100%;display:flex;flex-direction:column}
h1{font:400 32px/1.15 'Jua',sans-serif;margin:4px 0 2px}

.light{display:inline-block;border-radius:14px;padding:11px 16px;font-weight:700;font-size:17px;background:var(--chip);margin:6px 4px 0 0}

select{font:inherit;font-size:16px;padding:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)}

<script type="module">
/* Firebase 연결(시훈 공부방과 같은 가족 구글 로그인). #mock 이면 연결 없이 시험용 */
const MOCK=/mock/.test(location.hash);
window.__SP={ready:null};
if(MOCK){window.__SP.user=window.__mockUser||{email:'test@example.com',name:'시험'};window.__SP.ready=Promise.resolve(null)}
else{
  window.__SP.ready=new Promise(async(res)=>{
    const {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
    const {getAuth,GoogleAuthProvider,onAuthStateChanged,signInWithPopup,signOut}=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");
    const {getFirestore,doc,getDoc,setDoc,deleteDoc,onSnapshot,collection,getDocs}=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
    const {firebaseConfig}=await import("../config.js");
    const app=initializeApp(firebaseConfig),auth=getAuth(app);let fs=null,started=false;
    const pack=d=>({_j:JSON.stringify(d===undefined?null:d),at:(d&&d.at!=null)?d.at:null,_t:Date.now()});
    const unpack=v=>(v&&typeof v._j==='string')?JSON.parse(v._j):v;
    const ref=p=>doc(fs,'sihun','data',...String(p).split('/'));
    const DB={
      get:async p=>{const s=await getDoc(ref(p));return s.exists()?unpack(s.data()):null},
      set:async(p,d)=>{await setDoc(ref(p),pack(d))},
      del:async p=>{try{await deleteDoc(ref(p))}catch(e){}},
      watch:(p,cb)=>onSnapshot(ref(p),s=>cb(s.exists()?unpack(s.data()):null),()=>{}),
      list:async p=>{const q=await getDocs(collection(fs,'sihun','data',...String(p).split('/')));return q.docs.map(d=>({id:d.id,data:unpack(d.data())}))}
    };
    function gate(html){let el=document.getElementById('gate');if(!el){el=document.createElement('div');el.id='gate';el.style.cssText='position:fixed;inset:0;z-index:99;background:#f7f3ea;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center';document.body.appendChild(el)}el.innerHTML='<div style="max-width:340px">'+html+'</div>';return el}
    const B='font-size:18px;padding:14px 22px;border-radius:14px;border:0;background:#3b6cf6;color:#fff;font-weight:700';
    function login(err){const el=gate('<div style="font-size:60px">⚡</div><h2 style="font-family:Jua;font-weight:400;font-size:30px;margin:6px 0">스피드 영어</h2><p style="color:#6b7280">가족 구글 계정으로 들어와요</p><button id="lg" style="'+B+'">구글로 로그인</button>'+(err?'<p style="color:#b23a1d">'+err+'</p>':'')+'<p style="color:#8a958e;font-size:13px;margin-top:16px">카카오톡 안 브라우저 말고 Chrome으로 열어 주세요.</p>');
      el.querySelector('#lg').onclick=async()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});try{await signInWithPopup(auth,p);location.reload()}catch(e){login('로그인이 안 됐어요 ('+(e.code||e.message)+')')}}}
    onAuthStateChanged(auth,async user=>{if(started)return;
      if(!user){const go=()=>login();document.body?go():addEventListener('DOMContentLoaded',go);return}
      started=true;fs=getFirestore(app);
      try{await getDoc(doc(fs,'sihun','data','meta','ping'))}catch(e){if(e&&e.code==='permission-denied'){const el=gate('<h2>이 계정은 아직 허용 안 됐어요</h2><p>'+user.email+'</p><button id="so" style="'+B+'">다른 계정으로</button>');el.querySelector('#so').onclick=async()=>{await signOut(auth);location.reload()};return}}
      window.__SP.user={email:user.email||'',name:user.displayName||(user.email||'').split('@')[0]};window.__SP.signOut=async()=>{await signOut(auth);location.reload()};
      res(DB)})});
}
</script>

:root{--bg:#fbfaf4;--card:#ffffff;--ink:#262a31;--sub:#5d5a52;--line:#dfdacb;--en:#2f5fa3;--en-soft:#e3ebf7;--chip:#f3f1e7}

<style>/* 스피드영어 드릴(엄마 11/27) */

<div id="app"></div>
<script>
/* ⚡ 스피드 영어 (엄마 11/25): 「오늘의 공부」는 새로 배우기, 이 앱은 아는 걸 빨리 꺼내기만.
   하루 10문장 · 한국어 보고 영어로 말하기(녹음은 한 번, 틀리면 한 번 더) → 정답 소리 듣기. 쓰기 없음.
   엄마 11/26: 한 단계를 이틀에 나눠요. 첫날은 회색 기준 문장을 보고 한 군데만 바꿔 말하기 → 통과하면 다음 날 같은 단계를 한글만 보고 → 통과하면 다음 단계.
   통과 = 10문장 중 9문장 「막힘 없이」(처음에 맞게 + 한글이 나오고 5초 안에 🎤). 막힌 문장은 다음 날 앞에 다시 나와요. 빨간 X 없음.
   🎤 녹음(엄마 11/26): 생각하고 🎤 누르기 → 다 말하면 ⏹ 누르기. 자동으로 끊지 않고, 멈춘 뒤 한 번만 서버(stt, Google 받아쓰기)로 받아 적어요.
   틀리면 한 번 더(두 번째도 틀리면 정답 듣기). 안 들리면 다시 녹음(틀림 아님). 인식이 계속 안 되면 「넘어가기」.
   정답 문장을 서버에 미리 알려 주지 않아요(알려 주면 틀린 발음도 정답처럼 받아 적음) → 들린 그대로 비교. */
const SP=window.SPEED||{STAGES:[],VWORDS:new Set(),byId:()=>null},TK=window.TALK||null,TC=window.TALKCORE||null,MOCK=/mock/.test(location.hash),TRY=/try/.test(location.hash);
/* ⚡ 스피드영어 = 쉬운 문장 꼴 바꾸기 드릴(엄마 11/27)
   · 문장은 talk-core.js(낱말·활용) + talk-gen.js(문법 단계 66개, 단어 수준 4개)가 그때그때 만들어요.
   · 엄마 11/28 「문장을 쪼개자, be 긍정만 10개 그런 식으로」: 66단계를 작은 단계(꼴 하나)로 쪼갰어요. 작은 단계 하나 = 같은 꼴 10문장, 그 안에 주어·하나/여럿·a/an이 골고루.
   · 하루 50문장 = 지금 작은 단계 10 + 바로 앞 작은 단계 4개 × 10. 틀린 문장은 그날도 다음 날도 다시 안 넣어요.
   · 엄마 11/28 「단계 올리는 건 내가 수동으로」: 저절로 올라가지 않아요. 엄마 화면(관리자)에서 「시훈이 여기로」.
   · 막힘 없이 = 처음에 맞게 + 한글이 나오고 5초 안에 🎤 + 문장 듣기를 미리 누르지 않음(낱말 듣기는 괜찮아요). */
const FAST_MS=5000,REC_MAX=55000,DAY_N=50,UNIT_N=10,PREV_U=4;
const NS=TK?TK.STAGES.length:0,LAPS=['','초등 단어','중등 단어','고등 단어','수능 단어'],LVN=4;
// 문장 찾기: 새 문장 id = 바퀴.꼴.씨앗.묶음(예: 1.b_pos.12345.b_q). 옛 기록 id는 drills.js에서.
function IT(id){id=String(id||'');if(TK&&id.split('.').length===4){const it=TK.make(id);if(it)return it}return SP.byId(id)}
const stName=n=>TK&&TK.STAGES[n-1]?TK.STAGES[n-1].t:'';
const seed=()=>Math.floor(Math.random()*4294967295);
function dayDiff(a,b){return Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5)}
let DB=null,ST=null,V={view:'home'},RUN=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function today(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const fmt=ms=>{const s=Math.round(ms/1000);return s<60?s+'초':Math.floor(s/60)+'분 '+String(s%60).padStart(2,'0')+'초'};
const sec1=ms=>(ms/1000).toFixed(1)+'초';

// ---------- 저장 ----------
const LS={get(k,d){try{const v=localStorage.getItem('speed:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('speed:'+k,JSON.stringify(v))}catch(e){}}};
function blank(){return {v:2,stage:1,lap:1,days:{},cur:null}}
// 옛 기록(계단영어 문장·옛 단계)에서 넘어오면: 날짜 기록은 그대로 두고 단계는 be부터(엄마 11/27 「일단 be부터」)
function migrate(st){if(st.v===2)return st;return Object.assign(blank(),{days:st.days||{},name:st.name,updated:st.updated})}
// 엄마 11/26 「선택 말고 아이디로 쌓을 거야」: 로그인한 구글 아이디마다 기록을 서버에 따로 쌓아요(speed/u-아이디).
let USER=null,WHO='',OTHERS=[];
const keyOf=email=>'u-'+String(email||'nobody').toLowerCase().replace(/[^a-z0-9]/g,'_');
const docOf=w=>'speed/'+w,lsOf=w=>'st-'+w;
let LOADERR=false;
async function loadOf(w){let a=LS.get(lsOf(w),null),b=null;if(DB){try{b=await DB.get(docOf(w))}catch(e){LOADERR=true}}
  const pick=(b&&a)?((b.updated||'')>=(a.updated||'')?b:a):(b||a);return migrate(Object.assign(blank(),pick||{}))}

  async flag(b){const id=b.dataset.id,it=IT(id);if(!it)return;const f=id.split('.')[1],u=UNITS.find(x=>!x.mix&&x.forms[0]===f);
    await saveFlags(L=>{if(!L.some(x=>x.en===it.en))L.push({en:it.en,ko:it.ko,u:u?uName(u):f,f,l:+id.split('.')[0],d:today()})});
    // 보던 목록에서는 같은 작은 단계의 다른 문장으로 바꿔 끼워요
    const swap=(ids,kinds)=>{const j=ids.indexOf(id);if(j<0)return false;const uu=UNITS.find(x=>x.forms.includes(f)&&!x.mix)||UNITS[0];const av=new Set(ids.map(x=>(IT(x)||{}).en));const nw=unitIds(uu,+id.split('.')[0],1,av)[0];if(nw)ids[j]=nw;else{ids.splice(j,1);if(kinds)kinds.splice(j,1)}return true};
    Object.keys(AV.sent).forEach(k=>swap(AV.sent[k]));
    const K=AV.kid;if(K&&K.plan&&K.plan.pre&&K.plan.pre.L){for(const l in K.plan.pre.L){const S=K.plan.pre.L[l];if(swap(S.ids,S.kinds))await savePre(K,K.plan.pre.u,+l,S)}}
    AV.msg=`🚫 뺐어요: ${esc(it.en)}`;render()},
  async unflag(b){const en=b.dataset.en;await saveFlags(L=>{const j=L.findIndex(x=>x.en===en);if(j>=0)L.splice(j,1)});render()},
  async acopy(){const t=flagText();let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
    if(!ok){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy')}catch(e){}ta.remove()}
    AV.msg=ok?'📋 복사했어요. Claude 채팅에 붙여 넣어 주세요.':'복사가 안 됐어요.';render()},
  calm(b){CALM=Math.min(0,CALM+(+b.dataset.d));render()},
  calsel(b){const k=b.dataset.k,d=b.dataset.d;CALSEL[k]=CALSEL[k]===d?null:d;render()},
  async install(){if(INSTALL){INSTALL.prompt();try{await INSTALL.userChoice}catch(e){}INSTALL=null;render()}},
  try(){location.hash='try';location.reload()},
  mine(b){const bl=RUN.blobs[+b.dataset.i];if(bl){try{const a=new Audio(URL.createObjectURL(bl));a.play()}catch(e){}}},
  ans(b){const r=RUN.res[+b.dataset.i];if(r)speak(r.en)}
};
function pauseClock(){if(RUN&&RUN.t){RUN.ms+=Date.now()-RUN.t;RUN.t=0}}
function resumeClock(){if(RUN&&!RUN.t)RUN.t=Date.now()}
document.addEventListener('visibilitychange',()=>{if(V.view!=='drill')return;if(document.visibilityState==='hidden')pauseClock();else resumeClock()});

function keepCur(){const R=RUN;if(TRY||!R)return;ST.cur={v:3,date:R.date,stage:R.stage,u:R.u,lap:R.lap,ids:R.ids,kinds:R.kinds,i:R.i,res:R.res,ms:R.ms+(R.t?Date.now()-R.t:0)};save()}
function runItem(){const R=RUN;if(R.i>=R.ids.length){finishDay();return}Object.assign(R,{ph:'ready',wopen:{},peek:false,words:0,tries:0,quiet:0,fails:0,ftries:0,ok:false,msg:'',think:null,heard:'',first:null,follow:false,skipped:null,shown:Date.now()});render()}
// 받아 적은 말 판정: 맞음 → 정답 듣고 따라 말하기 / 틀림 → 한 번 더(두 번째도 틀리면 정답 듣기) / 안 들림 → 다시 녹음(틀림 아님)
async function judged(v,h,fol){const R=RUN,it=IT(R.ids[R.i]);const ok=v==='exact'||v==='fuzzy';
  if(!fol){
    if(ok){if(R.first==null)R.first=true;R.heard=h;R.ok=true;toModel();return}
    // 엄마 11/27: 틀리면 다시 녹음 없이 바로 정답 소리 → 정답 보고 「다음 ▶」
    // 엄마 11/27 「잘못 인식되면 넘어가지 말고 다시, 틀린 부분만」: 정답은 안 보여 주고 들린 말에서 틀린 곳만 빨갛게 → 다시 말하기.
    // 안 들림은 틀림 아님(다시 녹음, 3번 안 들리면 넘어가기). 틀림 3번이면 그때 정답 소리 + 「다음 ▶」.
    R.heard=h;R.ok=false;
    if(v==='unclear'){R.quiet++;if(R.first==null&&R.quiet>=3)R.skipped='quiet';R.fails=R.quiet>=3?1:0;R.ph='quiet';render();return}
    if(R.first==null){R.first=false;reask()}R.tries++;
    if(R.tries<TRY_MAX){R.diff=diffHTML(it,h);R.tip=R0TIP;R.ph='retry';render();return}
    toModel();return}
  if(ok){R.follow=true;R.ph='good';render();setTimeout(()=>{if(R===RUN&&!R.quit)next()},900);return}
  R.ftries++;R.fails++;
  if(R.ftries<2){R.msg=v==='unclear'?'🙉 잘 안 들렸어요. 한 번 더 들어 보고 따라 말해요.':'한 번 더 들어 보고 따라 말해요.';R.ph='model';render();await speak(it.en);if(R===RUN&&!R.quit){R.ph='fready';render()}return}
  next()}
// 엄마 11/26 「왜 두 번 녹음하는 거야? / 한 번만 녹음」: 따라 말하기 녹음을 없앰. 맞으면 정답 소리를 듣고 저절로 다음, 틀렸으면 정답을 보고 들은 뒤 「다음 ▶」.
// 틀린 문장은 그날 4문장 뒤에 한 번 더(엄마 11/27). 한 번 더 나온 문장은 또 넣지 않아요.
// 엄마 11/28 「틀린 거 추가는 하지 마, 담날 나오게 해」: 그날 다시 넣지 않아요(틀린 문장은 다음 날 「다시」로)
function reask(){}
// 들린 말 ↔ 정답 맞춰 보기(낱말 단위 편집 거리): 맞은 낱말은 그대로, 바뀐 낱말은 빨간 밑줄, 빠진 자리는 빈칸, 더 말한 낱말은 줄 긋기
// 엄마 11/27 「불규칙 동사 잘 모르니 과거형이 나오면 동사원형을 띄워 주자」: 과거형·과거분사 낱말이 있으면 원형만 작게(be 빼고, read처럼 모양이 같은 건 빼고)
const PASTB={};if(TC){Object.keys(TC.IRV).forEach(b=>{if(b==='be')return;TC.IRV[b].forEach(x=>{if(x&&x!==b)PASTB[x]=b})});TC.VP.forEach(p=>{const b=String(p.e||'').split(' ')[0];if(!b||b==='be')return;[TC.EN.past(b),TC.EN.pp(b)].forEach(x=>{x=String(x).split(' ')[0];if(x&&x!==b&&!PASTB[x])PASTB[x]=b})})}
// 검수 11/28: 목록에 빠졌던 과거형
Object.assign(PASTB,{lent:'lend',showed:'show',shown:'show',rang:'ring',rung:'ring',lay:'lie',lain:'lie',misunderstood:'misunderstand',rose:'rise',risen:'rise'});
['has','does','is','are','am'].forEach(x=>delete PASTB[x]);if(PASTB.did==='do')delete PASTB.did;
function pastBases(en){const out=[];String(en||'').toLowerCase().replace(/[^a-z' ]/g,' ').split(/\s+/).forEach(w=>{const b=PASTB[w];if(b&&!out.includes(b))out.push(b)});return out}
const TRY_MAX=3;let R0TIP='';
// 엄마 11/27 「be·do, a·an, 복수, 3인칭 -s 엄청 중요」: 틀린 곳에 맞는 한 마디(정답은 안 알려 줌)
const BEW=new Set(['am','is','are','was','were']),DOW=new Set(['do','does','did']);
const OBJW=new Set(['me','him','her','us','them']),SUBW=new Set(['i','he','she','we','they']),MINEW=new Set(['mine','yours','hers','ours','theirs']),POSW=new Set(['my','your','our','their']);
function hintOf(ops){const bad=ops.filter(o=>o[0]!=='ok');const T=new Set(bad.map(o=>o[2]).filter(Boolean)),H=new Set(bad.map(o=>o[1]).filter(Boolean));
  const hasT=a=>[...T].some(x=>a.has(x)),hasH=a=>[...H].some(x=>a.has(x));
  if(hasT(BEW)&&hasH(DOW))return '이건 be 문장이에요. 상태·누구·어디는 am · is · are (과거 was · were)';
  if(hasT(DOW)&&hasH(BEW))return '이건 do 문장이에요. 움직임·하는 일은 do · does (과거 did)';
  const tb=[...T].some(x=>BEW.has(x)),hb=bad.some(o=>o[0]!=='miss'&&BEW.has(o[1]));if(hb&&!tb&&!ops.some(o=>o[0]==='ok'&&BEW.has(o[1])))return '이건 do 문장이에요. 움직임·하는 일에는 am · is · are 를 안 써요';
  for(const o of bad){const t=o[2]||'',h=o[1]||'';
    if((t==='a'&&h==='an'))return '첫소리가 a·e·i·o·u가 아니면 a';
    if((t==='an'&&h==='a'))return '첫소리가 a·e·i·o·u면 an';
    if((t==='a'||t==='an')&&o[0]==='miss')return '하나면 a / an을 붙여요';
    if(h==='a'||h==='an'){if(o[0]==='extra')return '여럿이면 a / an 없이 -s';}
    if(t==='has'&&h==='have')return '그 · 그녀 · 한 사람이면 have → has';if(t==='have'&&h==='has')return 'I · you · we · they · 여럿이면 have';
    if(t==='does'&&h==='do')return '그 · 그녀 · 한 사람이면 does';if(t==='do'&&h==='does')return 'I · you · we · they · 여럿이면 do';
    if(t==='is'&&h==='are')return '하나면 is';if(t==='are'&&(h==='is'||h==='am'))return '여럿 · you면 are';if(t==='am'&&h!=='am'&&BEW.has(h))return 'I는 am';
    if((t==='these'&&h==='this')||(t==='those'&&h==='that'))return '여럿이면 these · those';if((t==='this'&&h==='these')||(t==='that'&&h==='those'))return '하나면 this · that';
    if(OBJW.has(t)&&SUBW.has(h))return '동사 뒤(~을 · ~에게)에는 me · him · her · us · them';if(SUBW.has(t)&&OBJW.has(h))return '맨 앞(~은 · ~는)에는 I · he · she · we · they';
    if(MINEW.has(t)&&POSW.has(h))return '뒤에 물건 이름이 없으면 mine · yours · hers · ours';if(POSW.has(t)&&MINEW.has(h))return '뒤에 물건 이름이 오면 my · your · her · our';
    if(t==='many'&&h==='much')return '셀 수 있는 것(책 · 사과)은 many';if(t==='much'&&h==='many')return '셀 수 없는 것(우유 · 돈 · 시간)은 much';
    if(t==='was'&&h==='were')return '하나 · I면 was';if(t==='were'&&h==='was')return '여럿 · you면 were';
    if(t&&h&&t===h+'s'||t===h+'es'||(t.endsWith('ies')&&h===t.slice(0,-3)+'y'))return VW.has(t)?'그 · 그녀 · 한 사람이면 동사에 -s (go → goes, watch → watches, study → studies)':'여럿이면 -s';
    if(t&&h&&(h===t+'s'||h===t+'es'))return VW.has(h)?'I · you · we · they · 여럿이면 동사에 -s 없이':'하나면 -s 없이'}
  return ''}
function alignOps(T,H){const m=T.length,n=H.length,D=[];for(let i=0;i<=m;i++){D.push([]);for(let j=0;j<=n;j++)D[i][j]=i===0?j:j===0?i:0}
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const c=w1(T[i-1],H[j-1])>=0?0:1;D[i][j]=Math.min(D[i-1][j-1]+c,D[i-1][j]+1,D[i][j-1]+1)}
  const ops=[];let i=m,j=n;while(i>0||j>0){if(i>0&&j>0&&D[i][j]===D[i-1][j-1]+(w1(T[i-1],H[j-1])>=0?0:1)){ops.unshift([w1(T[i-1],H[j-1])>=0?'ok':'sub',H[j-1],T[i-1]]);i--;j--}
    else if(i>0&&D[i][j]===D[i-1][j]+1){ops.unshift(['miss','',T[i-1]]);i--}else{ops.unshift(['extra',H[j-1],'']);j--}}
  return {cost:D[m][n],ops}}
function diffHTML(it,heard){const H=words(heard);let best=null;[it.en].concat(it.alt||[]).forEach(t=>{const a=alignOps(words(t),H);if(!best||a.cost<best.cost)best=a});
  // 앞뒤로 더 말한 것(고쳐 말하기 전 말 등)은 줄 긋지 않고 빼요
  const ops=best.ops.slice();while(ops.length&&ops[0][0]==='extra')ops.shift();while(ops.length&&ops[ops.length-1][0]==='extra')ops.pop();
  const tip=hintOf(ops);R0TIP=tip;
  return ops.map(([k,w])=>k==='ok'?esc(w):k==='sub'?`<span class="bad">${esc(w)}</span>`:k==='miss'?'<span class="miss"></span>':`<span class="extra">${esc(w)}</span>`).join(' ')}
async function toModel(){const R=RUN,it=IT(R.ids[R.i]);R.ph='model';R.msg='';R.fails=0;R.heardModel=false;render();await speak(it.en);if(R!==RUN||R.quit)return;
  if(R.ok){setTimeout(()=>{if(R===RUN&&!R.quit&&R.ph==='model')next()},1200)}else{R.heardModel=true;render()}}
function next(){const R=RUN;const ok1=R.first===true,it=IT(R.ids[R.i])||{};
  R.res[R.i]={id:R.ids[R.i],k:R.kinds[R.i],en:it.en||'',ko:it.ko||'',ok1,onset:R.think,clean:ok1&&!R.peek&&R.think!=null&&R.think<=FAST_MS,peek:R.peek||undefined,words:R.words||undefined,heard:(R.heard||'').slice(0,80),follow:!!R.follow,skip:R.skipped||undefined};
  R.i++;keepCur();
  if(R.i<R.ids.length){runItem();return}
  finishDay()}
// 셈: 안 들려서 넘어간 문장은 빼요(안 들림은 틀림 아님). 엄마 11/28: 저절로 단계가 올라가지 않아요(엄마가 올려 줘요), 틀린 문장도 다시 안 넣어요.
function passCheck(res){const all=res.filter(x=>x&&x.k!=='r'&&x.skip!=='quiet');
  const N=all.filter(x=>x.k==='n'),sc=N.filter(x=>x.clean).length;
  return {clean:all.filter(x=>x.clean).length,n:all.length,sn:N.length,sc}}
function finishDay(){const R=RUN;pauseClock();micClose();
  const P=passCheck(R.res);
  const day={stage:R.stage,u:R.u,lap:R.lap,end:new Date().toISOString(),ms:R.ms,items:R.res.filter(Boolean),clean:P.clean,n:P.n,sn:P.sn,sc:P.sc};
  R.day=day;
  if(!TRY){ST.days[R.date]=day;ST.cur=null;save()}
  V={view:'end'};render();if(!TRY)loadOther().then(()=>{if(V.view==='end')render()})}

(async function boot(){$('#app').innerHTML='<p class="sub" style="text-align:center;margin-top:40px">여는 중…</p>';
  if(document.readyState==='loading')await new Promise(r=>addEventListener('DOMContentLoaded',r));
  if(/log/.test(location.hash))V={view:'log'};
  DB=await window.__SP.ready;USER=window.__SP.user||{email:'',name:'나'};WHO=keyOf(USER.email);await tabletSihun();ST=await load();await loadFlags();if(!TRY){PLAN=await getPlan(WHO);syncPlan()}await loadOther();if(TRY){V.tryU=ST.u||firstUnit(ST.stage||1).key;V.tryLap=ST.lap||1}render()})();
</script>
