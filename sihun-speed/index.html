(function(){var V="9";function chk(){fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){if(j&&j.v&&String(j.v)!==V){try{if(sessionStorage.getItem("spv")===String(j.v))return;sessionStorage.setItem("spv",String(j.v))}catch(e){}location.replace(location.pathname+"?v="+j.v+location.hash)}}).catch(function(){})}

<style>
:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#1f2a44;--sub:#6b7280;--line:#e6e0d2;--en:#3b6cf6;--en-soft:#e7eeff;--ok:#2a9d5c;--ok-soft:#e3f4ea;--warm:#b5651d;--warm-soft:#fbeedd;--chip:#f1ede3;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0}
#app{max-width:640px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px;min-height:100%;display:flex;flex-direction:column}
h1{font:400 32px/1.15 'Jua',sans-serif;margin:4px 0 2px}
.sub{color:var(--sub);font-size:15px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px;margin-top:14px}
.big{display:block;width:100%;border-radius:18px;padding:16px;margin-top:14px;font:400 26px 'Jua',sans-serif;color:#fff;background:var(--en)}
.big:disabled{opacity:.45}
.light{display:inline-block;border-radius:14px;padding:11px 16px;font-weight:700;font-size:17px;background:var(--chip);margin:6px 4px 0 0}
.link{background:none;color:var(--sub);text-decoration:underline;font-size:14px;padding:8px 4px;margin-top:10px}
.stage{display:inline-block;background:var(--en-soft);color:var(--en);font-weight:800;border-radius:999px;padding:3px 12px;font-size:15px}
.ex{font-family:ui-monospace,Menlo,monospace;background:var(--chip);border-radius:10px;padding:6px 10px;display:inline-block;margin-top:8px;font-size:15px;user-select:text}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cmp div{background:var(--chip);border-radius:16px;padding:12px;text-align:center}
.cmp b{display:block;font:400 34px 'Jua',sans-serif}
.cmp small{color:var(--sub)}
.good{color:var(--ok)}
/* 드릴 화면 */
.top{display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:5px;flex:1}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}

.state{text-align:center;font-size:20px;font-weight:700;min-height:34px;margin-top:10px}
.meter{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin:10px auto 0;max-width:320px}

.meter.talk b{background:var(--ok)}

.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}

select{font:inherit;font-size:16px;padding:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)}

<script type="module">
/* Firebase 연결(시훈 공부방과 같은 가족 구글 로그인). #mock 이면 연결 없이 시험용 */
const MOCK=/mock/.test(location.hash);
window.__SP={ready:null};
if(MOCK){window.__SP.user=window.__mockUser||{email:'test@example.com',name:'시험'};window.__SP.ready=Promise.resolve(null)}
else{
  window.__SP.ready=new Promise(async(res)=>{
    const {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
    const {getAuth,GoogleAuthProvider,onAuthStateChanged,signInWithPopup,signOut}=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");
    const {getFirestore,doc,getDoc,setDoc,deleteDoc,onSnapshot,collection,getDocs}=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
    const {firebaseConfig}=await import("../config.js");
    const app=initializeApp(firebaseConfig),auth=getAuth(app);let fs=null,started=false;
    const pack=d=>({_j:JSON.stringify(d===undefined?null:d),at:(d&&d.at!=null)?d.at:null,_t:Date.now()});
    const unpack=v=>(v&&typeof v._j==='string')?JSON.parse(v._j):v;
    const ref=p=>doc(fs,'sihun','data',...String(p).split('/'));
    const DB={
      get:async p=>{const s=await getDoc(ref(p));return s.exists()?unpack(s.data()):null},
      set:async(p,d)=>{await setDoc(ref(p),pack(d))},
      del:async p=>{try{await deleteDoc(ref(p))}catch(e){}},
      watch:(p,cb)=>onSnapshot(ref(p),s=>cb(s.exists()?unpack(s.data()):null),()=>{}),
      list:async p=>{const q=await getDocs(collection(fs,'sihun','data',...String(p).split('/')));return q.docs.map(d=>({id:d.id,data:unpack(d.data())}))}
    };
    function gate(html){let el=document.getElementById('gate');if(!el){el=document.createElement('div');el.id='gate';el.style.cssText='position:fixed;inset:0;z-index:99;background:#f7f3ea;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center';document.body.appendChild(el)}el.innerHTML='<div style="max-width:340px">'+html+'</div>';return el}
    const B='font-size:18px;padding:14px 22px;border-radius:14px;border:0;background:#3b6cf6;color:#fff;font-weight:700';
    function login(err){const el=gate('<div style="font-size:60px">⚡</div><h2 style="font-family:Jua;font-weight:400;font-size:30px;margin:6px 0">스피드 영어</h2><p style="color:#6b7280">가족 구글 계정으로 들어와요</p><button id="lg" style="'+B+'">구글로 로그인</button>'+(err?'<p style="color:#b23a1d">'+err+'</p>':'')+'<p style="color:#8a958e;font-size:13px;margin-top:16px">카카오톡 안 브라우저 말고 Chrome으로 열어 주세요.</p>');
      el.querySelector('#lg').onclick=async()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});try{await signInWithPopup(auth,p);location.reload()}catch(e){login('로그인이 안 됐어요 ('+(e.code||e.message)+')')}}}
    onAuthStateChanged(auth,async user=>{if(started)return;
      if(!user){const go=()=>login();document.body?go():addEventListener('DOMContentLoaded',go);return}
      started=true;fs=getFirestore(app);
      try{await getDoc(doc(fs,'sihun','data','meta','ping'))}catch(e){if(e&&e.code==='permission-denied'){const el=gate('<h2>이 계정은 아직 허용 안 됐어요</h2><p>'+user.email+'</p><button id="so" style="'+B+'">다른 계정으로</button>');el.querySelector('#so').onclick=async()=>{await signOut(auth);location.reload()};return}}
      window.__SP.user={email:user.email||'',name:user.displayName||(user.email||'').split('@')[0]};window.__SP.signOut=async()=>{await signOut(auth);location.reload()};
      res(DB)})});
}
</script>

<div id="app"></div>
<script>
/* ⚡ 스피드 영어 (엄마 11/25): 「오늘의 공부」는 새로 배우기, 이 앱은 아는 걸 빨리 꺼내기만.
   하루 10문장 · 한국어 보고 영어로 말하기(녹음은 한 번, 틀리면 한 번 더) → 정답 소리 듣기. 쓰기 없음.
   엄마 11/26: 한 단계를 이틀에 나눠요. 첫날은 회색 기준 문장을 보고 한 군데만 바꿔 말하기 → 통과하면 다음 날 같은 단계를 한글만 보고 → 통과하면 다음 단계.
   통과 = 10문장 중 9문장 「막힘 없이」(처음에 맞게 + 한글이 나오고 5초 안에 🎤). 막힌 문장은 다음 날 앞에 다시 나와요. 빨간 X 없음.
   🎤 녹음(엄마 11/26): 생각하고 🎤 누르기 → 다 말하면 ⏹ 누르기. 자동으로 끊지 않고, 멈춘 뒤 한 번만 서버(stt, Google 받아쓰기)로 받아 적어요.
   틀리면 한 번 더(두 번째도 틀리면 정답 듣기). 안 들리면 다시 녹음(틀림 아님). 인식이 계속 안 되면 「넘어가기」.
   정답 문장을 서버에 미리 알려 주지 않아요(알려 주면 틀린 발음도 정답처럼 받아 적음) → 들린 그대로 비교. */
const SP=window.SPEED,MOCK=/mock/.test(location.hash),TRY=/try/.test(location.hash);
const PASS_N=9,FAST_MS=5000,REC_MAX=55000;
let DB=null,ST=null,V={view:'home'},RUN=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function today(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function tomorrow(){const d=new Date();d.setDate(d.getDate()+1);return today(d)}
const fmt=ms=>{const s=Math.round(ms/1000);return s<60?s+'초':Math.floor(s/60)+'분 '+String(s%60).padStart(2,'0')+'초'};
const sec1=ms=>(ms/1000).toFixed(1)+'초';

// ---------- 저장 ----------
const LS={get(k,d){try{const v=localStorage.getItem('speed:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('speed:'+k,JSON.stringify(v))}catch(e){}}};
function blank(){return {stage:1,mode:'base',days:{},again:[],cur:null}}
// 엄마 11/26 「선택 말고 아이디로 쌓을 거야」: 로그인한 구글 아이디마다 기록을 서버에 따로 쌓아요(speed/u-아이디). 다른 기기에서도 같은 아이디면 이어져요.
// 같이 하는 사람(다른 아이디)의 오늘 결과는 끝난 뒤 나란히 보여 줘요.
let USER=null,WHO='',OTHERS=[];
const keyOf=email=>'u-'+String(email||'nobody').toLowerCase().replace(/[^a-z0-9]/g,'_');
const docOf=w=>'speed/'+w,lsOf=w=>'st-'+w;
async function loadOf(w){let a=LS.get(lsOf(w),null),b=null;if(DB){try{b=await DB.get(docOf(w))}catch(e){}}
  const pick=(b&&a)?((b.updated||'')>=(a.updated||'')?b:a):(b||a);return Object.assign(blank(),pick||{})}
async function loadOther(){try{let L=[];
  if(DB)L=(await DB.list('speed')).filter(x=>/^u-/.test(x.id)).map(x=>({id:x.id,st:x.data}));
  else for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^speed:st-u-/.test(k))L.push({id:k.slice(9),st:LS.get(k.slice(6),null)})}
  OTHERS=L.filter(x=>x.id!==WHO&&x.st&&x.st.days)}catch(e){OTHERS=[]}}
async function load(){return loadOf(WHO)}
// 📱 태블릿은 항상 시훈이 기록(엄마 11/26): 누가 로그인해 있든 태블릿(화면 짧은 쪽 600 이상)에서 한 건 시훈이 계정 기록으로.
// 공개 저장소라 시훈이 계정은 코드에 적지 않고, 저장된 기록 문서 id의 SHA-256 앞 16자리로 찾아요. 못 찾으면 로그인 계정 그대로.
const TABLET=Math.min(screen.width||0,screen.height||0)>=600;
async function tabletSihun(){if(!TABLET||TRY||!DB)return;try{for(const x of await DB.list('speed')){if(!/^u-/.test(x.id))continue;
  const h=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x.id)))).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,16);
  if(h==='83afd7e83abd2cf0'){WHO=x.id;USER={email:USER.email,name:'시훈'};return}}}catch(e){}}
let saveT=null;
function save(){if(TRY)return;const w=WHO,st=ST;st.name=USER.name;st.updated=new Date().toISOString();LS.set(lsOf(w),st);clearTimeout(saveT);saveT=setTimeout(()=>{if(DB)DB.set(docOf(w),st).catch(()=>{})},300)}
addEventListener('pagehide',()=>{if(!TRY&&DB&&ST){clearTimeout(saveT);DB.set(docOf(WHO),ST).catch(()=>{})}});

// ---------- 오늘 10문장 ----------
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function lastDay(before){const ks=Object.keys(ST.days).filter(k=>k<before&&ST.days[k].end).sort();return ks.length?Object.assign({date:ks[ks.length-1]},ST.days[ks[ks.length-1]]):null}
function buildSet(stage){const st=SP.STAGES[stage-1];const ids=[];
  (ST.again||[]).forEach(id=>{const it=SP.byId(id);if(it&&it.stage<=stage&&ids.length<4&&!ids.includes(id))ids.push(id)});
  const prev=lastDay(today());const used=new Set(prev?prev.items.map(x=>x.id):[]);
  const pool=shuffle(st.items.map(x=>x.id).filter(id=>!ids.includes(id)));
  const fresh=pool.filter(id=>!used.has(id)),old=pool.filter(id=>used.has(id));
  fresh.concat(old).forEach(id=>{if(ids.length<10)ids.push(id)});
  return shuffle(ids)}

// ---------- 채점(들린 말 ↔ 정답) ----------
const CONTR=[[/\bi'm\b/g,'i am'],[/\byou're\b/g,'you are'],[/\bwe're\b/g,'we are'],[/\bthey're\b/g,'they are'],[/\bhe's\b/g,'he is'],[/\bshe's\b/g,'she is'],[/\bit's\b/g,'it is'],[/\bthere's\b/g,'there is'],
  [/\bisn't\b/g,'is not'],[/\baren't\b/g,'are not'],[/\bwasn't\b/g,'was not'],[/\bweren't\b/g,'were not'],[/\bdon't\b/g,'do not'],[/\bdoesn't\b/g,'does not'],[/\bdidn't\b/g,'did not'],
  [/\bcan't\b/g,'can not'],[/\bcannot\b/g,'can not'],[/\bwon't\b/g,'will not'],[/\bi'll\b/g,'i will'],[/\byou'll\b/g,'you will'],[/\bhe'll\b/g,'he will'],[/\bshe'll\b/g,'she will'],[/\bwe'll\b/g,'we will'],[/\bthey'll\b/g,'they will']];
const NOAP={im:'i am',dont:'do not',doesnt:'does not',didnt:'did not',isnt:'is not',arent:'are not',wasnt:'was not',werent:'were not',cant:'can not',wont:'will not',youre:'you are',theyre:'they are',theres:'there is',hes:'he is',shes:'she is'};
const NUM={'1':'one','2':'two','3':'three','4':'four','5':'five'};
const DROP=new Set(['um','uh','uhm','er','erm','hmm','a','an','the','oh','okay','ok']);
function words(s){s=String(s||'').toLowerCase().replace(/[’‘`]/g,"'");CONTR.forEach(([r,x])=>s=s.replace(r,x));
  const out=[];s.replace(/[^a-z0-9' ]/g,' ').replace(/'/g,'').split(/\s+/).forEach(w=>{if(!w)return;w=NUM[w]||w;(NOAP[w]||w).split(' ').forEach(x=>{if(!DROP.has(x))out.push(x)})});return out}
const PRON={i:['i','eye','hi','ah','aye','ai'],you:['you','u','ya','yo','yu','your'],he:['he','she','hi','hee','his','e','hey'],she:['she','he','shi','see','sea','c','shee','g'],we:['we','wee','oui','v','with'],they:['they','day','dey','thay','there','then']};
const STRUCT=new Set('i you he she it we they am is are was were be do does did not can will there what where who'.split(' '));
const IRR={ate:'eat',went:'go',has:'have',had:'have',did:'do',does:'do',swam:'swim',ran:'run',drank:'drink',read:'read'};
function stems(w){const r=new Set([w]);if(IRR[w])r.add(IRR[w]);
  if(/ing$/.test(w)){const b=w.slice(0,-3);r.add(b);r.add(b+'e');if(/(.)\1$/.test(b))r.add(b.slice(0,-1))}
  if(/ies$/.test(w))r.add(w.slice(0,-3)+'y');if(/es$/.test(w))r.add(w.slice(0,-2));if(/s$/.test(w))r.add(w.slice(0,-1));
  if(/ed$/.test(w)){r.add(w.slice(0,-2));r.add(w.slice(0,-1))}return r}
// 동사 모양이 다르면(likes↔like, played↔play, went↔go) 발음 문제가 아니라 문법 → 인정 안 함
function formErr(t,h){if(t===h)return false;if(!(SP.VWORDS.has(t)||SP.VWORDS.has(h)||IRR[t]||IRR[h]))return false;const a=stems(t),b=stems(h);for(const x of a)if(b.has(x))return true;return false}
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const near=(a,b)=>a===b||lev(a,b)<=Math.max(1,Math.floor(Math.min(a.length,b.length)/3))||(a.length>3&&b.length>3&&a.slice(0,3)===b.slice(0,3));
const noun=(t,h)=>h===t+'s'||t===h+'s'||h===t+'es'||t===h+'es';
// 한 낱말: 0 = 똑같음, 1 = 비슷함(발음 흐림), -1 = 다름
function w1(t,h){if(t===h)return 0;if(PRON[t])return PRON[t].includes(h)?1:-1;if(STRUCT.has(t)||STRUCT.has(h))return -1;if(formErr(t,h))return -1;if(noun(t,h))return 1;return near(t,h)?1:-1}
function cmpSeq(T,W){if(T.length!==W.length)return -1;let f=0;for(let i=0;i<T.length;i++){const r=w1(T[i],W[i]);if(r<0)return -1;f+=r}return f?1:0}
// 들린 말 속에 정답 문장이 그대로 들어 있으면 맞음(앞에서 고쳐 말한 것·뒤에 덧붙인 말은 봐줌). 주어 대명사 하나가 안 들려도 봐줌.
function judge(target,heard){const T=words(target),H=words(heard);if(!H.length)return 'unclear';let best=-1;
  for(let i=0;i<H.length;i++){const r=cmpSeq(T,H.slice(i,i+T.length));if(r===0)return 'exact';if(r===1)best=1;
    T.forEach((w,k)=>{if(PRON[w]&&best<1&&!H.some(h=>PRON[h]||PRON[w].includes(h))){const T2=T.slice(0,k).concat(T.slice(k+1));if(T2.length&&cmpSeq(T2,H.slice(i,i+T2.length))>=0)best=1}})}
  // we're 를 were 로 받아 적는 경우
  if(best<0&&/\bwe are\b/.test(T.join(' '))&&H.some((h,k)=>h==='were'&&H[k-1]!=='we'))return judge(target,H.map((h,k)=>h==='were'&&H[k-1]!=='we'?'we are':h).join(' '));
  return best===1?'fuzzy':'wrong'}
window.__judge=judge;

try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}

  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(VOICE)u.voice=VOICE;u.rate=rate||.85;let done=false;const fin=()=>{if(done)return;done=true;setTimeout(res,250)};

const MIME=(()=>{try{return window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':''}catch(e){return ''}})();
let MIC=null; // {stream,ctx,an,buf}
async function micOpen(){if(MIC)return MIC;
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  const ctx=new (window.AudioContext||window.webkitAudioContext)();try{await ctx.resume()}catch(e){}
  const src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();an.fftSize=1024;src.connect(an);
  MIC={stream,ctx,an,buf:new Float32Array(an.fftSize),floor:0.004};return MIC}
function micClose(){if(!MIC)return;try{MIC.stream.getTracks().forEach(t=>t.stop())}catch(e){}try{MIC.ctx.close()}catch(e){}MIC=null}
function rms(){if(!MIC)return 0;MIC.an.getFloatTimeDomainData(MIC.buf);let s=0;for(let i=0;i<MIC.buf.length;i++)s+=MIC.buf[i]*MIC.buf[i];return Math.sqrt(s/MIC.buf.length)}

// 서버 받아쓰기(시훈 공부방과 같은 stt). 서버를 미리 깨워 둠.
function warm(){if(!DB)return;const id='warm-'+Date.now().toString(36);DB.set('stt/'+id,{warm:1,at:today()}).then(()=>setTimeout(()=>DB.del('stt/'+id),20000)).catch(()=>{})}
function b64(blob){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=()=>res('');fr.readAsDataURL(blob)})}
async function stt(blob,sec,target){
  if(MOCK){await new Promise(r=>setTimeout(r,400));return window.__mockSTT?window.__mockSTT(target):target}
  if(!DB||blob.size<1500)return '';const data=await b64(blob);if(!data)return '';
  const id=today()+'-sp-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  await DB.set('stt/'+id,{at:today(),lang:'en-US',sec,audio:data,app:'speed'});
  return await new Promise(res=>{let un=null,fin=false;const end=t=>{if(fin)return;fin=true;try{un&&un()}catch(e){}DB.del('stt/'+id);res(t)};
    un=DB.watch('stt/'+id,d=>{if(d&&d.res)end(d.res.text||'')});setTimeout(()=>end(''),25000)})}

// (서버 받아쓰기가 한 번에 60초까지라 55초가 되면 그때만 저절로 멈춰요.) 멈춘 뒤 한 번만 받아 적어 정답과 비교해요.
let REC=null;
function recStart(ui){if(REC)return;const R={chunks:[],t0:Date.now(),timer:null,mr:null};REC=R;
  if(MIC){let mr;try{mr=new MediaRecorder(MIC.stream,{mimeType:MIME,audioBitsPerSecond:32000})}catch(e){try{mr=new MediaRecorder(MIC.stream)}catch(e2){mr=null}}
    if(mr){mr.ondataavailable=e=>{if(e.data&&e.data.size)R.chunks.push(e.data)};mr.start(200);R.mr=mr}}
  R.timer=setInterval(()=>{const r=rms(),thr=Math.max(0.012,(MIC?MIC.floor:0.004)*3.5);if(MIC&&r<thr*0.8)MIC.floor=MIC.floor*0.97+r*0.03;
    ui.level(Math.min(1,r/(thr*4)),r>thr);const s=Math.floor((Date.now()-R.t0)/1000);ui.clock(s);if(Date.now()-R.t0>REC_MAX)ACT.stop()},60)}
function recStop(){const R=REC;REC=null;if(!R)return Promise.resolve(null);clearInterval(R.timer);
  return new Promise(res=>{const done=()=>res({blob:R.chunks.length?new Blob(R.chunks,{type:MIME||'audio/webm'}):null,sec:Math.round((Date.now()-R.t0)/1000)});
    if(R.mr&&R.mr.state!=='inactive'){R.mr.onstop=done;try{R.mr.stop()}catch(e){done()}}else done()})}
function recCancel(){const R=REC;REC=null;if(!R)return;clearInterval(R.timer);try{R.mr&&R.mr.state!=='inactive'&&R.mr.stop()}catch(e){}}

function adminHTML(){if(ADMIN)return `<div class="row"><span class="sub">🔓 관리자 모드</span><button class="link" style="margin:0" data-act="adminOff">끄기</button></div>`;
  if(!ADMIN_ASK)return `<div class="row"><button class="link" data-act="adminAsk">🔒 관리자</button></div>`;
  return `<div class="row" style="align-items:center"><input id="apw" type="password" inputmode="numeric" placeholder="관리자 비밀번호" style="font-size:17px;padding:9px;border-radius:10px;border:1.5px solid var(--line);width:180px"><button class="light" style="margin:0" data-act="adminGo">확인</button></div>${ADMIN_MSG?`<p class="sub" style="text-align:center">${ADMIN_MSG}</p>`:''}`}
function calHTML(st,key){const days=st.days||{},base=new Date();base.setDate(1);base.setMonth(base.getMonth()+CALM);
  const y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),td=today();
  let h=`<div class="calnav"><button class="light" data-act="calm" data-d="-1">◀</button><b>${y}년 ${m+1}월</b><button class="light" data-act="calm" data-d="1"${CALM>=0?' disabled':''}>▶</button></div><div class="cal">`;
  ['일','월','화','수','목','금','토'].forEach(w=>h+=`<div class="wd">${w}</div>`);
  for(let i=0;i<first;i++)h+='<div></div>';
  for(let d=1;d<=n;d++){const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),r=days[k]&&days[k].end?days[k]:null;
    h+=`<button class="day${r?(r.passed?' pass':' did'):''}${k===td?' today':''}${CALSEL[key]===k?' sel':''}" ${r?`data-act="calsel" data-k="${esc(key)}" data-d="${k}"`:'disabled'}><span>${d}</span>${r?`<small>${r.stage}${(r.mode||'base')==='ko'?'한':'회'}${r.passed?'🎉':''}</small>`:''}</button>`}
  h+=`</div><div class="sub" style="font-size:12px;margin-top:4px">숫자 = 단계 · 회 = 회색 문장 보고 · 한 = 한글만 · 🎉 통과 · 날짜를 누르면 자세히</div>`;
  const sk=CALSEL[key],d=sk&&days[sk];
  if(d){const o=(d.items||[]).map(i=>i.onset).filter(v=>v!=null),a=o.length?o.reduce((x,y)=>x+y,0)/o.length:null;
    h+=`<div class="daydet"><b>${sk.slice(5).replace('-','/')} · ${d.stage}단계 ${(d.mode||'base')==='ko'?'한글만':'회색 문장'}${d.passed?' · 🎉 통과':''}</b><div class="sub">걸린 시간 ${fmt(d.ms)} · 생각 시간 평균 ${a!=null?sec1(a):'-'} · 막힘 없이 ${d.clean}/${d.n||10}</div>
      <table><tr><th>문장</th><th>처음에</th><th>생각</th><th>들린 말</th></tr>${(d.items||[]).map(r=>{const it=SP.byId(r.id)||{};return `<tr><td>${esc(it.en)}</td><td>${r.skip==='quiet'?'안 들림':r.ok1?'맞음':'다시'}</td><td>${r.onset!=null?sec1(r.onset):'-'}</td><td>${esc(r.heard||'')}</td></tr>`}).join('')}</table></div>`}
  return h}
function personCard(st,name,key,me){const days=st.days||{},ks=Object.keys(days).filter(k=>days[k].end).sort().reverse(),stage=st.stage||1,mode=st.mode||'base',S=SP.STAGES[stage-1];
  const last=ks.map(k=>Object.assign({date:k},days[k])).find(d=>d.stage===stage&&(d.mode||'base')===mode);
  let h=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:20px">👤 ${esc(name)}${me?' <span class="sub">(나)</span>':''}</b>${ADMIN?`<button class="light" style="margin:0" data-act="csv" data-k="${esc(key)}">📥 엑셀</button>`:''}</div>`;
  h+=calHTML(st,key);
  h+=`<div class="stagebox"><div><span class="stage">지금 ${stage}단계 / ${SP.STAGES.length}</span> <b>${esc(S.t)}</b></div>`;
  h+=`<div class="steps"><span class="${mode==='ko'?'ok':'now'}">${mode==='ko'?'✓':'①'} 첫날 · 회색 문장 보고</span><span class="${mode==='ko'?'now':''}">② 둘째 날 · 한글만</span><span>→ ${Math.min(stage+1,SP.STAGES.length)}단계</span></div>`;
  if(last){const need=Math.max(1,(last.n||10)-(10-PASS_N));const pct=Math.min(100,Math.round(last.clean/need*100));
    h+=`<p style="margin:10px 0 4px">이 칸 마지막(${last.date.slice(5).replace('-','/')}): 막힘 없이 <b>${last.clean}</b> / 필요 ${need}${last.passed?' 🎉 통과':` · ${need-last.clean}개 더`}</p><div class="meter" style="max-width:none;margin:0"><b style="width:${pct}%;background:${last.passed?'var(--ok)':'var(--en)'}"></b></div>`}
  else h+=`<p class="sub" style="margin:10px 0 0">이 칸은 아직 안 했어요.</p>`;
  return h+'</div></div>'}
function logHTML(){let h=tabsHTML('log')+`<h1>📊 기록</h1>`;
  h+=personCard(ST,USER.name,WHO,true);
  OTHERS.forEach(o=>{h+=personCard(o.st,o.st.name||'같이 하는 사람',o.id,false)});
  h+=`<div class="card"><b>한 단계 올라가는 기준</b><ol style="margin:8px 0 0;padding-left:20px">
    <li>한 단계는 이틀이에요. <b>첫날</b>은 회색 문장을 보고 바꿔 말하고, 통과하면 <b>다음 날</b> 같은 단계를 한글만 보고 해요. 그것도 통과하면 다음 단계로 가요.</li>
    <li>통과 = 10문장 중 <b>9문장 「막힘 없이」</b>.</li>
    <li>「막힘 없이」 = 한글이 나오고 <b>5초 안에 🎤를 누르고</b>, <b>처음에 맞게</b> 말한 것.</li>
    <li>소리가 안 들려서 넘어간 문장은 빼고 세요(그때도 하나까지 봐줘요).</li>
    <li>통과 못 하면 다음 날 같은 칸을 다시 해요. 막힌 문장은 다음 날 앞에 다시 나와요.</li></ol></div>`;
  h+=adminHTML();
  return h}
// 드릴 화면(상태는 RUN.ph)
// ready: 🎤 누르기 전(생각하는 중) · rec: 녹음 중 · think: 받아 적는 중 · retry: 틀림(한 번 더) · quiet: 안 들림
// model: 정답 소리 · fready/frec: 따라 말하기 · good: 따라 말하기 맞음
function drillHTML(){const R=RUN,it=SP.byId(R.ids[R.i]),ph=R.ph,fol=ph[0]==='f';
  let h=`<div class="top"><div class="dots">${R.ids.map((_,k)=>`<i class="${k<R.i?'done':k===R.i?'now':''}"></i>`).join('')}</div><span class="sub" style="font-size:13px">${esc(USER.name)}</span><button class="x" data-act="quit">그만</button></div>`;
  h+=R.mode==='base'?`<div class="base"><small>이 문장을 바꿔요</small>${esc(it.base)}</div>`:`<div class="base"><small>한글만 보고 말해요</small>&nbsp;</div>`;
  h+=`<div class="ko">${esc(it.ko)}</div>`;
  if(fol||ph==='model'||ph==='good')h+=`<div class="answer">${esc(it.en)}</div>`;
  if(R.msg&&(ph==='ready'||ph==='fready'))h+=`<div class="heard">${R.msg}</div>`;
  const skip=R.fails?`<button class="link" data-act="skip">${fol?'다음 문장으로 →':'넘어가기 →'}</button>`:'';
  if(ph==='ready'||ph==='fready'){
    h+=`<div class="state">${ph==='ready'?'생각이 되면 누르고 말해요':'정답처럼 따라 말해요'}</div><button class="big" data-act="rec" style="max-width:340px;margin:12px auto 0">🎤 ${ph==='ready'?'녹음':'따라 말하기'}</button>`;
    if(fol)h+=`<div class="row"><button class="light" data-act="again">🔊 한 번 더 듣기</button></div>`;
    h+=`<div class="row">${skip}</div>`}
  else if(ph==='rec'||ph==='frec'){
    h+=`<div class="state">🔴 녹음 중 <span id="clk">0:00</span></div><div class="meter" id="mt"><b></b></div><button class="fin" data-act="stop">다 말했어 ⏹</button>`}
  else if(ph==='think'||ph==='fthink'){h+=`<div class="state"><span class="spin">⏳</span> 듣고 있어요…</div>`}
  else if(ph==='model'){h+=`${R.ok?`<div class="okbox">👍 맞아요!</div>`:''}<div class="state">🔊 들어 봐요</div>`;
    if(!R.ok&&R.heardModel)h+=`<div class="row"><button class="light" data-act="again">🔊 한 번 더 듣기</button></div><button class="fin" data-act="nextq">다음 ▶</button>`}
  else if(ph==='retry'){h+=`<div class="heard">이렇게 들렸어요: <b>“${esc(R.heard)}”</b><br>한 번 더 해 볼까요?</div><div class="row"><button class="light" data-act="resay">🎤 다시 녹음</button><button class="light" data-act="show">정답 듣기</button></div><div class="row">${skip}</div>`}
  else if(ph==='quiet'){h+=`<div class="heard">🙉 잘 안 들렸어요. 조금 더 크게 말해 줄래요?</div><div class="row"><button class="light" data-act="resay">🎤 다시 녹음</button><button class="light" data-act="show">정답 듣기</button></div><div class="row">${skip}</div>`}
  else if(ph==='good'){h+=`<div class="okbox">👍</div>`}
  return h}
const UI={level(x,talk){const m=$('#mt');if(!m)return;m.classList.toggle('talk',!!talk);m.firstChild.style.width=Math.round(x*100)+'%'},
  clock(s){const e=$('#clk');if(e)e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}};

function bind(){document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>ACT[b.dataset.act](b));
  const s=$('#tryStage');if(s)s.onchange=()=>{V.tryStage=+s.value;render()};const m=$('#tryMode');if(m)m.onchange=()=>{V.tryMode=m.value;render()}}
const ACT={
  async start(){if(!MIME&&!MOCK)return;
    try{if(!MOCK||window.__mockMic)await micOpen()}catch(e){alert('마이크를 쓸 수 없어요. 주소창 옆 🔒 → 마이크 → 허용으로 바꿔 주세요.');return}
    warm();try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}
    const stage=stageOf(),mode=modeOf();let ids,i=0,res=[],ms=0;
    if(!TRY&&ST.cur&&ST.cur.date===today()&&ST.cur.stage===stage&&ST.cur.mode===mode){({ids,i,res,ms}=ST.cur)}else{ids=buildSet(stage)}
    RUN={date:today(),stage,mode,ids,i,res,ms,t:Date.now(),blobs:[],day:null};if(!TRY){ST.cur={date:RUN.date,stage,mode,ids,i,res,ms};save()}
    V={view:'drill',tryStage:V.tryStage,tryMode:V.tryMode};runItem()},
  rec(){const R=RUN;if(R.ph!=='ready'&&R.ph!=='fready')return;try{speechSynthesis.cancel()}catch(e){}
    if(R.ph==='ready'&&R.think==null)R.think=Date.now()-R.shown; // 생각 시간 = 한글이 나온 뒤 🎤 누를 때까지(첫 번째만)
    R.ph=R.ph==='ready'?'rec':'frec';render();recStart(UI)},
  async stop(){const R=RUN;if(R.ph!=='rec'&&R.ph!=='frec')return;const fol=R.ph==='frec';R.ph=fol?'fthink':'think';render();
    const r=await recStop();if(R!==RUN||R.quit)return;const it=SP.byId(R.ids[R.i]);
    let h='';if(r&&(r.blob||MOCK)){try{h=await stt(r.blob,r.sec,it.en)}catch(e){}}if(R!==RUN||R.quit)return;
    const v=judge(it.en,h);if(!fol&&r&&r.blob)R.blobs[R.i]=r.blob;judged(v,h,fol)},
  again(){const it=SP.byId(RUN.ids[RUN.i]);speak(it.en)},
  resay(){RUN.ph='ready';RUN.msg='';render()},
  show(){RUN.ok=false;toModel()},
  nextq(){if(RUN&&RUN.ph==='model')next()},
  skip(){const R=RUN;if(R.ph[0]!=='f')R.skipped=R.tries===0?'quiet':'wrong';next()},
  quit(){RUN.quit=true;recCancel();try{speechSynthesis.cancel()}catch(e){}pauseClock();micClose();V={view:'home',tryStage:V.tryStage,tryMode:V.tryMode};render()},
  home(){V={view:'home',tryStage:V.tryStage,tryMode:V.tryMode};render()},
  async log(){V={view:'log'};render();if(!TRY){await loadOther();if(V.view==='log')render()}},
  out(){if(window.__SP.signOut)window.__SP.signOut()},
  csv(b){if(ADMIN)csv(b&&b.dataset.k)},
  adminAsk(){ADMIN_ASK=true;ADMIN_MSG='';render();const i=$('#apw');if(i){i.focus();i.onkeydown=e=>{if(e.key==='Enter')ACT.adminGo()}}},
  async adminGo(){const i=$('#apw');const v=(i&&i.value||'').replace(/\D/g,'');if(v&&await sha(v)===ADMIN_H){ADMIN=true;ADMIN_ASK=false;try{sessionStorage.setItem('speed:admin','1')}catch(e){}}else ADMIN_MSG='비밀번호가 달라요';render()},
  adminOff(){ADMIN=false;try{sessionStorage.removeItem('speed:admin')}catch(e){}render()},
  calm(b){CALM=Math.min(0,CALM+(+b.dataset.d));render()},
  calsel(b){const k=b.dataset.k,d=b.dataset.d;CALSEL[k]=CALSEL[k]===d?null:d;render()},
  async install(){if(INSTALL){INSTALL.prompt();try{await INSTALL.userChoice}catch(e){}INSTALL=null;render()}},
  try(){location.hash='try';location.reload()},
  mine(b){const bl=RUN.blobs[+b.dataset.i];if(bl){try{const a=new Audio(URL.createObjectURL(bl));a.play()}catch(e){}}},
  ans(b){speak(SP.byId(RUN.ids[+b.dataset.i]).en)}
};
function pauseClock(){if(RUN&&RUN.t){RUN.ms+=Date.now()-RUN.t;RUN.t=0}}
function resumeClock(){if(RUN&&!RUN.t)RUN.t=Date.now()}
document.addEventListener('visibilitychange',()=>{if(V.view!=='drill')return;if(document.visibilityState==='hidden')pauseClock();else resumeClock()});

function runItem(){const R=RUN;Object.assign(R,{ph:'ready',tries:0,quiet:0,fails:0,ftries:0,ok:false,msg:'',think:null,heard:'',first:null,follow:false,skipped:null,shown:Date.now()});render()}
// 받아 적은 말 판정: 맞음 → 정답 듣고 따라 말하기 / 틀림 → 한 번 더(두 번째도 틀리면 정답 듣기) / 안 들림 → 다시 녹음(틀림 아님)
async function judged(v,h,fol){const R=RUN,it=SP.byId(R.ids[R.i]);const ok=v==='exact'||v==='fuzzy';
  if(!fol){
    if(ok){if(R.first==null)R.first=true;R.heard=h;R.ok=true;toModel();return}
    R.fails++;
    if(v==='unclear'){R.quiet++;R.ph='quiet';render();return}
    if(R.first==null)R.first=false;R.tries++;R.heard=h;
    if(R.tries<2){R.ph='retry';render();return}
    R.ok=false;toModel();return}
  if(ok){R.follow=true;R.ph='good';render();setTimeout(()=>{if(R===RUN&&!R.quit)next()},900);return}
  R.ftries++;R.fails++;
  if(R.ftries<2){R.msg=v==='unclear'?'🙉 잘 안 들렸어요. 한 번 더 들어 보고 따라 말해요.':'한 번 더 들어 보고 따라 말해요.';R.ph='model';render();await speak(it.en);if(R===RUN&&!R.quit){R.ph='fready';render()}return}
  next()}
// 엄마 11/26 「왜 두 번 녹음하는 거야? / 한 번만 녹음」: 따라 말하기 녹음을 없앰. 맞으면 정답 소리를 듣고 저절로 다음, 틀렸으면 정답을 보고 들은 뒤 「다음 ▶」.
async function toModel(){const R=RUN,it=SP.byId(R.ids[R.i]);R.ph='model';R.msg='';R.fails=0;R.heardModel=false;render();await speak(it.en);if(R!==RUN||R.quit)return;
  if(R.ok){setTimeout(()=>{if(R===RUN&&!R.quit&&R.ph==='model')next()},1200)}else{R.heardModel=true;render()}}
function next(){const R=RUN;const ok1=R.first===true;
  R.res[R.i]={id:R.ids[R.i],ok1,onset:R.think,clean:ok1&&R.think!=null&&R.think<=FAST_MS,heard:(R.heard||'').slice(0,80),follow:!!R.follow,skip:R.skipped||undefined};
  R.i++;if(!TRY){ST.cur={date:R.date,stage:R.stage,mode:R.mode,ids:R.ids,i:R.i,res:R.res,ms:R.ms+(R.t?Date.now()-R.t:0)};save()}
  if(R.i<R.ids.length){runItem();return}
  finishDay()}
// 통과: 막힘 없이 9/10(하나까지 봐줌). 소리가 안 들려서 넘어간 문장은 빼고 셈(안 들림은 틀림 아님). 단, 남은 문장이 7개는 넘어야 함.
function passCheck(res){const n=res.filter(x=>x.skip!=='quiet').length,clean=res.filter(x=>x.clean).length;return {clean,n,passed:n>=7&&clean>=n-(10-PASS_N)}}
function finishDay(){const R=RUN;pauseClock();micClose();
  const {clean,n,passed}=passCheck(R.res);
  const day={stage:R.stage,mode:R.mode,end:new Date().toISOString(),ms:R.ms,items:R.res,clean,n,passed};R.day=day;
  if(!TRY){ST.days[R.date]=day;ST.cur=null;
    const miss=R.res.filter(x=>!x.clean).map(x=>x.id),hit=new Set(R.res.filter(x=>x.clean).map(x=>x.id));
    ST.again=miss.concat((ST.again||[]).filter(id=>!hit.has(id)&&!miss.includes(id))).slice(0,6);
    // 첫날은 회색 문장 보고 → 통과하면 다음 날 같은 단계를 한글만 보고 → 통과하면 다음 단계
    if(passed&&ST.stage===R.stage&&(ST.mode||'base')===R.mode){if(R.mode==='base')ST.mode='ko';else if(ST.stage<SP.STAGES.length){ST.stage++;ST.mode='base'}}
    save()}
  V={view:'end'};render();if(!TRY)loadOther().then(()=>{if(V.view==='end')render()})}

(async function boot(){$('#app').innerHTML='<p class="sub" style="text-align:center;margin-top:40px">여는 중…</p>';
  if(document.readyState==='loading')await new Promise(r=>addEventListener('DOMContentLoaded',r));
  if(/log/.test(location.hash))V={view:'log'};
  DB=await window.__SP.ready;USER=window.__SP.user||{email:'',name:'나'};WHO=keyOf(USER.email);await tabletSihun();ST=await load();await loadOther();if(TRY)V.tryStage=ST.stage;render()})();
</script>
