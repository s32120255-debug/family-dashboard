<main id="m"><div class="muted">불러오는 중…</div></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,onAuthStateChanged,signInWithPopup} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,getDocs,query,orderBy,limit,where} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {firebaseConfig} from "../config.js";
const app=initializeApp(firebaseConfig), auth=getAuth(app), fs=getFirestore(app);
const M=document.getElementById('m');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const unpack=v=>(v&&typeof v._j==='string')?JSON.parse(v._j):v;
const P=['sihun','data'];
const getD=async p=>{const s=await getDoc(doc(fs,...P,...p.split('/')));return s.exists()?unpack(s.data()):null};
const getC=async (c,...cons)=>(await getDocs(query(collection(fs,...P,c),...cons))).docs.map(d=>({id:d.id,...unpack(d.data())})).filter(d=>!d.trial); // 👀 관리자 직접 해 보기로 생긴 AI 기록은 빼요
const pack=d=>({_j:JSON.stringify(d),at:d&&d.at!=null?d.at:null,_t:Date.now()});
const setD=(p,d)=>setDoc(doc(fs,...P,...p.split('/')),pack(d));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const WHY={understand:'📘 규칙을 잘 몰랐어',attention:'🎯 처음엔 놓쳤는데 힌트 보고 알았어',retrieval:'🗣️ 아는데 바로 안 나왔어',fatigue:'🔋 뒤로 갈수록 집중이 안 됐어',condition:'🌊 오늘 좀 피곤했어',none:'✨ 별로 안 막혔어'};
const STN={'be+':'be 지금 · 긍정','be-':'be 지금 · 부정','beQ':'be 지금 · 의문','loc':'📍 at · in · on (장소)','be+past':'be 과거 · 긍정','be-past':'be 과거 · 부정','beQpast':'be 과거 · 의문','there+':'There is/are','there-':'There 부정','thereQ':'Is/Are there?','do+':'일반동사 지금','do+s':'일반동사 -s','do+past':'일반동사 과거','do-':'do not','do-s':'does not','do-past':'did not','doQ':'Do ~?','doesQ':'Does ~?','didQ':'Did ~?'};
const CLS={ok:'바로 완성',access:'힌트 보고 고쳐서 완성',unknown:'두 번 틀려 정답 보고 익힘',speak:'말하기 막힘'};
const KOT={daily:'복습 카드',test:'누적 테스트',wrong:'오답',hw:'숙제',write:'독서 워크지',lit:'문학 개념',fill:'핵심 빈칸',note:'개념 정리'};
let day=new Date(); let CACHE=null;

function gate(){
  let ok=false;try{ok=sessionStorage.getItem('hub:mom')==='1'}catch(e){}
  if(ok) return start();
  M.innerHTML=`<div class="gate"><h1>엄마 리포트</h1><p class="muted">엄마 비밀번호</p><input id="pw" type="password" inputmode="numeric" autocomplete="off"><p><button class="btn" id="go">열기</button></p><p id="e" class="bad"></p></div>`;
  const go=()=>{if(document.getElementById('pw').value==='503553'){try{sessionStorage.setItem('hub:mom','1')}catch(e){}start()}else document.getElementById('e').textContent='비밀번호가 달라요'};
  document.getElementById('go').onclick=go;document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function start(){
  M.innerHTML='<div class="muted">기록 불러오는 중…</div>';
  try{
    const [routine,vcheck,changes,results,m32]=await Promise.all([getD('log/routine'),getD('vocab/check'),getD('meta/changes'),getC('results',orderBy('at','desc'),limit(800)),getC('m32att')]);
    CACHE={routine,vcheck,changes,results,m32};render();
  }catch(e){M.innerHTML=`<div class="card bad">기록을 못 불러왔어요 (${esc(e.code||e.message)})</div>`}
}
// ===== 수학 AI 분석 (엄마 11/23): 버튼을 누르면 서버(m32Analyze)가 기록·손풀이·AI 대화를 읽고 분석해요 =====
const LVN=['기초','교과','응용','심화','최상위','📘 최상위 문제집'];
// 🃏 전략 카드(최상위 문제집, 엄마 11/24): 이날 + 그날까지 누적, 전략마다 문제 수·한 번에 맞힘·길잡이에서 카드 바로 고름
const STRN={one:'🧱 한 칸',back:'⏪ 거꾸로',pair:'🔗 짝짓기',sd:'⚖️ 합차',sq:'□ 놓기',same:'🔄 같은 모양',case:'📋 나눠 세기',end:'🎯 끝 값',swap:'🔁 바꿔 넣기',keep:'✂️ 안 변하는 것',make:'🧩 더하고 빼서 만들기',rest:'🧮 전체에서 빼기'};
const PFN={stair:'막대 계단',bar2:'막대 두 줄',list:'빠짐없이 표',sd:'선분 두 개',sd3:'선분 세 개',eq2:'같은 길이 두 줄',scale2:'저울 두 개'},PFS=['빈 틀','틀 고르기','혼자 그리기'];
function pfBox(MA){ /* 🖼 그림 틀(5단계)·그림 복습 (11/24) */ const F=MA.filter(x=>x.mode==='solve'&&x.frame), R=MA.filter(x=>x.mode==='review'), T=MA.filter(x=>x.mode==='twin'&&x.of&&R.some(r=>r.of===x.of));
  if(!F.length&&!R.length) return '';
  const fl=F.map(x=>`<li>${x.res==='o'?'⭕':x.res==='h'?'△':x.res==='s'?'⏭':'❌'} ${PFN[x.frame.k]||esc(x.frame.k)} · ${PFS[x.frame.stage]||''}${x.frame.stage===1?(x.frame.pickOk===1?' · 맞는 틀 고름':x.frame.pickOk===0?` · 다른 틀 고름(${PFN[x.frame.pick]||esc(x.frame.pick)})`:' · 직접 그림'):''}${x.frame.out?' · 틀 꺼냄':''} <span class="muted">${esc(x.q)}</span></li>`).join('');
  const rl=R.map(x=>{ const tw=T.find(t=>t.of===x.of); return `<li>🖼 그림 복습 ${x.res==='o'?'⭕ 한 번에':x.res==='h'?'△ 두 번째에':'❌ 못 맞힘'} <span class="muted">${esc(x.q)} · 정답 ${esc(x.ans)}</span>${tw?`<br>🔁 쌍둥이(틀 없이): ${tw.res==='o'?'⭕ 한 번에':tw.res==='h'?'△ 두 번째에':'❌ 못 맞힘'} <span class="muted">${esc(tw.q)}</span>`:''}${x.pen?`<div class="pen" data-pen="${esc(x.pen.id)}"></div>`:''}</li>`; }).join('');
  return `<h3 style="font-size:16px;margin:12px 0 4px">🖼 그림 틀 (5단계) · 그림 복습</h3><ul>${rl}${fl}</ul>`; }
function stratBox(day,all){ const A=all.filter(x=>x.strat); if(!A.length) return ''; const D=new Set(day.filter(x=>x.strat).map(x=>x.strat));
  const g={}; A.forEach(x=>{ const o=g[x.strat]||(g[x.strat]={n:0,o:0,gd:0,pk:0}); o.n++; if(x.res==='o'&&!x.guide) o.o++; if(x.stratOk!=null){ o.gd++; if(x.stratOk) o.pk++; } });
  const rows=Object.entries(g).sort((a,b)=>(D.has(b[0])-D.has(a[0]))||b[1].n-a[1].n).map(([k,o])=>`<tr${D.has(k)?' style="font-weight:700"':''}><td>${STRN[k]||k}</td><td>${o.n}</td><td>${o.o}</td><td>${o.gd?o.pk+'/'+o.gd:'-'}</td></tr>`).join('');
  return `<h3 style="font-size:16px;margin:12px 0 4px">🃏 최상위 문제집 전략별 (지금까지, 굵은 줄 = 이날 푼 전략)</h3><table class="kot"><tr><th>전략</th><th>문제</th><th>혼자 한 번에 ⭕</th><th>길잡이에서 카드 바로 고름</th></tr>${rows}</table><p class="muted" style="font-size:13px">혼자 한 번에 맞힌 수가 적은 전략이 약한 생각 길이에요. 카드를 바로 못 고르면 "어떤 전략인지 알아보는 눈"이 아직이에요.</p>`; }
const anaItem=x=>({key:x.ts,d:x.d,q:x.q,ans:x.ans,lv:LVN[x.lv]||x.lv,res:x.res,wrong:x.wrong,sec:x.sec,hints:x.hints,tries:x.tries,tags:x.tags,fixed:!!x.fixed,learn:x.learn||null,penAsk:x.penAsk||null,solSeen:!!x.solSeen,guide:x.guide?{steps:x.guide,ok:x.guideOk,afterWrong:!!x.guideAfterWrong}:null,twin:x.twin||null,strat:x.strat||null,stratOk:x.stratOk==null?null:x.stratOk,
  pen:x.pen?{id:x.pen.id,n:x.pen.n,first:x.pen.first,erase:x.pen.erase,idle:x.pen.idle,photos:x.pen.ph||0}:null,tutor:x.tutor?{turns:(x.tutor.turns||[]).map(t=>({who:t.who,text:t.text})),read:x.tutor.read,mom:x.tutor.mom,shorter:x.tutor.shorter,end:x.tutor.end}:null});
function anaHTML(r,MI){ if(!r) return ''; if(r.state==='limit') return '<div class="ana bad">오늘 분석 횟수를 다 썼어요.</div>'; if(r.state!=='ok') return `<div class="ana bad">분석이 안 됐어요 (${esc(r.err||r.state)}). 잠시 뒤 다시 눌러 주세요.</div>`;
  const qOf=k=>{const x=MI.find(y=>y.ts===k);return x?x.q:''};
  return `<div class="ana"><b>🔍 AI 분석</b> <span class="muted" style="font-size:12px">${r.atRes?new Date(r.atRes).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'}):''}${r.imgs!=null?` · 손풀이 ${r.imgs}장 봄`:''}</span>
    <p>${esc(r.summary)}</p>${(r.problems||[]).length>1||(r.problems||[]).length&&!r.one?`<h4>문제별</h4><ul>${r.problems.map(p=>`<li>${qOf(p.key)?`<span class="muted">${esc(qOf(p.key).slice(0,50))}</span><br>`:''}<b>본 것:</b> ${esc(p.saw)}<br><b>왜:</b> ${esc(p.why)}<br><b>다음엔:</b> ${esc(p.next)}</li>`).join('')}</ul>`:(r.problems||[]).map(p=>`<p><b>본 것:</b> ${esc(p.saw)}<br><b>왜:</b> ${esc(p.why)}<br><b>다음엔:</b> ${esc(p.next)}</p>`).join('')}
    ${r.pattern?`<h4>반복되는 모습</h4><p>${esc(r.pattern)}</p>`:''}${(r.teach||[]).length?`<h4>이렇게 가르쳐 보세요</h4><ul>${r.teach.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}</div>`; }
async function runAna(kind,k,items,extra,MI,out,btn){
  const id=`${k}-${kind}-${Date.now()}`; btn&&(btn.disabled=true); out.innerHTML='<div class="ana muted">🔍 분석 중이에요… 1~3분 걸려요. 이 화면을 열어 두세요.</div>';
  try{ await setD('m32ana/'+id,{at:k,date:k,ts:new Date().toISOString(),kind,items,...extra});
    for(let i=0;i<110;i++){ await new Promise(r=>setTimeout(r,3000)); const d=await getD('m32ana/'+id).catch(()=>null); if(d&&d.res){ out.innerHTML=anaHTML({...d.res,one:kind==='one'},MI); btn&&(btn.disabled=false); return; } }
    out.innerHTML='<div class="ana bad">답이 너무 늦어요. 잠시 뒤 새로고침해서 확인해 주세요.</div>';
  }catch(e){ out.innerHTML=`<div class="ana bad">요청을 못 보냈어요 (${esc(e.code||e.message)})</div>`; }
  btn&&(btn.disabled=false); }
async function mountAna(k,MI){
  // 저장된 분석 보여 주기(가장 최근 것)
  getC('m32ana',where('at','==',k)).then(L=>{ L=L.filter(d=>d.res).sort((a,b)=>(a.res.atRes||0)-(b.res.atRes||0));
    const lastOf=f=>L.filter(f).slice(-1)[0];
    const dd=lastOf(d=>d.kind==='day'||d.kind==='week'); const o=document.getElementById('adayout'); if(dd&&o&&!o.innerHTML) o.innerHTML=(dd.kind==='week'?'<div class="muted" style="font-size:13px">최근 7일 분석</div>':'')+anaHTML(dd.res,MI);
    document.querySelectorAll('.aslot[data-key]').forEach(el=>{ const a=lastOf(d=>d.kind==='one'&&d.key===el.dataset.key); if(a&&!el.innerHTML) el.innerHTML=anaHTML({...a.res,one:true},MI); });
  }).catch(()=>{});
  const day=document.getElementById('aday'), week=document.getElementById('aweek'), out=document.getElementById('adayout');
  if(day) day.onclick=()=>runAna('day',k,MI.map(anaItem),{},MI,out,day);
  if(week) week.onclick=()=>{ const t=new Date(k+'T12:00:00'); const from=new Date(t); from.setDate(t.getDate()-6); const fk=dkey(from);
    const W=CACHE.m32.filter(d=>d.date>=fk&&d.date<=k).flatMap(d=>d.items||[]).filter(x=>x.mode==='solve');
    runAna('week',k,W.map(anaItem),{from:fk},W,out,week); };
  document.querySelectorAll('.abtn[data-one]').forEach(b=>b.onclick=()=>{ const x=MI.find(y=>y.ts===b.dataset.one); if(!x) return;
    runAna('one',k,[anaItem(x)],{key:x.ts},MI,b.previousElementSibling,b); });
}
// ===== 기록 내보내기 (엄마 11/23): 기간의 기록 + 손풀이 그림 + AI 대화·분석을 JSON 파일 하나로 =====
async function exportRecs(k,days){ const out=document.getElementById('expout'); const t=new Date(k+'T12:00:00'); const f=new Date(t); f.setDate(t.getDate()-days+1); const fk=dkey(f);
  const inR=d=>d&&d>=fk&&d<=k; out.textContent='모으는 중…';
  try{ const C=CACHE;
    const math=C.m32.filter(d=>inR(d.date)).flatMap(d=>d.items||[]);
    const pens={}; const ids=math.filter(x=>x.pen&&x.pen.id).map(x=>x.pen.id); let n=0;
    for(const id of ids){ const d=await getD('m32pen/'+id).catch(()=>null); if(d){ const photos=[]; for(const q of (d.ph||[])){ const pd=await getD('m32pen/'+q).catch(()=>null); if(pd&&pd.img) photos.push(pd.img); } pens[id]={img:d.img,strokes:(d.strokes||[]).length,w:d.w,h:d.h,photos}; } out.textContent=`손풀이 그림 ${++n}/${ids.length}…`; }
    const ana=(await getC('m32ana').catch(()=>[])).filter(d=>inR(d.at)&&d.res).map(d=>({kind:d.kind,at:d.at,key:d.key||null,from:d.from||null,res:d.res}));

  const mwl=MW.map(x=>`<li>${x.res==='s'?'⏭':x.res==='h'?'△':x.res==='o'?'⭕':'❌'} ${esc(x.q)} <span class="muted">(정답 ${esc(x.ans)}${x.wrong&&x.wrong.length?` · 쓴 답 ${esc(x.wrong.join(', '))}`:''})</span>${x.pen?`<br><span class="muted">${x.pen.ph?`📷 사진 ${x.pen.ph} · `:''}✍️ 획 ${x.pen.n} · 첫 획 ${x.pen.first}초${x.pen.erase?` · 지우개 ${x.pen.erase}`:''}${x.pen.idle>=20?` · 가장 오래 멈춤 ${x.pen.idle}초`:''}</span><div class="pen" data-pen="${esc(x.pen.id)}"></div>`:'<br><span class="muted">손풀이 없음</span>'}${x.solSeen?' · 📖 풀이 봄':''}${x.twin?`<div>🔁 쌍둥이 문제: ${x.twin.res==='o'?'⭕ 혼자 한 번에 맞힘':x.twin.res==='h'?'△ 두 번째에 맞힘':'❌ 못 맞힘'} <span class="muted">(${esc(x.twin.q)} · 정답 ${esc(x.twin.ans)}${x.twin.wrong&&x.twin.wrong.length?` · 쓴 답 ${esc(x.twin.wrong.join(', '))}`:''})</span></div>`:''}${x.strat?`<div class="muted">🃏 ${STRN[x.strat]||x.strat} 전략${x.stratOk==null?'':x.stratOk?' · 길잡이에서 전략 카드 바로 고름':' · 길잡이에서 전략 카드 헤맴'}</div>`:''}${x.guide?`<div class="muted">🧭 길잡이로 풂${x.guideAfterWrong?'(틀린 뒤)':'(처음부터)'} · 작은 질문 ${x.guide}칸 중 스스로 맞힘 ${x.guideOk}</div>`:''}${x.tutor&&x.tutor.turns&&x.tutor.turns.length?`<div class="tut"><b>🧑‍🏫 AI 과외</b> <span class="muted">(${({solved:'스스로 찾음',fixed:'스스로 고침',stopped:'그만함',limit:'횟수 끝',error:'연결 안 됨'})[x.tutor.end]||''})</span>${x.tutor.read?`<div class="muted">읽은 식: ${esc(x.tutor.read)}</div>`:''}${x.tutor.turns.map(t=>`<div>${t.who==='ai'?'🧑‍🏫':'🙋'} ${esc(t.text)}</div>`).join('')}${(x.tutor.mom||[]).length?`<div><b>엄마 메모:</b> ${esc([...new Set(x.tutor.mom)].join(' / '))}</div>`:''}${x.tutor.shorter?`<div>💡 더 간단한 방법: ${esc(x.tutor.shorter)}</div>`:''}${x.learn&&(x.learn.nw||x.learn.use)?`<div>${({new:'💡 처음 알았어요',knew:'🙂 알던 거예요'})[x.learn.nw]||''} · ${({will:'👍 써 볼래요',mine:'✋ 내 방법이 더 편해요'})[x.learn.use]||''}</div>`:''}</div>`:''}${x.fixed?'<div class="muted">✏️ 패드에 쓰다가 스스로 고침</div>':''}${x.cond?`<div class="muted">🔎 조건 ${x.cond.n}개 · ${x.cond.tries<=1?'한 번에 다 찾음':x.cond.tries+'번 만에 다 찾음'}${(x.cond.miss||[]).length&&x.cond.mode==='tap'?` · 처음에 놓친 조건: ${x.cond.miss.map(m=>'「'+esc(m)+'」').join(' ')}`:''}</div>`:''}${x.ts?`<div class="aslot" data-key="${esc(x.ts)}"></div><button class="abtn" data-one="${esc(x.ts)}">🔍 이 문제 AI 분석</button>`:''}</li>`).join('');
  h+=`<div class="card"><h2>🔢 수학</h2>${MI.length?`<div class="row">${stat(MI.length+'문제','푼 문제 (3-2)')}${stat(mo,'맞음')}${stat(mx,'틀림')}${ms?stat(ms,'건너뜀'):''}${mt?stat(Math.round(mt/60)+'분','수학 시간'):''}${(()=>{const c=MI.filter(x=>x.cond);return c.length?stat(c.filter(x=>x.cond.tries<=1).length+'/'+c.length,'조건 한 번에 다 찾음'):''})()}</div>${stratBox(MI,C.m32.filter(d=>d.date<=k).flatMap(d=>d.items||[]).filter(x=>x.mode==='solve'))}${pfBox(MA)}<div><button class="abtn" id="aday">🔍 이날 수학 AI 분석</button><button class="abtn" id="aweek">🔍 최근 7일 AI 분석</button><span class="muted" style="font-size:13px"> 1~3분 걸려요</span></div><div id="adayout"></div>${mwl?`<h3 style="font-size:16px;margin:12px 0 4px">✍️ 틀린 문제 · 손풀이 · AI 과외 대화</h3><ul>${mwl}</ul>`:''}`:ma.n?`<div class="row">${stat(ma.n+'문제','푼 문제')}${stat(ma.ok||0,'맞음')}</div>`:'<p class="muted">이날 수학 기록이 없어요.</p>'}</div>`;
  h+=`<div class="card"><h2>🧑‍🏫 수학 가르치기 (카츄)</h2><div id="tcbody"><p class="muted">불러오는 중…</p></div></div>`;
  h+=`<div class="card"><h2>✍️ 글쓰기 첨삭</h2><div id="wrbody"><p class="muted">불러오는 중…</p></div></div>`;
  // 막힌 이유
  const ws=Object.entries(S).filter(([,v])=>v&&v.why&&v.why.length).map(([s,v])=>`<li><b>${{en:'영어',ko:'국어',math:'수학',sp:'특별',write:'글쓰기'}[s]||s}</b>: ${v.why.map(w=>WHY[w]||w).join(', ')}</li>`).join('');
  h+=`<div class="card"><h2>🧭 시훈이가 고른 막힌 이유</h2>${ws?`<ul>${ws}</ul>`:'<p class="muted">이날은 고른 게 없어요.</p>'}<p class="muted">판단은 5일 이상 기록이 쌓인 뒤에 해요.</p></div>`;
  // 바뀐 것
  const ch=((C.changes&&C.changes.items)||[]).filter(x=>x.date===k);
  h+=`<div class="card"><h2>🔧 이날 앱에서 바뀐 것</h2>${ch.length?`<ul>${ch.map(x=>`<li>${esc(x.what)}</li>`).join('')}</ul>`:'<p class="muted">바뀐 것 없음</p>'}</div>`;
  h+=`<div class="card"><h2>🤖 AI 사용량 · 대략 비용</h2><div id="aiuse"><p class="muted">불러오는 중…</p></div></div>`;
  h+=`<div class="card"><h2>📦 기록 내보내기</h2><p class="muted" style="font-size:14px">파일로 받아서 Claude에게 올리면 손풀이·대화까지 보고 가르치는 방법을 다듬어요.</p><div><button class="abtn" data-exp="1">이날</button><button class="abtn" data-exp="7">최근 7일</button><button class="abtn" data-exp="30">최근 30일</button></div><div id="expout" class="muted" style="font-size:14px"></div></div>`;
  h+=`<p class="muted"><a href="./">← 시훈 공부방</a> · 더 자세한 기록은 각 과목의 엄마 보기에서 볼 수 있어요.</p>`;
  M.innerHTML=h;
  document.querySelectorAll('.pen[data-pen]').forEach(async el=>{const d=await getD('m32pen/'+el.dataset.pen).catch(()=>null);if(d&&(d.img||(d.ph||[]).length)){el.innerHTML=d.img?`<img src="${d.img}" alt="손풀이">`:'';for(const q of (d.ph||[])){const pd=await getD('m32pen/'+q).catch(()=>null);if(pd&&pd.img)el.insertAdjacentHTML('beforeend',`<div class="muted">📷 종이 풀이 사진</div><img src="${pd.img}" alt="사진">`)}}else el.innerHTML='<span class="muted">손풀이를 못 불러왔어요</span>'});
  if(MI.length) mountAna(k,MI);
  if(KR.length) koFill(KR).then(()=>koExtra(k));
  writeFill(k); aiUse(k); teachFill(k); enChatFill(k);
  document.getElementById('pv').onclick=()=>{day.setDate(day.getDate()-1);render()};
  document.getElementById('nx').onclick=()=>{day.setDate(day.getDate()+1);render()};
  document.getElementById('td').onclick=()=>{day=new Date();render()};
  document.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>exportRecs(k,+b.dataset.exp));
}
onAuthStateChanged(auth,u=>{
  if(!u){M.innerHTML=`<div class="gate"><h1>엄마 리포트</h1><p><button class="btn" id="li">구글로 로그인</button></p></div>`;document.getElementById('li').onclick=async()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});try{await signInWithPopup(auth,p)}catch(e){alert('로그인이 안 됐어요: '+(e.code||e.message))}};return}
  start();
});
</script>
