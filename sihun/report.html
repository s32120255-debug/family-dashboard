<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시훈 하루 리포트</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{--bg:#f7f3ea;--card:#fffdf8;--ink:#1f2a44;--sub:#6b7280;--line:#e6e0d2;--ok:#2a9d5c;--bad:#c8553d;--chip:#f1ede3;--acc:#2f6b4f}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a26;--card:#1f2636;--ink:#eef1f7;--sub:#a3abbd;--line:#323b50;--chip:#2a3245}}
  :root[data-theme="dark"]{--bg:#151a26;--card:#1f2636;--ink:#eef1f7;--sub:#a3abbd;--line:#323b50;--chip:#2a3245}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.55}
  main{max-width:760px;margin:0 auto;padding:16px 16px 60px}
  h1{font-size:24px;margin:4px 0 12px}
  .nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .nav button,.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}
  .nav .d{flex:1;text-align:center;font-weight:700;font-size:18px}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .card h2{font-size:19px;margin:0 0 8px}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  .st{background:var(--chip);border-radius:12px;padding:8px 12px;min-width:110px}
  .st b{display:block;font-size:20px}
  .st span{font-size:13px;color:var(--sub)}
  .muted{color:var(--sub);font-size:14px}
  ul{margin:6px 0;padding-left:20px} li{margin:3px 0}
  .ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
  .gate{max-width:360px;margin:60px auto;text-align:center}
  .gate input{font-size:22px;padding:10px;border-radius:12px;border:2px solid var(--line);width:180px;text-align:center;background:var(--card);color:var(--ink)}
  a{color:inherit}
  .tut{background:var(--chip);border-radius:12px;padding:8px 12px;margin-top:6px}
  .ana{background:#f3f7ff;border:1.5px solid #c9d8f5;border-radius:12px;padding:10px 14px;margin-top:8px}.ana h4{margin:8px 0 4px;font-size:15px}.ana ul{margin:4px 0;padding-left:20px}
  .abtn{background:#fff;border:1.5px solid #9db6e6;border-radius:10px;padding:6px 12px;font-size:14px;margin:4px 6px 0 0;cursor:pointer}.abtn:disabled{opacity:.5}
  .pen img{max-width:100%;max-height:320px;background:#fff;border:1.5px solid var(--line);border-radius:10px;margin-top:6px}
</style>
</head>
<body>
<main id="m"><div class="muted">불러오는 중…</div></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,onAuthStateChanged,signInWithPopup} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,getDocs,query,orderBy,limit,where} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {firebaseConfig} from "../config.js";
const app=initializeApp(firebaseConfig), auth=getAuth(app), fs=getFirestore(app);
const M=document.getElementById('m');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const unpack=v=>(v&&typeof v._j==='string')?JSON.parse(v._j):v;
const P=['sihun','data'];
const getD=async p=>{const s=await getDoc(doc(fs,...P,...p.split('/')));return s.exists()?unpack(s.data()):null};
const getC=async (c,...cons)=>(await getDocs(query(collection(fs,...P,c),...cons))).docs.map(d=>({id:d.id,...unpack(d.data())}));
const pack=d=>({_j:JSON.stringify(d),at:d&&d.at!=null?d.at:null,_t:Date.now()});
const setD=(p,d)=>setDoc(doc(fs,...P,...p.split('/')),pack(d));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const WHY={understand:'📘 규칙을 잘 몰랐어',attention:'🎯 처음엔 놓쳤는데 힌트 보고 알았어',retrieval:'🗣️ 아는데 바로 안 나왔어',fatigue:'🔋 뒤로 갈수록 집중이 안 됐어',condition:'🌊 오늘 좀 피곤했어',none:'✨ 별로 안 막혔어'};
const CLS={ok:'바로 완성',access:'힌트 보고 고쳐서 완성',unknown:'두 번 틀려 정답 보고 익힘',speak:'말하기 막힘'};
const KOT={daily:'복습 카드',test:'누적 테스트',wrong:'오답',hw:'숙제',write:'독서 워크지',lit:'문학 개념',fill:'핵심 빈칸',note:'개념 정리'};
let day=new Date(); let CACHE=null;

function gate(){
  let ok=false;try{ok=sessionStorage.getItem('hub:mom')==='1'}catch(e){}
  if(ok) return start();
  M.innerHTML=`<div class="gate"><h1>엄마 리포트</h1><p class="muted">엄마 비밀번호</p><input id="pw" type="password" inputmode="numeric" autocomplete="off"><p><button class="btn" id="go">열기</button></p><p id="e" class="bad"></p></div>`;
  const go=()=>{if(document.getElementById('pw').value==='503553'){try{sessionStorage.setItem('hub:mom','1')}catch(e){}start()}else document.getElementById('e').textContent='비밀번호가 달라요'};
  document.getElementById('go').onclick=go;document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function start(){
  M.innerHTML='<div class="muted">기록 불러오는 중…</div>';
  try{
    const [routine,vcheck,changes,results,m32]=await Promise.all([getD('log/routine'),getD('vocab/check'),getD('meta/changes'),getC('results',orderBy('at','desc'),limit(800)),getC('m32att')]);
    CACHE={routine,vcheck,changes,results,m32};render();
  }catch(e){M.innerHTML=`<div class="card bad">기록을 못 불러왔어요 (${esc(e.code||e.message)})</div>`}
}
// ===== 수학 AI 분석 (엄마 11/23): 버튼을 누르면 서버(m32Analyze)가 기록·손풀이·AI 대화를 읽고 분석해요 =====
const LVN=['기초','교과','응용','심화','최상위','📘 책'];
const anaItem=x=>({key:x.ts,d:x.d,q:x.q,ans:x.ans,lv:LVN[x.lv]||x.lv,res:x.res,wrong:x.wrong,sec:x.sec,hints:x.hints,tries:x.tries,tags:x.tags,fixed:!!x.fixed,learn:x.learn||null,penAsk:x.penAsk||null,solSeen:!!x.solSeen,
  pen:x.pen?{id:x.pen.id,n:x.pen.n,first:x.pen.first,erase:x.pen.erase,idle:x.pen.idle,photos:x.pen.ph||0}:null,tutor:x.tutor?{turns:(x.tutor.turns||[]).map(t=>({who:t.who,text:t.text})),read:x.tutor.read,mom:x.tutor.mom,shorter:x.tutor.shorter,end:x.tutor.end}:null});
function anaHTML(r,MI){ if(!r) return ''; if(r.state==='limit') return '<div class="ana bad">오늘 분석 횟수를 다 썼어요.</div>'; if(r.state!=='ok') return `<div class="ana bad">분석이 안 됐어요 (${esc(r.err||r.state)}). 잠시 뒤 다시 눌러 주세요.</div>`;
  const qOf=k=>{const x=MI.find(y=>y.ts===k);return x?x.q:''};
  return `<div class="ana"><b>🔍 AI 분석</b> <span class="muted" style="font-size:12px">${r.atRes?new Date(r.atRes).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'}):''}${r.imgs!=null?` · 손풀이 ${r.imgs}장 봄`:''}</span>
    <p>${esc(r.summary)}</p>${(r.problems||[]).length>1||(r.problems||[]).length&&!r.one?`<h4>문제별</h4><ul>${r.problems.map(p=>`<li>${qOf(p.key)?`<span class="muted">${esc(qOf(p.key).slice(0,50))}</span><br>`:''}<b>본 것:</b> ${esc(p.saw)}<br><b>왜:</b> ${esc(p.why)}<br><b>다음엔:</b> ${esc(p.next)}</li>`).join('')}</ul>`:(r.problems||[]).map(p=>`<p><b>본 것:</b> ${esc(p.saw)}<br><b>왜:</b> ${esc(p.why)}<br><b>다음엔:</b> ${esc(p.next)}</p>`).join('')}
    ${r.pattern?`<h4>반복되는 모습</h4><p>${esc(r.pattern)}</p>`:''}${(r.teach||[]).length?`<h4>이렇게 가르쳐 보세요</h4><ul>${r.teach.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}</div>`; }
async function runAna(kind,k,items,extra,MI,out,btn){
  const id=`${k}-${kind}-${Date.now()}`; btn&&(btn.disabled=true); out.innerHTML='<div class="ana muted">🔍 분석 중이에요… 1~3분 걸려요. 이 화면을 열어 두세요.</div>';
  try{ await setD('m32ana/'+id,{at:k,date:k,ts:new Date().toISOString(),kind,items,...extra});
    for(let i=0;i<110;i++){ await new Promise(r=>setTimeout(r,3000)); const d=await getD('m32ana/'+id).catch(()=>null); if(d&&d.res){ out.innerHTML=anaHTML({...d.res,one:kind==='one'},MI); btn&&(btn.disabled=false); return; } }
    out.innerHTML='<div class="ana bad">답이 너무 늦어요. 잠시 뒤 새로고침해서 확인해 주세요.</div>';
  }catch(e){ out.innerHTML=`<div class="ana bad">요청을 못 보냈어요 (${esc(e.code||e.message)})</div>`; }
  btn&&(btn.disabled=false); }
async function mountAna(k,MI){
  // 저장된 분석 보여 주기(가장 최근 것)
  getC('m32ana',where('at','==',k)).then(L=>{ L=L.filter(d=>d.res).sort((a,b)=>(a.res.atRes||0)-(b.res.atRes||0));
    const lastOf=f=>L.filter(f).slice(-1)[0];
    const dd=lastOf(d=>d.kind==='day'||d.kind==='week'); const o=document.getElementById('adayout'); if(dd&&o&&!o.innerHTML) o.innerHTML=(dd.kind==='week'?'<div class="muted" style="font-size:13px">최근 7일 분석</div>':'')+anaHTML(dd.res,MI);
    document.querySelectorAll('.aslot[data-key]').forEach(el=>{ const a=lastOf(d=>d.kind==='one'&&d.key===el.dataset.key); if(a&&!el.innerHTML) el.innerHTML=anaHTML({...a.res,one:true},MI); });
  }).catch(()=>{});
  const day=document.getElementById('aday'), week=document.getElementById('aweek'), out=document.getElementById('adayout');
  if(day) day.onclick=()=>runAna('day',k,MI.map(anaItem),{},MI,out,day);
  if(week) week.onclick=()=>{ const t=new Date(k+'T12:00:00'); const from=new Date(t); from.setDate(t.getDate()-6); const fk=dkey(from);
    const W=CACHE.m32.filter(d=>d.date>=fk&&d.date<=k).flatMap(d=>d.items||[]).filter(x=>x.mode==='solve');
    runAna('week',k,W.map(anaItem),{from:fk},W,out,week); };
  document.querySelectorAll('.abtn[data-one]').forEach(b=>b.onclick=()=>{ const x=MI.find(y=>y.ts===b.dataset.one); if(!x) return;
    runAna('one',k,[anaItem(x)],{key:x.ts},MI,b.previousElementSibling,b); });
}
// ===== 기록 내보내기 (엄마 11/23): 기간의 기록 + 손풀이 그림 + AI 대화·분석을 JSON 파일 하나로 =====
async function exportRecs(k,days){ const out=document.getElementById('expout'); const t=new Date(k+'T12:00:00'); const f=new Date(t); f.setDate(t.getDate()-days+1); const fk=dkey(f);
  const inR=d=>d&&d>=fk&&d<=k; out.textContent='모으는 중…';
  try{ const C=CACHE;
    const math=C.m32.filter(d=>inR(d.date)).flatMap(d=>d.items||[]);
    const pens={}; const ids=math.filter(x=>x.pen&&x.pen.id).map(x=>x.pen.id); let n=0;
    for(const id of ids){ const d=await getD('m32pen/'+id).catch(()=>null); if(d){ const photos=[]; for(const q of (d.ph||[])){ const pd=await getD('m32pen/'+q).catch(()=>null); if(pd&&pd.img) photos.push(pd.img); } pens[id]={img:d.img,strokes:(d.strokes||[]).length,w:d.w,h:d.h,photos}; } out.textContent=`손풀이 그림 ${++n}/${ids.length}…`; }
    const ana=(await getC('m32ana').catch(()=>[])).filter(d=>inR(d.at)&&d.res).map(d=>({kind:d.kind,at:d.at,key:d.key||null,from:d.from||null,res:d.res}));
    const ko=C.results.filter(r=>r.at&&inR(dkey(new Date(r.at))));
    const daily={}; for(let x=new Date(f);dkey(x)<=k;x.setDate(x.getDate()+1)){ const dd=await getD('daily/'+dkey(x)).catch(()=>null); if(dd) daily[dkey(x)]=dd; }
    const R=C.routine&&C.routine.days||{}, V=C.vcheck&&C.vcheck.days||{};
    const en={routine:Object.fromEntries(Object.entries(R).filter(([d])=>inR(d))),vocab:Object.fromEntries(Object.entries(V).filter(([d])=>inR(d)))};
    const changes=((C.changes&&C.changes.items)||[]).filter(x=>inR(x.date));
    const data={app:'sihun-report-export',v:1,from:fk,to:k,made:new Date().toISOString(),math,pens,ana,ko,en,daily,changes};
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`시훈기록_${fk}_${k}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    out.innerHTML=`✅ 파일을 받았어요 (수학 ${math.length}문제, 손풀이 ${Object.keys(pens).length}장, ${Math.round(blob.size/1024)}KB). 다운로드 폴더의 <b>시훈기록_…json</b>을 Claude에게 올려 주세요.`;
  }catch(e){ out.textContent='내보내기가 안 됐어요: '+(e.code||e.message); } }
const stat=(v,l)=>`<div class="st"><b>${v}</b><span>${l}</span></div>`;
async function render(){
  const k=dkey(day);const C=CACHE;
  const D=await getD('daily/'+k).catch(()=>null)||{subjects:{}};const S=D.subjects||{};
  let h=`<h1>📋 시훈 하루 리포트</h1><div class="nav"><button id="pv">◀</button><div class="d">${day.getMonth()+1}월 ${day.getDate()}일 (${'일월화수목금토'[day.getDay()]})</div><button id="nx">▶</button><button id="td">오늘</button></div>`;
  // 영어
  const en=(S.en&&S.en.actual)||{};const R=(C.routine&&C.routine.days&&C.routine.days[k])||{};const V=(C.vcheck&&C.vcheck.days&&C.vcheck.days[k])||{};
  const vn=(en.vocab&&en.vocab.n)||V.n||0, vk=(en.vocab&&en.vocab.known)||V.known||0;
  const pred=en.predMin??R.predMin, act=en.actualMin??R.actualMin;
  const cls=R.cls||{};const clsL=Object.entries(cls).filter(([,n])=>n>0).map(([c,n])=>`<li>${CLS[c]||c}: ${n}문장</li>`).join('');
  h+=`<div class="card"><h2>🇺🇸 영어</h2><div class="row">${stat(vn+'개',`단어 체크 (알아요 ${vk})`)}${stat((en.main||R.n||0)+'문장',`문장 (맞음 ${en.ok||0}${en.skipped?`, 건너뜀 ${en.skipped}`:''})`)}${stat(pred!=null?pred+'분':'–','예측 시간')}${stat(act!=null?act+'분':'–','실제 시간')}</div>
    ${pred!=null&&act!=null?`<p>예측 ${pred}분 → 실제 ${act}분 · <b>${Math.abs(act-pred)<=Math.max(2,pred*.2)?'<span class="ok">예측이 정확했어요</span>':act>pred?'예상보다 오래 걸렸어요':'예상보다 빨리 끝났어요'}</b></p>`:''}
    ${clsL?`<ul>${clsL}</ul>`:''}${!vn&&!(en.main||R.n)?'<p class="muted">이날 영어 기록이 없어요.</p>':''}</div>`;
  // 국어
  const KR=C.results.filter(r=>r.at&&dkey(new Date(r.at))===k);
  const kol=KR.map(r=>{const arr=r.items||r.cards||[];const n=arr.length||r.qn||(r.ok!=null?1:0);const ok=arr.length?arr.filter(x=>x.ok).length:(r.qok!=null?r.qok:(r.ok?1:0));
    return `<li>${KOT[r.type]||esc(r.type||'기록')}${r.area?' · '+esc(r.area):''}${r.title?' · '+esc(r.title):''}${r.src?' · '+esc(r.src):''} — ${n?`<span class="${ok===n?'ok':''}">${ok}/${n}</span>`:''}${r.score!=null?` · ${r.score}점`:''}${r.done===false?' <span class="muted">(중간 저장)</span>':''}</li>`}).join('');
  const ko=(S.ko&&S.ko.actual)||{};
  h+=`<div class="card"><h2>📖 국어</h2>${ko.score!=null?`<div class="row">${stat(ko.score+'점','테스트 점수')}</div>`:''}${kol?`<ul>${kol}</ul>`:'<p class="muted">이날 국어 기록이 없어요.</p>'}</div>`;
  // 수학
  const MA=C.m32.filter(d=>d.date===k).flatMap(d=>d.items||[]);const MI=MA.filter(x=>x.mode==='solve');const mo=MI.filter(x=>x.res==='o'||x.res==='h').length,mx=MI.filter(x=>x.res==='x').length,ms=MI.filter(x=>x.res==='s').length;
  const mt=MA.reduce((a,x)=>a+(+x.sec||0),0);const ma=(S.math&&S.math.actual)||{};
  const MW=MI.filter(x=>x.res==='x'||x.res==='s'||x.fixed||(x.res==='h'&&x.pen)||(x.tutor&&x.tutor.turns&&x.tutor.turns.length));
  const mwl=MW.map(x=>`<li>${x.res==='s'?'⏭':x.res==='h'?'△':'❌'} ${esc(x.q)} <span class="muted">(정답 ${esc(x.ans)}${x.wrong&&x.wrong.length?` · 쓴 답 ${esc(x.wrong.join(', '))}`:''})</span>${x.pen?`<br><span class="muted">${x.pen.ph?`📷 사진 ${x.pen.ph} · `:''}✍️ 획 ${x.pen.n} · 첫 획 ${x.pen.first}초${x.pen.erase?` · 지우개 ${x.pen.erase}`:''}${x.pen.idle>=20?` · 가장 오래 멈춤 ${x.pen.idle}초`:''}</span><div class="pen" data-pen="${esc(x.pen.id)}"></div>`:'<br><span class="muted">손풀이 없음</span>'}${x.solSeen?' · 📖 풀이 봄':''}${x.tutor&&x.tutor.turns&&x.tutor.turns.length?`<div class="tut"><b>🧑‍🏫 AI 과외</b> <span class="muted">(${({solved:'스스로 찾음',fixed:'스스로 고침',stopped:'그만함',limit:'횟수 끝',error:'연결 안 됨'})[x.tutor.end]||''})</span>${x.tutor.read?`<div class="muted">읽은 식: ${esc(x.tutor.read)}</div>`:''}${x.tutor.turns.map(t=>`<div>${t.who==='ai'?'🧑‍🏫':'🙋'} ${esc(t.text)}</div>`).join('')}${(x.tutor.mom||[]).length?`<div><b>엄마 메모:</b> ${esc([...new Set(x.tutor.mom)].join(' / '))}</div>`:''}${x.tutor.shorter?`<div>💡 더 간단한 방법: ${esc(x.tutor.shorter)}</div>`:''}${x.learn&&(x.learn.nw||x.learn.use)?`<div>${({new:'💡 처음 알았어요',knew:'🙂 알던 거예요'})[x.learn.nw]||''} · ${({will:'👍 써 볼래요',mine:'✋ 내 방법이 더 편해요'})[x.learn.use]||''}</div>`:''}</div>`:''}${x.fixed?'<div class="muted">✏️ 패드에 쓰다가 스스로 고침</div>':''}${x.ts?`<div class="aslot" data-key="${esc(x.ts)}"></div><button class="abtn" data-one="${esc(x.ts)}">🔍 이 문제 AI 분석</button>`:''}</li>`).join('');
  h+=`<div class="card"><h2>🔢 수학</h2>${MI.length?`<div class="row">${stat(MI.length+'문제','푼 문제 (3-2)')}${stat(mo,'맞음')}${stat(mx,'틀림')}${ms?stat(ms,'건너뜀'):''}${mt?stat(Math.round(mt/60)+'분','수학 시간'):''}</div><div><button class="abtn" id="aday">🔍 이날 수학 AI 분석</button><button class="abtn" id="aweek">🔍 최근 7일 AI 분석</button><span class="muted" style="font-size:13px"> 1~3분 걸려요</span></div><div id="adayout"></div>${mwl?`<h3 style="font-size:16px;margin:12px 0 4px">✍️ 틀린 문제 · 손풀이 · AI 과외 대화</h3><ul>${mwl}</ul>`:''}`:ma.n?`<div class="row">${stat(ma.n+'문제','푼 문제')}${stat(ma.ok||0,'맞음')}</div>`:'<p class="muted">이날 수학 기록이 없어요.</p>'}</div>`;
  // 막힌 이유
  const ws=Object.entries(S).filter(([,v])=>v&&v.why&&v.why.length).map(([s,v])=>`<li><b>${{en:'영어',ko:'국어',math:'수학',sp:'특별'}[s]||s}</b>: ${v.why.map(w=>WHY[w]||w).join(', ')}</li>`).join('');
  h+=`<div class="card"><h2>🧭 시훈이가 고른 막힌 이유</h2>${ws?`<ul>${ws}</ul>`:'<p class="muted">이날은 고른 게 없어요.</p>'}<p class="muted">판단은 5일 이상 기록이 쌓인 뒤에 해요.</p></div>`;
  // 바뀐 것
  const ch=((C.changes&&C.changes.items)||[]).filter(x=>x.date===k);
  h+=`<div class="card"><h2>🔧 이날 앱에서 바뀐 것</h2>${ch.length?`<ul>${ch.map(x=>`<li>${esc(x.what)}</li>`).join('')}</ul>`:'<p class="muted">바뀐 것 없음</p>'}</div>`;
  h+=`<div class="card"><h2>📦 기록 내보내기</h2><p class="muted" style="font-size:14px">파일로 받아서 Claude에게 올리면 손풀이·대화까지 보고 가르치는 방법을 다듬어요.</p><div><button class="abtn" data-exp="1">이날</button><button class="abtn" data-exp="7">최근 7일</button><button class="abtn" data-exp="30">최근 30일</button></div><div id="expout" class="muted" style="font-size:14px"></div></div>`;
  h+=`<p class="muted"><a href="./">← 시훈 공부방</a> · 더 자세한 기록은 각 과목의 엄마 보기에서 볼 수 있어요.</p>`;
  M.innerHTML=h;
  document.querySelectorAll('.pen[data-pen]').forEach(async el=>{const d=await getD('m32pen/'+el.dataset.pen).catch(()=>null);if(d&&(d.img||(d.ph||[]).length)){el.innerHTML=d.img?`<img src="${d.img}" alt="손풀이">`:'';for(const q of (d.ph||[])){const pd=await getD('m32pen/'+q).catch(()=>null);if(pd&&pd.img)el.insertAdjacentHTML('beforeend',`<div class="muted">📷 종이 풀이 사진</div><img src="${pd.img}" alt="사진">`)}}else el.innerHTML='<span class="muted">손풀이를 못 불러왔어요</span>'});
  if(MI.length) mountAna(k,MI);
  document.getElementById('pv').onclick=()=>{day.setDate(day.getDate()-1);render()};
  document.getElementById('nx').onclick=()=>{day.setDate(day.getDate()+1);render()};
  document.getElementById('td').onclick=()=>{day=new Date();render()};
  document.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>exportRecs(k,+b.dataset.exp));
}
onAuthStateChanged(auth,u=>{
  if(!u){M.innerHTML=`<div class="gate"><h1>엄마 리포트</h1><p><button class="btn" id="li">구글로 로그인</button></p></div>`;document.getElementById('li').onclick=async()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});try{await signInWithPopup(auth,p)}catch(e){alert('로그인이 안 됐어요: '+(e.code||e.message))}};return}
  start();
});
</script>
</body>
</html>
